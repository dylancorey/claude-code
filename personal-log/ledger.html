<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dylan’s Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }

:root {
  --bg:        #F5F5F7;
  --surface:   #FFFFFF;
  --glass:     rgba(255,255,255,.72);
  --glass-hi:  rgba(255,255,255,.9);
  --ink:       #1B1B1F;
  --ink-2:     #5A5A63;
  --ink-3:     #6B717A;
  --line:      rgba(18,18,24,.09);
  --line-2:    rgba(18,18,24,.16);
  --accent:    #2F6BEB;
  --tint:      13%;

  --c-food:    #A44B09;
  --c-screen:  #4F52D8;
  --c-live:    #B82A65;
  --c-place:   #0E716A;

  --shadow-1:  0 1px 2px rgba(16,17,22,.05), 0 1px 1px rgba(16,17,22,.03);
  --shadow-2:  0 10px 28px -10px rgba(16,17,22,.18), 0 2px 6px rgba(16,17,22,.05);
  --shadow-3:  0 32px 70px -20px rgba(16,17,22,.34), 0 4px 12px rgba(16,17,22,.08);

  --r-sm: 8px; --r: 11px; --r-lg: 15px; --r-pill: 999px;
  --ease: cubic-bezier(.22,.75,.2,1);
  --spring: cubic-bezier(.34,1.32,.5,1);

  --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0E0F12;
    --surface:   #17181C;
    --glass:     rgba(30,31,36,.72);
    --glass-hi:  rgba(255,255,255,.07);
    --ink:       #F1F1F4;
    --ink-2:     #A3A4AC;
    --ink-3:     #8E959F;
    --line:      rgba(255,255,255,.10);
    --line-2:    rgba(255,255,255,.18);
    --accent:    #6E93F7;
    --tint:      17%;
    --c-food:    #F5883C;
    --c-screen:  #8C8EF5;
    --c-live:    #F0619B;
    --c-place:   #3FBDB0;
    --shadow-1:  0 1px 2px rgba(0,0,0,.5);
    --shadow-2:  0 10px 28px -10px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
    --shadow-3:  0 32px 70px -20px rgba(0,0,0,.85), 0 4px 12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:        #0E0F12;
  --surface:   #17181C;
  --glass:     rgba(30,31,36,.72);
  --glass-hi:  rgba(255,255,255,.07);
  --ink:       #F1F1F4;
  --ink-2:     #A3A4AC;
  --ink-3:     #8E959F;
  --line:      rgba(255,255,255,.10);
  --line-2:    rgba(255,255,255,.18);
  --accent:    #6E93F7;
  --tint:      17%;
  --c-food:    #F5883C;
  --c-screen:  #8C8EF5;
  --c-live:    #F0619B;
  --c-place:   #3FBDB0;
  --shadow-1:  0 1px 2px rgba(0,0,0,.5);
  --shadow-2:  0 10px 28px -10px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  --shadow-3:  0 32px 70px -20px rgba(0,0,0,.85), 0 4px 12px rgba(0,0,0,.5);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.cat-food   { --cat: var(--c-food); }
.cat-screen { --cat: var(--c-screen); }
.cat-live   { --cat: var(--c-live); }
.cat-place  { --cat: var(--c-place); }

.wrap { max-width: 78rem; margin: 0 auto; padding: 0 1.75rem 6rem; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-2);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--surface); }
}

/* ---------- masthead ---------- */
.mast { padding: 3.25rem 0 0; }
.mast h1 {
  font-weight: 700; font-size: clamp(1.9rem, 3.6vw, 2.5rem);
  letter-spacing: -.028em; line-height: 1.1; margin: 0;
}
.mast .dek { color: var(--ink-2); margin: .4rem 0 0; max-width: 48ch; }
.mast .accent-bar {
  height: 3px; width: 4.5rem; margin-top: 1rem; border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--c-food), var(--c-screen), var(--c-live), var(--c-place));
}

.stats { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: 1.5rem; }
.stat {
  background: none; border: 1px solid transparent; border-radius: var(--r-pill);
  padding: .35rem .75rem; cursor: pointer; color: var(--ink-2);
  display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 500;
  transition: background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.stat:hover { background: var(--surface); color: var(--ink); }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat[aria-pressed="true"] {
  background: var(--surface); border-color: var(--line); color: var(--ink);
  box-shadow: var(--shadow-1);
}
.stat[aria-pressed="true"] .v { color: var(--cat, var(--accent)); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem; margin-top: .875rem; }
.tools .spacer { flex: 1 1 auto; }
.tool {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .8rem; cursor: pointer; font-weight: 500; color: var(--ink);
  box-shadow: var(--shadow-1); display: inline-flex; align-items: center; gap: .4rem;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease), border-color .16s var(--ease);
}
.tool:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.tool:hover svg { color: var(--accent); }
.tool:active { transform: translateY(0) scale(.98); }
.tool .c { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: .8125rem; }
.tool svg { width: 15px; height: 15px; flex: none; transition: color .16s var(--ease); }

.seg3 {
  display: inline-flex; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 2px; box-shadow: var(--shadow-1);
}
.seg3 button {
  background: none; border: 0; border-radius: var(--r-pill); cursor: pointer;
  padding: .28rem .6rem; color: var(--ink-3); font-size: .8125rem; font-weight: 500;
  display: inline-flex; align-items: center; gap: .3rem;
  transition: background .16s var(--ease), color .16s var(--ease);
}
.seg3 button:hover { color: var(--ink); }
.seg3 button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: var(--shadow-1); }
.seg3 svg { width: 14px; height: 14px; }
.seg3 .c { color: inherit; opacity: .65; font-variant-numeric: tabular-nums; font-size: .75rem; margin-left: .3rem; }

/* ---------- notices ---------- */
.notice {
  display: flex; flex-wrap: wrap; align-items: center; gap: .625rem 1.25rem;
  margin-top: 1.5rem; padding: .875rem 1.125rem;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.notice p { margin: 0; color: var(--ink-2); font-size: .9375rem; }
.notice strong { color: var(--ink); font-weight: 600; }
.notice .spacer { flex: 1 1 auto; }
.otd { border-left: 3px solid var(--cat, var(--accent)); }
.otd .ago { color: var(--ink-3); font-size: .8125rem; }
.otd button.link {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--line-2);
}
.otd button.link:hover { color: var(--cat); }

/* ---------- controls ---------- */
.controls {
  position: sticky; top: .625rem; z-index: 30; margin-top: 1.5rem;
  border-radius: var(--r-lg); padding: .625rem;
  border: 1px solid var(--line);
}
.row { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; }
.search {
  flex: 1 1 15rem; min-width: 0; background: var(--bg); color: var(--ink);
  border: 1px solid transparent; border-radius: var(--r); padding: .5rem .75rem;
  font-size: .9375rem; transition: border-color .16s var(--ease);
}
.search:focus { border-color: var(--accent); outline: none; }
.search::placeholder { color: var(--ink-3); }

.pill {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .75rem; cursor: pointer; color: var(--ink-2); font-weight: 500;
  font-size: .875rem; transition: all .16s var(--ease);
}
.pill:hover { color: var(--ink); border-color: var(--line-2); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.pill .n {
  display: inline-flex; align-items: center; justify-content: center; min-width: 1.1rem; height: 1.1rem;
  border-radius: var(--r-pill); background: var(--accent); color: #fff; font-size: .6875rem;
  font-weight: 600; padding: 0 .3rem; margin-left: .3rem;
}
.filter-trigger { display: none; }
.filter-sheet { display: contents; }

.select {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .6rem; cursor: pointer; color: var(--ink-2); font-size: .875rem;
}
.btn {
  background: var(--accent); color: #fff; border: 1px solid transparent;
  border-radius: var(--r-pill); padding: .45rem .9rem; cursor: pointer; font-weight: 600;
  font-size: .875rem; box-shadow: var(--shadow-1);
  transition: transform .16s var(--ease), filter .16s var(--ease);
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
.btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { filter: none; background: var(--bg); }
.btn-danger { background: none; color: var(--c-live); border-color: var(--c-live); box-shadow: none; }
.btn-danger:hover { background: var(--c-live); color: #fff; filter: none; }

.tagbar { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: .5rem; padding: 0 .125rem; }
.tagbar .head { color: var(--ink-3); font-size: .75rem; margin-right: .2rem; }
.tagchip {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .2rem .55rem; cursor: pointer; color: var(--ink-2); font-size: .8125rem;
  display: inline-flex; align-items: center; gap: .35rem; transition: all .16s var(--ease);
}
.tagchip:hover { border-color: var(--line-2); color: var(--ink); }
.tagchip .n { font-size: .6875rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tagchip[aria-pressed="true"], .tagchip.is-on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tagchip[aria-pressed="true"] .n, .tagchip.is-on .n { color: var(--bg); opacity: .65; }
.tagchip.is-on:hover { background: var(--c-live); border-color: var(--c-live); color: var(--bg); }
.linkish {
  background: none; border: 0; padding: 0 .25rem; cursor: pointer; color: var(--accent);
  font-size: .8125rem; font-weight: 500;
}
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- toasts ---------- */
.toast-stack {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
  z-index: 60; display: flex; flex-direction: column-reverse; gap: .5rem; align-items: center;
  max-width: calc(100vw - 2rem);
}
.savebar {
  display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; justify-content: center;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: .5rem .9rem; font-size: .8125rem; font-weight: 500;
  box-shadow: var(--shadow-2); transition: opacity .16s var(--ease), transform .16s var(--ease);
}
.savebar[hidden] { display: none; }
.savebar.is-success { color: var(--ink); }
.savebar.is-error { color: var(--c-live); border-color: var(--c-live); }
.savebar .linkish { padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- sections + cards ---------- */
.section-head { display: flex; align-items: baseline; gap: .625rem; margin: 2.25rem 0 .75rem; padding: 0 .125rem; }
.section-head h2 { margin: 0; font-weight: 600; font-size: 1.0625rem; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.section-head .count { color: var(--ink-3); font-size: .8125rem; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18.5rem, 1fr)); gap: .75rem; }
.card {
  position: relative; display: flex; flex-direction: column; gap: .5rem; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1); padding: 1.125rem 1.0625rem .875rem; min-height: 11rem;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
}
.card::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--cat); opacity: .82;
}
.card:hover {
  transform: translateY(-3px); box-shadow: var(--shadow-2);
  border-color: color-mix(in srgb, var(--cat) 32%, var(--line));
  background: color-mix(in srgb, var(--cat) 3%, var(--surface));
}
.card-top { display: flex; align-items: center; gap: .35rem; }
.card-top .spacer { flex: 1 1 auto; }
.card-top .when { color: var(--ink-3); font-size: .75rem; white-space: nowrap; }

.chip {
  border-radius: var(--r-pill); padding: .17rem .5rem; font-size: .6875rem; font-weight: 600;
  white-space: nowrap; background: var(--cat); color: #fff;
}
.chip-cat { background: color-mix(in srgb, var(--cat) var(--tint), transparent); color: var(--cat); }
.chip-soft { background: var(--bg); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }

.card-title { margin: 0; font-size: 1.0625rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
.card-title button {
  background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  letter-spacing: inherit; text-align: left; color: inherit;
}
.card-title button::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); }
.card:hover .card-title button { color: var(--cat); }
.card-meta { margin: 0; color: var(--ink-3); font-size: .8125rem; }
.card-meta .away {
  color: var(--cat); font-weight: 600; margin-right: .4rem;
  padding-right: .4rem; border-right: 1px solid var(--line);
}
.card-note {
  margin: 0; color: var(--ink-2); font-size: .875rem; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-tags { margin-top: auto; padding-top: .5rem; display: flex; flex-wrap: wrap; gap: .3rem; }
.minitag { color: var(--ink-3); font-size: .75rem; }
.minitag::before { content: "#"; opacity: .5; }
.maplink {
  position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--r-pill); color: var(--ink-3);
  border: 1px solid transparent; text-decoration: none; transition: all .16s var(--ease);
}
.maplink:hover { color: var(--cat); border-color: var(--line); background: var(--bg); }
.maplink svg { width: 14px; height: 14px; }
.again-mark { display: inline-flex; width: 15px; height: 15px; flex: none; }
.again-mark svg { width: 15px; height: 15px; }
.again-mark.yes { color: var(--cat); }
.again-mark.no { color: var(--ink-3); opacity: .5; }

.empty { padding: 4rem 0; }
.empty .glyph {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.75rem; height: 2.75rem; border-radius: var(--r-lg); margin-bottom: 1rem;
  background: color-mix(in srgb, var(--accent) var(--tint), transparent); color: var(--accent);
}
.empty .glyph svg { width: 20px; height: 20px; }
.empty h2 { margin: 0 0 .375rem; font-weight: 600; font-size: 1.375rem; letter-spacing: -.02em; }
.empty p { margin: 0; color: var(--ink-2); max-width: 44ch; }
.empty .btn { margin-top: 1.25rem; }

/* ---------- dialog ---------- */
dialog {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3); padding: 0;
  width: min(40rem, 94vw); max-height: 88vh;
}
dialog.cat-food, dialog.cat-screen, dialog.cat-live, dialog.cat-place { border-top: 3px solid var(--cat); }
dialog[open] { animation: pop .24s var(--spring); }
dialog::backdrop { background: rgba(10,10,14,.42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.975); } to { opacity: 1; transform: none; } }

.dlg-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1.25rem 1.5rem .75rem; }
.dlg-head h2 { margin: 0; font-weight: 650; font-size: 1.375rem; letter-spacing: -.022em; line-height: 1.2; }
.dlg-head .spacer { flex: 1 1 auto; }
.dlg-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
.dlg-body { padding: 0 1.5rem 1.25rem; overflow-y: auto; max-height: calc(88vh - 9.5rem); }
.dlg-foot {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  padding: .875rem 1.5rem 1.125rem; border-top: 1px solid var(--line);
}
.dlg-foot .spacer { flex: 1 1 auto; }
.dlg-foot .warn { color: var(--c-live); font-size: .8125rem; }
.closex {
  background: var(--bg); border: 0; border-radius: var(--r-pill); cursor: pointer;
  color: var(--ink-3); width: 28px; height: 28px; font-size: 1.0625rem; line-height: 1; flex: none;
}
.closex:hover { color: var(--ink); }

.detail-note { margin: 0 0 1.25rem; font-size: 1rem; line-height: 1.6; max-width: 62ch; white-space: pre-wrap; }
.detail-note .none { color: var(--ink-3); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .875rem 1.25rem; margin: 0 0 1.25rem; }
.fact { display: flex; flex-direction: column; gap: .1rem; }
.fact dt { color: var(--ink-3); font-size: .75rem; }
.fact dd { margin: 0; font-weight: 500; }
.detail-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.maplink-full {
  display: inline-flex; align-items: center; gap: .4rem; text-decoration: none;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .8rem; color: var(--ink); font-weight: 500; font-size: .875rem;
}
.maplink-full:hover { border-color: var(--line-2); }
.maplink-full svg { width: 15px; height: 15px; color: var(--cat); }

/* ---------- form ---------- */
.fieldset { margin: 0 0 1.125rem; }
.flabel { display: block; margin-bottom: .35rem; color: var(--ink-3); font-size: .75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .375rem; }
.seg button {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .75rem; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .875rem;
  transition: all .16s var(--ease);
}
.seg button:hover { border-color: var(--line-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--cat, var(--ink)); border-color: transparent; color: #fff; }
.seg.plain button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .875rem; }
.field { display: block; margin-bottom: 1rem; }
.field input, .field textarea, .field select {
  background: var(--bg); border: 1px solid transparent; color: var(--ink);
  border-radius: var(--r); padding: .55rem .7rem; font-size: .9375rem; width: 100%;
  transition: border-color .16s var(--ease);
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.field textarea { resize: vertical; min-height: 7.5rem; line-height: 1.55; }
.field .hint { display: block; margin-top: .3rem; color: var(--ink-3); font-size: .8125rem; }

/* ---------- spin reel ---------- */
.reel-wrap { padding: 1rem 0 1.25rem; }
.reel {
  position: relative; height: 174px; overflow: hidden; border-radius: var(--r-lg);
  background: var(--bg); border: 1px solid var(--line);
}
.reel-strip { will-change: transform; }
.reel-item {

    for (var i = 0; i < allowed.length; i++) if (allowed[i][0] === entry.status) return entry.status;
    return 'logged';
  }
  function statusLabel(entry) {
    var allowed = CATS[catOf(entry)].statuses, s = statusOf(entry);
    for (var i = 0; i < allowed.length; i++) if (allowed[i][0] === s) return allowed[i][1];
    return s;
  }
  function yearOf(entry) {
    if (entry.date) return entry.date.slice(0, 4);
    if (entry.createdAt) return entry.createdAt.slice(0, 4);
    return 'Undated';
  }
  function tagsOf(entry) { return Array.isArray(entry.tags) ? entry.tags : []; }
  function cityOf(entry) { return (entry.fields && entry.fields.city) || ''; }

  function dayLabel(date) {
    if (!date) return 'Undated';
    var parts = date.split('-');
    var m = parseInt(parts[1], 10);
    if (!m || m < 1 || m > 12) return date;
    if (!parts[2]) return MONTHS[m - 1] + ' ' + parts[0];
    return MONTHS[m - 1] + ' ' + parseInt(parts[2], 10);
  }

  function daysSince(date) {
    if (!date || date.length < 10) return null;
    var t = Date.parse(date + 'T12:00:00');
    if (isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }

  function norm(v) {
    return ' ' + String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  }
  function homeTerms() {
    return String(state.home || '').split(',').map(norm).filter(function (t) { return t.trim().length > 0; });
  }
  function homeLabel() { return String(state.home || '').split(',')[0].trim(); }

  function cityFromAddress(address) {
    var parts = String(address || '').split(',').map(function (p) { return p.trim(); }).filter(Boolean);
    return parts.length >= 2 ? parts[1] : '';
  }

  function isAway(entry) {
    var city = cityOf(entry).trim();
    if (!city) city = cityFromAddress(entry.fields && entry.fields.address).trim();
    if (!city) return 'unknown';
    var terms = homeTerms();
    if (!terms.length) return 'unknown';
    var hay = norm(city);
    for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) !== -1) return 'home';
    return 'away';
  }

  function mapUrl(entry) {
    if (catOf(entry) === 'screen') return '';
    var f = entry.fields || {};
    var q = f.address;
    if (!q) {
      var bits = [entry.title, f.venue, f.city].filter(Boolean);
      if (bits.length < 2) return '';
      q = bits.join(', ');
    }
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  function fieldDefs(category) { return CATS[CATS[category] ? category : 'food'].fields; }

  function summaryBits(entry) {
    var bits = [];
    CATS[catOf(entry)].summary.forEach(function (key) {
      var val = entry.fields && entry.fields[key];
      if (val) bits.push(val);
    });
    if (entry['with']) bits.push('with ' + entry['with']);
    return bits;
  }

  function haystack(entry) {
    var parts = [entry.title, entry.note, entry['with'], CATS[catOf(entry)].label];
    if (entry.fields) Object.keys(entry.fields).forEach(function (k) { parts.push(entry.fields[k]); });
    return parts.concat(tagsOf(entry)).join(' ').toLowerCase();
  }

  function wishlist() {
    return state.entries.filter(function (e) {
      return statusOf(e) === 'wishlist' && (ui.cat === 'all' || catOf(e) === ui.cat);
    });
  }
  function mainEntries() { return state.entries.filter(function (e) { return statusOf(e) !== 'wishlist'; }); }
  function wantToEntries() { return state.entries.filter(function (e) { return statusOf(e) === 'wishlist'; }); }
  function dishes() {
    return state.entries.filter(function (e) { return catOf(e) === 'food' && e.fields && e.fields.dish; });
  }

  function onThisDay() {
    var now = new Date();
    var md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var yr = String(now.getFullYear());
    return state.entries.filter(function (e) {
      return e.date && e.date.length === 10 && e.date.slice(5) === md && e.date.slice(0, 4) < yr;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function thisWeekCount() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 7);
    return state.entries.filter(function (e) {
      if (statusOf(e) === 'wishlist' || !e.date || e.date.length !== 10) return false;
      var t = Date.parse(e.date + 'T12:00:00');
      return !isNaN(t) && t >= start.getTime() && t < end.getTime();
    }).length;
  }

  function yearsWithEntries() {
    var seen = Object.create(null);
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist') return;
      var y = e.date ? e.date.slice(0, 4) : (e.createdAt ? e.createdAt.slice(0, 4) : null);
      if (y) seen[y] = true;
    });
    return Object.keys(seen).sort().reverse();
  }

  function trulyUndated() {
    return state.entries.filter(function (e) { return !e.date && !e.createdAt && statusOf(e) !== 'wishlist'; });
  }

  function topOf(map, n) {
    return Object.keys(map)
      .sort(function (a, b) { return map[b] - map[a] || a.localeCompare(b); })
      .slice(0, n).map(function (k) { return { key: k, n: map[k] }; });
  }

  function reviewFor(year) {
    var r = { year: year, total: 0, approx: 0, cat: { food: 0, screen: 0, live: 0, place: 0 }, tags: {}, people: {},
              months: {}, cities: {}, away: 0, unknown: 0, first: null, last: null };
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist') return;
      var y = e.date ? e.date.slice(0, 4) : (e.createdAt ? e.createdAt.slice(0, 4) : null);
      if (y !== year) return;
      r.total++;
      if (!e.date) r.approx++;
      r.cat[catOf(e)]++;
      tagsOf(e).forEach(function (t) { r.tags[t] = (r.tags[t] || 0) + 1; });
      String(e['with'] || '').split(/,| and /).forEach(function (raw) {
        var who = raw.trim();
        if (who) r.people[who] = (r.people[who] || 0) + 1;
      });
      if (e.date) r.months[e.date.slice(5, 7)] = (r.months[e.date.slice(5, 7)] || 0) + 1;
      var c = cityOf(e).trim();
      if (c) r.cities[c] = (r.cities[c] || 0) + 1;
      var awayState = isAway(e);
      if (awayState === 'away') r.away++;
      else if (awayState === 'unknown') r.unknown++;
      if (e.date) {
        if (!r.first || e.date < r.first.date) r.first = e;
        if (!r.last || e.date > r.last.date) r.last = e;
      }
    });
    return r;
  }

  function reviewWindow(days) {
    var since = Date.now() - days * 86400000;
    var r = { total: 0, cat: { food: 0, screen: 0, live: 0, place: 0 }, tags: {}, people: {},
              cities: {}, away: 0, unknown: 0, first: null, last: null };
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist' || !e.date) return;
      var t = Date.parse(e.date + 'T12:00:00');
      if (isNaN(t) || t < since) return;
      r.total++;
      r.cat[catOf(e)]++;
      tagsOf(e).forEach(function (tg) { r.tags[tg] = (r.tags[tg] || 0) + 1; });
      peopleOf(e).forEach(function (who) { r.people[who] = (r.people[who] || 0) + 1; });
      var c = cityOf(e).trim();
      if (c) r.cities[c] = (r.cities[c] || 0) + 1;
      var awayState = isAway(e);
      if (awayState === 'away') r.away++;
      else if (awayState === 'unknown') r.unknown++;
      if (!r.first || e.date < r.first.date) r.first = e;
      if (!r.last || e.date > r.last.date) r.last = e;
    });
    return r;
  }

  function reviewAll() {
    var r = { total: 0, cat: { food: 0, screen: 0, live: 0, place: 0 }, tags: {}, people: {},
              cities: {}, titles: {}, away: 0, unknown: 0, first: null, last: null };
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist') return;
      r.total++;
      r.cat[catOf(e)]++;
      tagsOf(e).forEach(function (tg) { r.tags[tg] = (r.tags[tg] || 0) + 1; });
      peopleOf(e).forEach(function (who) { r.people[who] = (r.people[who] || 0) + 1; });
      var c = cityOf(e).trim();
      if (c) r.cities[c] = (r.cities[c] || 0) + 1;
      var tkey = catOf(e) + '|' + norm(e.title);
      if (!r.titles[tkey]) r.titles[tkey] = { title: e.title, cat: catOf(e), n: 0 };
      r.titles[tkey].n++;
      var awayState = isAway(e);
      if (awayState === 'away') r.away++;
      else if (awayState === 'unknown') r.unknown++;
      if (e.date) {
        if (!r.first || e.date < r.first.date) r.first = e;
        if (!r.last || e.date > r.last.date) r.last = e;
      }
    });
    return r;
  }

  function longestWeekStreak() {
    var WEEK = 7 * 86400000;
    var weeks = {};
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist' || !e.date) return;
      var t = Date.parse(e.date + 'T12:00:00');
      if (isNaN(t)) return;
      weeks[Math.floor(t / WEEK)] = true;
    });
    var idx = Object.keys(weeks).map(Number).sort(function (a, b) { return a - b; });
    if (!idx.length) return 0;
    var best = 1, run = 1;
    for (var i = 1; i < idx.length; i++) {
      if (idx[i] === idx[i - 1] + 1) { run++; if (run > best) best = run; }
      else run = 1;
    }
    return best;
  }

  function neighborhoodCoverage() {
    var terms = String(state.home || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);
    return terms.map(function (t) {
      var hay = norm(t);
      var n = 0;
      state.entries.forEach(function (e) {
        if (statusOf(e) === 'wishlist') return;
        var city = cityOf(e).trim();
        if (!city) return;
        if (norm(city).indexOf(hay) !== -1) n++;
      });
      return { term: t, n: n };
    });
  }

  function neighborhoodBlock() {
    var cov = neighborhoodCoverage();
    if (cov.length < 2) return '';
    var never = cov.filter(function (c) { return c.n === 0; });
    var seen = cov.filter(function (c) { return c.n > 0; }).sort(function (a, b) { return b.n - a.n; });
    return '<div class="block"><h3>Your neighborhoods</h3>'
      + (seen.length ? '<div class="detail-tags">' + seen.map(function (c) {
          return '<span class="tagchip" style="cursor:default">' + esc(c.term) + '<span class="n">' + c.n + '</span></span>';
        }).join('') + '</div>' : '<p class="none">Nothing logged in any home neighborhood yet.</p>')
      + (never.length ? '<p class="disc-hint" style="margin-top:.625rem">Never logged: ' + never.map(function (c) { return esc(c.term); }).join(', ') + '.</p>' : '')
      + '</div>';
  }

  function brokenPromises() {
    var latest = {};
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist') return;
      var key = catOf(e) + '|' + norm(e.title);
      var when = e.date || (e.createdAt ? e.createdAt.slice(0, 10) : '');
      if (when && (!latest[key] || when > latest[key])) latest[key] = when;
    });
    var out = [];
    state.entries.forEach(function (e) {
      if (statusOf(e) === 'wishlist' || e.again !== true) return;
      var key = catOf(e) + '|' + norm(e.title);
      var when = e.date || (e.createdAt ? e.createdAt.slice(0, 10) : '');
      if (when && latest[key] && latest[key] > when) return;
      out.push({ entry: e, days: daysSince(e.date || (e.createdAt ? e.createdAt.slice(0, 10) : '')) });
    });
    out.sort(function (a, b) {
      if (a.days === null && b.days === null) return a.entry.title.localeCompare(b.entry.title);
      if (a.days === null) return 1;
      if (b.days === null) return -1;
      return b.days - a.days;
    });
    return out;
  }

  /* ---------------- recommendations ---------------- */

  function recommend() {
    var done = state.entries.filter(function (e) { return statusOf(e) !== 'wishlist'; });
    var pool = state.entries.filter(function (e) { return statusOf(e) === 'wishlist'; });
    var tagW = {}, cityW = {}, kindW = {}, catLast = {};
    var againTag = {}, againCity = {}, againKind = {};

    done.forEach(function (e) {
      tagsOf(e).forEach(function (t) { tagW[t] = (tagW[t] || 0) + 1; });
      var c = norm(cityOf(e)).trim();
      if (c) cityW[c] = (cityW[c] || 0) + 1;
      var f = e.fields || {};
      [f.cuisine, f.kind].forEach(function (k) {
        if (k) { k = k.toLowerCase(); kindW[k] = (kindW[k] || 0) + 1; }
      });
      var d = daysSince(e.date), cat = catOf(e);
      if (d !== null && (catLast[cat] === undefined || d < catLast[cat])) catLast[cat] = d;

      if (e.again === true || e.again === false) {
        var sign = e.again === true ? 1 : -1;
        tagsOf(e).forEach(function (t) { againTag[t] = (againTag[t] || 0) + sign; });
        if (c) againCity[c] = (againCity[c] || 0) + sign;
        [f.cuisine, f.kind].forEach(function (k) { if (k) { k = k.toLowerCase(); againKind[k] = (againKind[k] || 0) + sign; } });
      }
    });

    var picks = pool.map(function (e) {
      var score = 0, why = [];
      var hits = tagsOf(e).filter(function (t) { return tagW[t]; });
      if (hits.length) {
        var weight = hits.reduce(function (a, t) { return a + tagW[t]; }, 0);
        score += weight * 2;
        why.push(hits.length > 1
          ? 'shares ' + hits.length + ' tags with things you already logged'
          : tagW[hits[0]] === 1
            ? 'another entry is tagged ' + hits[0]
            : tagW[hits[0]] + ' of your entries are tagged ' + hits[0]);
      }
      var c = norm(cityOf(e)).trim();
      if (c && cityW[c]) { score += cityW[c] * 1.5; why.push('you keep ending up around ' + cityOf(e)); }
      var f = e.fields || {};
      [f.cuisine, f.kind].forEach(function (k) {
        if (k && kindW[k.toLowerCase()]) {
          score += kindW[k.toLowerCase()];
          why.push(k.toLowerCase() + ' is a repeat pattern for you');
        }
      });
      var again = 0;
      tagsOf(e).forEach(function (t) { again += againTag[t] || 0; });
      if (c && againCity[c]) again += againCity[c];
      [f.cuisine, f.kind].forEach(function (k) { if (k && againKind[k.toLowerCase()]) again += againKind[k.toLowerCase()]; });
      if (again) {
        score += again * 2;
        why.push(again > 0
          ? 'similar to something you’d ' + (catOf(e) === 'screen' ? 'watch' : 'do') + ' again'
          : 'similar to something you said you would not do again');
      }

      var cat = catOf(e), gap = catLast[cat];
      if (gap === undefined) { score += 3; why.push('nothing logged in this category yet'); }
      else if (gap > 45) {
        score += Math.min(gap / 20, 5);
        why.push('it has been ' + gap + ' days since your last ' + CATS[cat].short.toLowerCase() + ' entry');
      }
      if (!why.length) why.push('still sitting on the want-to list');
      return { entry: e, score: score, why: why.slice(0, 2).join(' \u00b7 ') };
    }).sort(function (a, b) { return b.score - a.score || a.entry.title.localeCompare(b.entry.title); });

    return { picks: picks.slice(0, 3), notes: observations(done) };
  }

  function observations(done) {
    var out = [];
    var last = {};
    done.forEach(function (e) {
      var d = daysSince(e.date);
      if (d === null) return;
      String(e['with'] || '').split(/,| and /).forEach(function (raw) {
        var who = raw.trim();
        if (who && (last[who] === undefined || d < last[who])) last[who] = d;
      });
    });
    var stale = Object.keys(last).filter(function (w) { return last[w] > 60; })
      .sort(function (a, b) { return last[b] - last[a]; });
    if (stale.length) out.push('Nothing logged with ' + stale[0] + ' in ' + last[stale[0]] + ' days.');

    var tagW = {};
    done.forEach(function (e) { tagsOf(e).forEach(function (t) { tagW[t] = (tagW[t] || 0) + 1; }); });
    var top = topOf(tagW, 1)[0];
    if (top && top.n > 1) out.push('Your most-repeated tag is ' + top.key + ', on ' + top.n + ' entries.');

    var withDish = done.filter(function (e) { return catOf(e) === 'food' && e.fields && e.fields.dish; });
    if (withDish.length) {
      var pick = withDish[Math.floor(Math.random() * withDish.length)];
      out.push('At ' + pick.title + ', past you said: ' + pick.fields.dish + '.');
    }
    return out.slice(0, 3);
  }

  /* ---------------- related ---------------- */

  function relatedTo(entry) {
    var mine = peopleOf(entry).map(function (p) { return p.toLowerCase(); });
    var myCity = norm(cityOf(entry)).trim();
    var myTags = tagsOf(entry);
    var out = [];

    state.entries.forEach(function (other) {
      if (other.id === entry.id) return;
      var score = 0, why = [];

      var shared = peopleOf(other).filter(function (p) { return mine.indexOf(p.toLowerCase()) !== -1; });
      if (shared.length) { score += 3 * shared.length; why.push('with ' + shared.join(', ')); }

      var otherCity = norm(cityOf(other)).trim();
      if (myCity && otherCity === myCity) { score += 2; why.push('also ' + cityOf(other)); }

      var sharedTags = tagsOf(other).filter(function (t) { return myTags.indexOf(t) !== -1; });
      if (sharedTags.length) {
        score += sharedTags.length;
        why.push(sharedTags.map(function (t) { return '#' + t; }).join(' '));
      }

      if (catOf(other) === catOf(entry)) { score += 1; if (!why.length) why.push('same category'); }

      if (score > 1) out.push({ entry: other, score: score, why: why.join(' · ') });
    });

    out.sort(function (a, b) {
      return b.score - a.score || a.entry.title.localeCompare(b.entry.title);
    });
    return out.slice(0, 4);
  }

  /* ---------------- selection ---------------- */

  function peopleOf(entry) {
    return String(entry['with'] || '').split(/,| and /).map(function (p) { return p.trim(); }).filter(Boolean);
  }

  function companionStrip() {
    if (!ui.who) return '';
    var who = ui.who;
    var withPerson = state.entries.filter(function (e) {
      return peopleOf(e).some(function (p) { return p.toLowerCase() === who.toLowerCase(); });
    });
    if (!withPerson.length) return '';
    var display = who;
    for (var i = 0; i < withPerson.length; i++) {
      var m = peopleOf(withPerson[i]).filter(function (p) { return p.toLowerCase() === who.toLowerCase(); })[0];
      if (m) { display = m; break; }
    }
    var done = withPerson.filter(function (e) { return statusOf(e) !== 'wishlist'; });
    var want = withPerson.filter(function (e) { return statusOf(e) === 'wishlist'; });
    var lastGap = null;
    done.forEach(function (e) {
      var d = daysSince(e.date);
      if (d !== null && (lastGap === null || d < lastGap)) lastGap = d;
    });
    var bits = [done.length + ' ' + (done.length === 1 ? 'outing' : 'outings') + ' together'];
    if (lastGap !== null) bits.push(lastGap === 0 ? 'last one today' : 'last one ' + lastGap + ' day' + (lastGap === 1 ? '' : 's') + ' ago');
    if (want.length) bits.push(want.length + ' on the want-to list');
    var otherTab = ui.tab === 'wantto' ? 'main' : 'wantto';
    var switchLabel = ui.tab === 'wantto' ? 'See what we\u2019ve done' : 'See our want-to list';
    var canSwitch = ui.tab === 'wantto' ? done.length > 0 : want.length > 0;
    return '<div class="notice">'
      + '<p><strong>' + esc(display) + '</strong> \u00b7 ' + esc(bits.join(' \u00b7 ')) + '</p>'
      + '<span class="spacer"></span>'
      + (canSwitch ? '<button type="button" class="linkish" data-act="tab" data-tab="' + otherTab + '">' + esc(switchLabel) + '</button>' : '')
      + '</div>';
  }
  function passesWho(entry) {
    if (!ui.who) return true;
    var want = ui.who.toLowerCase();
    return peopleOf(entry).some(function (p) { return p.toLowerCase() === want; });
  }
  function passesBase(entry, q) {
    if (ui.cat !== 'all' && catOf(entry) !== ui.cat) return false;
    if (ui.tab !== 'wantto' && ui.status !== 'all' && statusOf(entry) !== ui.status) return false;
    if (!passesWho(entry)) return false;
    if (q && haystack(entry).indexOf(q) === -1) return false;
    return true;
  }
  function passesTags(entry) {
    var have = tagsOf(entry);
    return ui.tags.every(function (t) { return have.indexOf(t) !== -1; });
  }
  function visible() {
    var q = ui.q.trim().toLowerCase();
    return mainEntries().filter(function (e) { return passesBase(e, q) && passesTags(e); }).sort(compare);
  }
  function compare(a, b) {
    if (ui.sort === 'az') return a.title.localeCompare(b.title);
    var dir = ui.sort === 'old' ? 1 : -1;
    var da = a.date || a.createdAt || '', db = b.date || b.createdAt || '';
    if (!da && !db) return a.title.localeCompare(b.title);
    if (!da) return 1;
    if (!db) return -1;
    if (da === db) return a.title.localeCompare(b.title);
    return da < db ? dir : -dir;
  }
  function visibleWantTo() {
    var q = ui.q.trim().toLowerCase();
    return wantToEntries().filter(function (e) { return passesBase(e, q) && passesTags(e); }).sort(function (a, b) {
      var ca = a.createdAt || '', cb = b.createdAt || '';
      if (!ca && !cb) return a.title.localeCompare(b.title);
      if (!ca) return 1;
      if (!cb) return -1;
      return ca === cb ? a.title.localeCompare(b.title) : (ca > cb ? -1 : 1);
    });
  }
  function groups(list) {
    if (ui.sort === 'az') return list.length ? [{ key: 'A to Z', items: list }] : [];
    var order = [], byKey = Object.create(null);
    list.forEach(function (entry) {
      var key = yearOf(entry);
      if (!byKey[key]) { byKey[key] = []; order.push(key); }
      byKey[key].push(entry);
    });
    return order.map(function (key) { return { key: key, items: byKey[key] }; });
  }
  function tagCounts() {
    var q = ui.q.trim().toLowerCase();
    var pool = ui.tab === 'wantto' ? wantToEntries() : mainEntries();
    var counts = Object.create(null);
    pool.forEach(function (entry) {
      if (!passesBase(entry, q) || !passesTags(entry)) return;
      tagsOf(entry).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    ui.tags.forEach(function (t) { if (!(t in counts)) counts[t] = 0; });

  function filtersOn() {
    return !!(ui.q || ui.tags.length || ui.cat !== 'all' || ui.status !== 'all' || ui.who);

  function activeFilterCount() {

      + '<button type="button" data-act="tab" data-tab="wantto"' + (onWantTo ? ' aria-current="page"' : '') + '>' + svg('bookmark') + '<span>Want to</span>'

  function stat(cat, n, label) {
    return '<button class="stat' + (cat === 'all' ? '' : ' cat-' + cat) + '" data-act="cat" data-cat="' + cat + '"'
      + ' aria-pressed="' + (ui.cat === cat) + '">'

  function filterChip(kind, value, label) {
    return '<button type="button" class="tagchip is-on" data-act="drop-filter" data-kind="' + kind + '"'

  function activeFilterBar() {
    var chips = [];
    if (ui.q) chips.push(filterChip('q', '', '“' + ui.q + '”'));
    if (ui.cat !== 'all') chips.push(filterChip('cat', '', CATS[ui.cat].short));
    if (ui.status !== 'all') chips.push(filterChip('status', '', GENERIC_STATUS[ui.status] || ui.status));
    if (ui.who) chips.push(filterChip('who', '', 'with ' + ui.who));
    ui.tags.forEach(function (t) { chips.push(filterChip('tag', t, '#' + t)); });
    if (!chips.length) return '';
    return '<div class="tagbar"><span class="head">Filtering</span>' + chips.join('')
      + '<button class="linkish" data-act="clear-filters">Clear all</button></div>';

  function opt(value, text, current) {
    return '<option value="' + value + '"' + (current === value ? ' selected' : '') + '>' + text + '</option>';

    var w = wishlist().length, d = dishes().length, p = brokenPromises().length, years = yearsWithEntries();

      + '<button class="tool" data-act="discover">' + svg('find') + 'Discover</button>'

      + '<button class="tool" data-act="dishes">Order again<span class="c">' + d + '</span></button>'
      + '<button class="tool" data-act="promises">Said I\u2019d go back<span class="c">' + p + '</span></button>'

      + '</div>'

  function themeBtn(key, label) {
    return '<button data-act="theme" data-theme="' + key + '" aria-pressed="' + (themePref === key) + '"'
      + ' aria-label="' + label + '" title="' + label + '">' + svg(key === 'auto' ? 'auto' : key === 'light' ? 'sun' : 'moon')
      + '</button>';

  function tagBar() {
    var counts = tagCounts();
    var keys = Object.keys(counts).filter(function (t) {
      return counts[t] > 0 || ui.tags.indexOf(t) !== -1;
    }).sort(function (a, b) {
      var sa = ui.tags.indexOf(a) !== -1, sb = ui.tags.indexOf(b) !== -1;
      if (sa !== sb) return sa ? -1 : 1;
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    if (!keys.length && !filtersOn()) return '';

    var LIMIT = 12;
    var shown = tagsExpanded ? keys : keys.slice(0, LIMIT);
    var out = '<div class="tagbar"><span class="head">Tags</span>';
    out += shown.map(function (t) {
      return '<button class="tagchip" data-act="tag" data-tag="' + esc(t) + '" aria-pressed="'
        + (ui.tags.indexOf(t) !== -1) + '">' + esc(t) + '<span class="n">' + counts[t] + '</span></button>';
    }).join('');
    if (keys.length > LIMIT) {
      out += '<button class="linkish" data-act="tags-more">'
        + (tagsExpanded ? 'Fewer' : (keys.length - LIMIT) + ' more') + '</button>';
    }
    if (filtersOn()) out += '<button class="linkish" data-act="clear-filters">Clear filters</button>';
    return out + '</div>';
  }

  function card(entry) {
    var cat = catOf(entry);
    var bits = summaryBits(entry);
    var tags = tagsOf(entry);
    var url = mapUrl(entry);
    var away = isAway(entry) === 'away';
    return '<article class="card cat-' + cat + '">'
      + '<div class="card-top">'
      + '<span class="chip chip-cat">' + esc(CATS[cat].short) + '</span>'
      + (statusOf(entry) !== 'logged' ? '<span class="chip chip-soft">' + esc(statusLabel(entry)) + '</span>' : '')
      + (entry.sample ? '<span class="chip chip-soft">Sample</span>' : '')
      + '<span class="spacer"></span>'
      + (url ? '<a class="maplink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"'
              + ' aria-label="Open ' + esc(entry.title) + ' in Maps" title="Open in Maps">' + svg('pin') + '</a>' : '')
      + (entry.again === true ? '<span class="again-mark yes" aria-hidden="true">' + svg('check') + '</span>'
          : entry.again === false ? '<span class="again-mark no" aria-hidden="true">' + svg('check') + '</span>' : '')
      + '<span class="when">' + esc(dayLabel(entry.date || entry.createdAt)) + '</span>'
      + '</div>'
      + '<h3 class="card-title"><button data-act="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button></h3>'
      + (bits.length || away
          ? '<p class="card-meta">' + (away ? '<span class="away">Away</span>' : '')
            + esc(bits.join(' \u00b7 ')) + '</p>'
          : '')
      + (entry.note ? '<p class="card-note">' + esc(entry.note) + '</p>' : '')
      + (tags.length ? '<div class="card-tags">' + tags.map(function (t) {
          return '<span class="minitag">' + esc(t) + '</span>';
        }).join('') + '</div>' : '')
      + '</article>';
  }

  /* ---------------- events ---------------- */

  var resultsDebounce = null;
  function scheduleResultsUpdate() {
    clearTimeout(resultsDebounce);
    resultsDebounce = setTimeout(function () {
      var tb = document.getElementById('tagBarArea');
      if (tb) tb.innerHTML = tagBar();
      var ra = document.getElementById('resultsArea');
      if (ra) ra.innerHTML = resultsHtml();
    }, 120);
  }

  function wire() {
    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        ui.q = q.value; stashUi();
        scheduleResultsUpdate();
      });
    }
    var sort = document.getElementById('sort');
    if (sort) sort.addEventListener('change', function () { ui.sort = sort.value; stashUi(); render(); });
    var qf = document.getElementById('quickForm');
    if (qf) qf.addEventListener('submit', function (ev) { ev.preventDefault(); quickCapture(); });
    refreshAiHints();
  }

  function quickBar() {
    return '<form class="quick" id="quickForm" autocomplete="off">'
      + '<input class="quick-in" id="quickIn" placeholder="Log something: “Sonny’s pizza with Trish, get the margherita”" aria-label="Log something in one line">'
      + '<button type="submit" class="btn" id="quickGo">Log it</button>'
      + '<p class="quick-hint" data-ai-hint></p>'
      + '</form>';
  }

  function capturePrompt(text) {
    var known = peopleKnown();
    return [
      'Turn one casual line into a ledger entry. Reply with ONLY a JSON object matching the shape at the end. No prose.',
      'Line: ' + JSON.stringify(text),
      'Today: ' + today() + '. Home neighborhoods: ' + (state.home || 'unknown') + '.',
      known.length ? 'People logged before: ' + known.join(', ') + '.' : '',
      'Categories: food = restaurants, bars, cafes, groceries. screen = films and TV. live = concerts, comedy, theater, sports. place = museums, hikes, parks, landmarks, activities.',
      'Fields by category. food: city, cuisine, address, dish. screen: kind (Film|Series|Documentary|Short|Special), year, by, where. live: kind (Concert|Comedy|Theater|Sports|Festival|Talk), venue, city, address, support. place: kind (Museum|Landmark|Park|Hike|Gallery|Tour|Class|Market|Beach|Viewpoint), city, address.',
      'Rules: title is only the name of the place, film, or event. "with X" goes in with. "get the X" or "order the X" goes in fields.dish. If the line says want to, should, or is about the future, status is "wishlist" and date is "". Otherwise status is "logged" and date is today, unless the line names a day (yesterday, last night, Tuesday) which you resolve to YYYY-MM-DD. Never invent an address, year, director, or cuisine the line does not imply; leave unknown fields as "". tags: up to 3 lowercase single words, only if obvious. note: leftover opinion or detail in the writer’s own words, or "".',
      'Shape: {"category":"food","status":"logged","title":"","date":"' + today() + '","with":"","fields":{},"tags":[],"note":""}'
    ].filter(Boolean).join('\n');
  }

  function draftFromAi(got, base) {
    var d = JSON.parse(JSON.stringify(base));
    if (!got || typeof got !== 'object' || Array.isArray(got)) return d;
    var cat = CATS[got.category] ? got.category : d.category;
    d.category = cat;
    var st = String(got.status || '');
    d.status = CATS[cat].statuses.some(function (p) { return p[0] === st; }) ? st : 'logged';
    var title = String(got.title || '').trim();
    if (title) d.title = title;
    var date = String(got.date || '');
    d.date = d.status === 'wishlist' ? '' : (/^\d{4}-\d{2}-\d{2}$/.test(date) ? date : d.date);
    d['with'] = String(got['with'] || '').trim();
    var keep = CATS[cat].fields.map(function (f) { return f.key; }).concat(SHARED_FIELD_KEYS);
    var f = {};
    if (got.fields && typeof got.fields === 'object') {
      keep.forEach(function (k) {
        if (got.fields[k] != null && String(got.fields[k]).trim()) f[k] = String(got.fields[k]).trim();
      });
    }
    d.fields = f;
    d.tags = Array.isArray(got.tags)
      ? got.tags.map(function (t) { return String(t).trim().toLowerCase(); }).filter(Boolean).slice(0, 3) : [];
    d.note = String(got.note || '').trim();
    d.aiDraft = true;
    return d;
  }

  function quickCapture() {
    var input = document.getElementById('quickIn'), go = document.getElementById('quickGo');
    var text = input ? input.value.trim() : '';
    if (!text) { if (input) input.focus(); return; }
    var base = { id: newId(), category: ui.cat === 'all' ? 'food' : ui.cat, status: 'logged', title: text,
      date: today(), fields: {}, 'with': '', tags: [], note: '', again: null };
    if (!ai) { openForm(null, base); return; }
    go.disabled = true; go.textContent = 'Thinking…'; input.disabled = true;
    var ctl = new AbortController();
    ai.json(capturePrompt(text), { modelTier: 'quick', cache: false, signal: ctl.signal }).then(function (got) {
      openForm(null, draftFromAi(got, base));
    }).catch(function (err) {
      var msg = aiError(err);
      if (msg) notify(msg);
      openForm(null, base);
    }).then(function () {
      var i2 = document.getElementById('quickIn'), g2 = document.getElementById('quickGo');
      if (i2) { i2.disabled = false; i2.value = ''; }
      if (g2) { g2.disabled = false; g2.textContent = 'Log it'; }
    });
  }

  app.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'open') openDetail(find(el.getAttribute('data-id')));
    else if (act === 'cat') {
      ui.cat = el.getAttribute('data-cat');
      if (ui.status !== 'all' && ui.cat !== 'all') {
        var ok = CATS[ui.cat].statuses.some(function (p) { return p[0] === ui.status; });
        if (!ok) ui.status = 'all';
      }
      stashUi(); render();
    }
    else if (act === 'status') {
      var want = el.getAttribute('data-status');
      ui.status = ui.status === want ? 'all' : want; stashUi(); render();
    }
    else if (act === 'tag') toggleTag(el.getAttribute('data-tag'));
    else if (act === 'tags-more') { tagsExpanded = !tagsExpanded; render(); }
    else if (act === 'who') setWho(el.getAttribute('data-who'));
    else if (act === 'drop-filter') {
      var kind = el.getAttribute('data-kind');
      if (kind === 'q') ui.q = '';
      else if (kind === 'cat') ui.cat = 'all';
      else if (kind === 'status') ui.status = 'all';
      else if (kind === 'who') ui.who = '';
      else if (kind === 'tag') {
        var drop = el.getAttribute('data-value');
        ui.tags = ui.tags.filter(function (t) { return t !== drop; });
      }
      stashUi(); render();
    }
    else if (act === 'clear-filters') { ui.q = ''; ui.tags = []; ui.cat = 'all'; ui.status = 'all'; ui.who = ''; stashUi(); render(); }
    else if (act === 'tab') { ui.tab = el.getAttribute('data-tab'); stashUi(); render(); }
    else if (act === 'filter-toggle') { filterSheetOpen = !filterSheetOpen; render(); }
    else if (act === 'theme') setTheme(el.getAttribute('data-theme'));
    else if (act === 'new') openForm(null, newEntryPrefill());
    else if (act === 'spin') openSpin();
    else if (act === 'dishes') openDishes();
    else if (act === 'promises') openPromises();
    else if (act === 'review') openReview(yearsWithEntries()[0]);
    else if (act === 'discover') openDiscover();
    else if (act === 'suggest') openSuggest();
    else if (act === 'settings') openSettings();
    else if (act === 'shortcuts') openShortcuts();
    else if (act === 'you') openYou();
    else if (act === 'howto') openHowto();
    else if (act === 'clear-samples') {
      state.entries = state.entries.filter(function (e) { return !e.sample; });
      state.hasSamples = false;
      persist();
    }
  });

  function toggleTag(tag) {
    var at = ui.tags.indexOf(tag);
    ui.tags = at === -1 ? ui.tags.concat([tag]) : ui.tags.filter(function (t) { return t !== tag; });
    stashUi(); render();
  }

  function setWho(who) {
    ui.who = (ui.who && ui.who.toLowerCase() === String(who).toLowerCase()) ? '' : String(who);
    if (ui.who) ui.tab = 'main';
    stashUi(); render();

  function newEntryPrefill() {
    if (ui.tab !== 'wantto') return null;
    return {
      id: newId(), category: ui.cat === 'all' ? 'food' : ui.cat, status: 'wishlist', title: '',
      date: '', fields: {}, 'with': '', tags: [], note: '', again: null
    };

  /* ---------------- keyboard shortcuts ---------------- */

  document.addEventListener('keydown', function (event) {
    var tag = (event.target && event.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (event.target && event.target.isContentEditable);
    if (typing || document.querySelector('dialog[open]')) return;
    if (event.key === '/') {
      event.preventDefault();
      var q = document.getElementById('q');
      if (q) q.focus();
    } else if ((event.key === 'n' || event.key === 'N') && !event.metaKey && !event.ctrlKey && !event.altKey) {
      event.preventDefault();
      openForm(null, newEntryPrefill());
    } else if (event.key === '?' && !event.metaKey && !event.ctrlKey && !event.altKey) {
      event.preventDefault();
      openShortcuts();
    }
  });

  var SHORTCUTS = [
    ['/', 'Jump to search'],
    ['n', 'New entry'],
    ['?', 'This list'],
    ['Cmd / Ctrl + Enter', 'Save the open entry'],
    ['Esc', 'Close whatever is open']
  ];

    var dlg = modal('');
    dlg.innerHTML = dlgHead('Keyboard shortcuts')
      + '<div class="dlg-body"><dl class="facts">'

          return '<div class="fact"><dt>' + esc(pair[1]) + '</dt>'
            + '<dd><span class="mono">' + esc(pair[0]) + '</span></dd></div>';
        }).join('')
      + '</dl><p class="disc-hint">Shortcuts are off while you are typing in a field.</p></div>'
      + dlgFoot();
    onClose(dlg);
    dlg.showModal();

  function openYou() {
    var dlg = modal('sheet');
    function paint() {
