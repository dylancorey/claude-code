      "fields": { "kind": "Film", "year": "2024", "by": "Sean Baker", "where": "" },
      "with": "", "tags": [],
      "note": "Three separate people have told me to watch this."
    },
    {
      "id": "s7", "sample": true, "category": "live", "status": "logged",
      "title": "Vampire Weekend", "date": "2026-06-14",
      "fields": { "kind": "Concert", "venue": "Forest Hills Stadium", "city": "Queens, NY", "support": "" },
      "with": "Ari", "tags": ["outdoor", "summer"],
      "note": "Perfect weather, terrible transit home. They played the full request-a-cover bit - took 'Take On Me' from someone in the third row and actually pulled it off."
    },
    {
      "id": "s8", "sample": true, "category": "live", "status": "wishlist",
      "title": "Fleet Foxes", "date": "",
      "fields": { "kind": "Concert", "venue": "Beacon Theatre", "city": "NYC", "support": "" },
      "with": "", "tags": ["tickets pending"],
      "note": "Presale is in two weeks. Beacon is the right room for them."
    }
  ]
}
</script>
<script id="app-script">
(function () {
  'use strict';

  var FONT_HREF = "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap";
  var BODY_MARKUP = '<div id="app"></div>\n<noscript><p style="font:16px/1.6 system-ui,sans-serif;padding:3rem 1.5rem">This ledger renders its entries with JavaScript. Enable it to read the log.</p></noscript>';
  var ARTIFACT_URL = "https://claude.ai/code/artifact/7b605c39-2263-438a-b9bc-d10ed7c6a127";

  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  var CATS = {
    food: {
      label: 'Restaurants & Bars', short: 'Food', titleLabel: 'Place',
      fields: [
        { key: 'city',    label: 'City / neighborhood' },
        { key: 'cuisine', label: 'Cuisine' },
        { key: 'dish',    label: 'Order this again', wide: true }
      ],
      summary: ['city', 'cuisine']
    },
    screen: {
      label: 'Movies & TV', short: 'Screen', titleLabel: 'Title',
      fields: [
        { key: 'kind',  label: 'Film or series', options: ['Film','Series','Documentary','Short','Special'] },
        { key: 'year',  label: 'Released' },
        { key: 'by',    label: 'Director / creator' },
        { key: 'where', label: 'Watched on' }
      ],
      summary: ['kind', 'year', 'by']
    },
    live: {
      label: 'Concerts & Live', short: 'Live', titleLabel: 'Artist or event',
      fields: [
        { key: 'kind',    label: 'Kind', options: ['Concert','Comedy','Theater','Sports','Festival','Talk'] },
        { key: 'venue',   label: 'Venue' },
        { key: 'city',    label: 'City' },
        { key: 'support', label: 'Opener / support' }
      ],
      summary: ['kind', 'venue', 'city']
    }
  };
  var CAT_ORDER = ['food', 'screen', 'live'];

  var state = readState();
  var ui = readUi();
  var readOnly = false;
  var tagsExpanded = false;
  var save = { tone: 'idle', text: '' };
  var app = document.getElementById('app');

  /* ---------------- data ---------------- */

  function readState() {
    try {
      var parsed = JSON.parse(document.getElementById('entry-data').textContent);
      if (!parsed || !Array.isArray(parsed.entries)) throw new Error('shape');
      return { hasSamples: !!parsed.hasSamples, home: typeof parsed.home === 'string' ? parsed.home : '', entries: parsed.entries };
    } catch (err) {
      return { hasSamples: false, home: '', entries: [] };
    }
  }

  function readUi() {
    var base = { q: '', cat: 'all', status: 'all', sort: 'new', tags: [] };
    try {
      var raw = sessionStorage.getItem('ledger.ui');
      if (raw) {
        var saved = JSON.parse(raw);
        ['q', 'cat', 'status', 'sort'].forEach(function (k) {
          if (typeof saved[k] === 'string') base[k] = saved[k];
        });
        if (Array.isArray(saved.tags)) base.tags = saved.tags.filter(function (t) { return typeof t === 'string'; });
      }
    } catch (err) { /* blocked storage - defaults are fine */ }
    return base;
  }

  function stashUi() {
    try { sessionStorage.setItem('ledger.ui', JSON.stringify(ui)); } catch (err) {}
  }

  function newId() {
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function find(id) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === id) return state.entries[i];
    return null;
  }

  /* ---------------- helpers ---------------- */

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function catOf(entry) { return CATS[entry.category] ? entry.category : 'food'; }
  function yearOf(entry) { return entry.date ? entry.date.slice(0, 4) : 'Someday'; }
  function tagsOf(entry) { return Array.isArray(entry.tags) ? entry.tags : []; }

  function dayLabel(date) {
    if (!date) return 'Undated';
    var parts = date.split('-');
    var m = parseInt(parts[1], 10);
    if (!m || m < 1 || m > 12) return date;
    if (!parts[2]) return MONTHS[m - 1] + ' ' + parts[0];
    return MONTHS[m - 1] + ' ' + parseInt(parts[2], 10);
  }

  function fieldDefs(category) { return CATS[catOf({ category: category })].fields; }

  function summaryBits(entry) {
    var bits = [];
    CATS[catOf(entry)].summary.forEach(function (key) {
      var val = entry.fields && entry.fields[key];
      if (val) bits.push(val);
    });
    if (entry['with']) bits.push('with ' + entry['with']);
    return bits;
  }

  function haystack(entry) {
    var parts = [entry.title, entry.note, entry['with'], CATS[catOf(entry)].label];
    if (entry.fields) Object.keys(entry.fields).forEach(function (k) { parts.push(entry.fields[k]); });
    return parts.concat(tagsOf(entry)).join(' ').toLowerCase();
  }

  function cityOf(entry) { return (entry.fields && entry.fields.city) || ''; }

  function isAway(entry) {
    var city = cityOf(entry).trim();
    if (!state.home || !city) return false;
    return city.toLowerCase().indexOf(state.home.trim().toLowerCase()) === -1;
  }

  function wishlist() {
    return state.entries.filter(function (e) {
      return e.status === 'wishlist' && (ui.cat === 'all' || catOf(e) === ui.cat);
    });
  }

  function dishes() {
    return state.entries.filter(function (e) { return catOf(e) === 'food' && e.fields && e.fields.dish; });
  }

  function onThisDay() {
    var now = new Date();
    var md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var yr = String(now.getFullYear());
    return state.entries.filter(function (e) {
      return e.date && e.date.length === 10 && e.date.slice(5) === md && e.date.slice(0, 4) < yr;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function yearsWithEntries() {
    var seen = Object.create(null);
    state.entries.forEach(function (e) { if (e.date) seen[e.date.slice(0, 4)] = true; });
    return Object.keys(seen).sort().reverse();
  }

  function topOf(map, n) {
    return Object.keys(map)
      .sort(function (a, b) { return map[b] - map[a] || a.localeCompare(b); })
      .slice(0, n).map(function (k) { return { key: k, n: map[k] }; });
  }

  function reviewFor(year) {
    var r = { year: year, total: 0, cat: { food: 0, screen: 0, live: 0 }, tags: {}, people: {},
              months: {}, cities: {}, away: 0, first: null, last: null };
    state.entries.forEach(function (e) {
      if (!e.date || e.date.slice(0, 4) !== year) return;
      r.total++;
      r.cat[catOf(e)]++;
      tagsOf(e).forEach(function (t) { r.tags[t] = (r.tags[t] || 0) + 1; });
      String(e['with'] || '').split(/,| and /).forEach(function (raw) {
        var who = raw.trim();
        if (who) r.people[who] = (r.people[who] || 0) + 1;
      });
      var m = e.date.slice(5, 7);
      r.months[m] = (r.months[m] || 0) + 1;
      var c = cityOf(e).trim();
      if (c) r.cities[c] = (r.cities[c] || 0) + 1;
      if (isAway(e)) r.away++;
      if (!r.first || e.date < r.first.date) r.first = e;
      if (!r.last || e.date > r.last.date) r.last = e;
    });
    return r;
  }

  /* ---------------- selection ---------------- */

  function passesBase(entry, q) {
    if (ui.cat !== 'all' && catOf(entry) !== ui.cat) return false;
    if (ui.status !== 'all' && (entry.status || 'logged') !== ui.status) return false;
    if (q && haystack(entry).indexOf(q) === -1) return false;
    return true;
  }

  function passesTags(entry) {
    var have = tagsOf(entry);
    return ui.tags.every(function (t) { return have.indexOf(t) !== -1; });
  }

  function visible() {
    var q = ui.q.trim().toLowerCase();
    return state.entries.filter(function (e) { return passesBase(e, q) && passesTags(e); }).sort(compare);
  }

  function compare(a, b) {
    if (ui.sort === 'az') return a.title.localeCompare(b.title);
    var dir = ui.sort === 'old' ? 1 : -1;
    if (!a.date && !b.date) return a.title.localeCompare(b.title);
    if (!a.date) return 1;
    if (!b.date) return -1;
    if (a.date === b.date) return a.title.localeCompare(b.title);
    return a.date < b.date ? dir : -dir;
  }

  function groups(list) {
    if (ui.sort === 'az') return list.length ? [{ key: 'A to Z', items: list }] : [];
    var order = [], byKey = Object.create(null);
    list.forEach(function (entry) {
      var key = yearOf(entry);
      if (!byKey[key]) { byKey[key] = []; order.push(key); }
      byKey[key].push(entry);
    });
    return order.map(function (key) { return { key: key, items: byKey[key] }; });
  }

  function tagCounts() {
    var q = ui.q.trim().toLowerCase();
    var base = state.entries.filter(function (e) { return passesBase(e, q); });
    var counts = Object.create(null);
    base.forEach(function (entry) {
      if (!passesTags(entry)) return;
      tagsOf(entry).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    ui.tags.forEach(function (t) { if (!(t in counts)) counts[t] = 0; });
    return counts;
  }

  function filtersOn() {
    return !!(ui.q || ui.tags.length || ui.cat !== 'all' || ui.status !== 'all');
  }

  /* ---------------- render ---------------- */

  function render() {
    var list = visible();
    var total = state.entries.length;
    var wish = state.entries.filter(function (e) { return e.status === 'wishlist'; }).length;

    var out = '<div class="wrap">';

    out += '<header class="mast">'
      + '<p class="eyebrow mono">A record of where I went, what I watched, who I was with</p>'
      + '<h1>Dylan\u2019s Ledger</h1>'
      + '<p class="dek">Restaurants and bars, movies and television, concerts and live nights. Notes, not scores.</p>'
      + '<div class="stats">'
      + stat('all', total, 'Everything')
      + CAT_ORDER.map(function (cat) {
          return stat(cat, state.entries.filter(function (e) { return catOf(e) === cat; }).length, CATS[cat].short);
        }).join('')
      + '</div>'
      + toolsRow()
      + '</header>';

    if (state.hasSamples) {
      out += '<div class="banner"><p><strong>These eight entries are samples.</strong> None of it happened to you. Clear them and the ledger is yours.</p>'
        + '<span class="spacer"></span>'
        + '<button class="btn btn-quiet" data-act="clear-samples">Clear samples</button></div>';
    }

    out += '<div class="controls"><div class="row">'
      + '<input class="search" id="q" type="search" placeholder="Search titles, notes, people, places\u2026" value="' + esc(ui.q) + '" aria-label="Search the ledger">'
      + '<button class="toggle" data-act="status" data-status="logged" aria-pressed="' + (ui.status === 'logged') + '">Been there</button>'
      + '<button class="toggle" data-act="status" data-status="wishlist" aria-pressed="' + (ui.status === 'wishlist') + '">Want to' + (wish ? ' \u00b7 ' + wish : '') + '</button>'
      + '<select class="select" id="sort" aria-label="Sort order">'
      + opt('new', 'Newest first', ui.sort) + opt('old', 'Oldest first', ui.sort) + opt('az', 'A \u2013 Z', ui.sort)
      + '</select>'
      + (readOnly ? '' : '<button class="btn" data-act="new">Add entry</button>')
      + '</div>'
      + tagBar()
      + '</div>';

    var otd = onThisDay();
    if (otd.length) {
      var back = new Date().getFullYear() - parseInt(otd[0].date.slice(0, 4), 10);
      out += '<div class="otd cat-' + catOf(otd[0]) + '">'
        + '<span class="lede mono">' + back + ' year' + (back === 1 ? '' : 's') + ' ago today</span>'
        + '<button data-act="open" data-id="' + esc(otd[0].id) + '">' + esc(otd[0].title) + '</button>'
        + (otd.length > 1 ? '<span class="lede">and ' + (otd.length - 1) + ' other' + (otd.length === 2 ? '' : 's') + '</span>' : '')
        + '</div>';
    }

    if (!list.length) {
      out += '<div class="empty"><h2>' + (total ? 'Nothing matches' : 'Nothing here yet') + '</h2>'
        + '<p>' + (total
          ? 'Those filters are working a little too well. Loosen one.'
          : 'Presumably you have been somewhere. Start with the last place you ate.') + '</p>'
        + (total || readOnly ? '' : '<div><button class="btn" data-act="new">Add the first entry</button></div>')
        + '</div>';
    } else {
      groups(list).forEach(function (group) {
        out += '<div class="section-head"><h2>' + esc(group.key) + '</h2><span class="rule"></span>'
          + '<span class="count mono">' + group.items.length + '</span></div>'
          + '<div class="grid">' + group.items.map(card).join('') + '</div>';
      });
    }

    out += '</div>';
    app.innerHTML = out;
    wire();
  }

  function toolsRow() {
    var years = yearsWithEntries();
    var w = wishlist().length, d = dishes().length;
    return '<div class="tools">'
      + '<button class="tool" data-act="spin">Spin it<span class="n">' + w + '</span></button>'
      + '<button class="tool" data-act="dishes">Order again<span class="n">' + d + '</span></button>'
      + (years.length ? '<button class="tool" data-act="review">' + esc(years[0]) + ' in review</button>' : '')
      + '<span class="spacer"></span>'
      + '<button class="linkish" data-act="howto">How to update this</button>'
      + '</div>';
  }

  function stat(cat, n, label) {
    return '<button class="stat' + (cat === 'all' ? '' : ' cat-' + cat) + '" data-act="cat" data-cat="' + cat + '"'
      + ' aria-pressed="' + (ui.cat === cat) + '">'
      + '<span class="num">' + n + '</span><span class="lab mono">' + esc(label) + '</span></button>';
  }

  function opt(value, text, current) {
    return '<option value="' + value + '"' + (current === value ? ' selected' : '') + '>' + text + '</option>';
  }

  function tagBar() {
    var counts = tagCounts();
    var keys = Object.keys(counts).filter(function (t) {
      return counts[t] > 0 || ui.tags.indexOf(t) !== -1;
    }).sort(function (a, b) {
      var sa = ui.tags.indexOf(a) !== -1, sb = ui.tags.indexOf(b) !== -1;
      if (sa !== sb) return sa ? -1 : 1;
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    if (!keys.length && !filtersOn()) return '';

    var LIMIT = 14;
    var shown = tagsExpanded ? keys : keys.slice(0, LIMIT);
    var out = '<div class="tagbar"><span class="head mono">Tags</span>';
    out += shown.map(function (t) {
      var on = ui.tags.indexOf(t) !== -1;
      return '<button class="tagchip" data-act="tag" data-tag="' + esc(t) + '" aria-pressed="' + on + '">'
        + esc(t) + '<span class="n">' + counts[t] + '</span></button>';
    }).join('');
    if (keys.length > LIMIT) {
      out += '<button class="clearall" data-act="tags-more">'
        + (tagsExpanded ? 'Fewer tags' : (keys.length - LIMIT) + ' more') + '</button>';
    }
    if (!keys.length) out += '<span class="head mono">none here</span>';
    if (filtersOn()) out += '<button class="clearall" data-act="clear-filters">Clear filters</button>';
    if (save.text) out += '<span class="spacer" style="flex:1 1 auto"></span><span class="mono" style="color:' + (save.tone === 'warn' ? 'var(--c-live)' : 'var(--mute)') + '">' + esc(save.text) + '</span>';
    return out + '</div>';
  }

  function card(entry) {
    var cat = catOf(entry);
    var bits = summaryBits(entry);
    var tags = tagsOf(entry);
    return '<article class="card cat-' + cat + '">'
      + '<div class="card-top">'
      + '<span class="chip">' + esc(CATS[cat].short) + '</span>'
      + (entry.status === 'wishlist' ? '<span class="chip chip-ghost">Want to</span>' : '')
      + (isAway(entry) ? '<span class="chip chip-away">Away</span>' : '')
      + (entry.sample ? '<span class="chip chip-away">Sample</span>' : '')
      + '<span class="spacer"></span>'
      + '<span class="when mono">' + esc(dayLabel(entry.date)) + '</span>'
      + '</div>'
      + '<h3 class="card-title"><button data-act="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button></h3>'
      + (bits.length ? '<p class="card-meta">' + esc(bits.join(' \u00b7 ')) + '</p>' : '')
      + (entry.note ? '<p class="card-note">' + esc(entry.note) + '</p>' : '')
      + (tags.length ? '<div class="card-tags">' + tags.map(function (t) {
          return '<span class="minitag">' + esc(t) + '</span>';
        }).join('') + '</div>' : '')
      + '</article>';
  }

  /* ---------------- events ---------------- */

  function wire() {
    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        ui.q = q.value; stashUi();
        var pos = q.selectionStart;
        render();
        var next = document.getElementById('q');
        if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
      });
    }
    var sort = document.getElementById('sort');
    if (sort) sort.addEventListener('change', function () { ui.sort = sort.value; stashUi(); render(); });
  }

  app.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'open') {
      openDetail(find(el.getAttribute('data-id')));
    } else if (act === 'cat') {
      ui.cat = el.getAttribute('data-cat'); stashUi(); render();
    } else if (act === 'status') {
      var want = el.getAttribute('data-status');
      ui.status = ui.status === want ? 'all' : want; stashUi(); render();
    } else if (act === 'tag') {
      toggleTag(el.getAttribute('data-tag'));
    } else if (act === 'spin') {
      openSpin();
    } else if (act === 'dishes') {
      openDishes();
    } else if (act === 'review') {
      openReview(yearsWithEntries()[0]);
    } else if (act === 'tags-more') {
      tagsExpanded = !tagsExpanded; render();
    } else if (act === 'clear-filters') {
      ui.q = ''; ui.tags = []; ui.cat = 'all'; ui.status = 'all'; stashUi(); render();
    } else if (act === 'new') {
      openForm(null);
    } else if (act === 'clear-samples') {
      state.entries = state.entries.filter(function (e) { return !e.sample; });
      state.hasSamples = false;
      persist();
    } else if (act === 'howto') {
      openHowto();
    }
  });

  function toggleTag(tag) {
    var at = ui.tags.indexOf(tag);
    if (at === -1) ui.tags = ui.tags.concat([tag]);
    else ui.tags = ui.tags.filter(function (t) { return t !== tag; });
    stashUi(); render();
  }

  /* ---------------- detail ---------------- */

  function openDetail(entry) {
    if (!entry) return;
    var confirming = false;
    var dlg = document.createElement('dialog');
    dlg.className = 'cat-' + catOf(entry);
    document.body.appendChild(dlg);

    function paint() {
      var cat = catOf(entry);
      var facts = '';
      fieldDefs(cat).forEach(function (def) {
        var val = entry.fields && entry.fields[def.key];
        if (val) facts += '<div class="fact"><dt>' + esc(def.label) + '</dt><dd>' + esc(val) + '</dd></div>';
      });
      if (entry['with']) facts += '<div class="fact"><dt>Who with</dt><dd>' + esc(entry['with']) + '</dd></div>';
      facts += '<div class="fact"><dt>' + (entry.status === 'wishlist' ? 'Status' : 'Date') + '</dt><dd>'
        + (entry.date ? esc(dayLabel(entry.date)) + (entry.date.length > 7 ? ', ' + entry.date.slice(0, 4) : '') : 'Not yet')
        + '</dd></div>';

      dlg.innerHTML = '<div class="dlg-head"><div>'
        + '<div class="dlg-chips"><span class="chip">' + esc(CATS[cat].short) + '</span>'
        + (entry.status === 'wishlist' ? '<span class="chip chip-ghost">Want to</span>' : '')
        + '</div><h2>' + esc(entry.title) + '</h2></div>'
        + '<span class="spacer"></span><button class="closex" data-x="close" aria-label="Close">\u00d7</button></div>'
        + '<div class="dlg-body">'
        + '<p class="detail-note">' + (entry.note ? esc(entry.note) : '<span class="none">No note. You will not remember.</span>') + '</p>'
        + '<dl class="facts">' + facts + '</dl>'
        + (tagsOf(entry).length ? '<div class="detail-tags">' + tagsOf(entry).map(function (t) {
            return '<button class="tagchip" data-x="tag" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
          }).join('') + '</div>' : '')
        + '</div>'
        + (readOnly ? '' : '<div class="dlg-foot">'
            + '<button class="btn" data-x="edit">Edit</button>'
            + (confirming
                ? '<button class="btn btn-danger" data-x="delete-confirm">Delete for good</button>'
                  + '<button class="btn btn-quiet" data-x="delete-cancel">Keep it</button>'
                  + '<span class="warn">This cannot be undone.</span>'
                : '<button class="btn btn-quiet" data-x="delete">Delete</button>')
            + '<span class="spacer"></span>'
            + '<button class="btn btn-quiet" data-x="close">Close</button></div>');
    }

    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (what === 'tag') { dlg.close(); toggleTag(el.getAttribute('data-tag')); }
      else if (what === 'edit') { dlg.close(); openForm(entry); }
      else if (what === 'delete') { confirming = true; paint(); }
      else if (what === 'delete-cancel') { confirming = false; paint(); }
      else if (what === 'delete-confirm') {
        state.entries = state.entries.filter(function (e) { return e.id !== entry.id; });
        dlg.close();
        persist();
      }
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
    paint();
    dlg.showModal();
  }

  /* ---------------- entry form ---------------- */

  function openForm(entry) {
    var editing = !!entry;
    var draft = entry
      ? JSON.parse(JSON.stringify(entry))
      : { id: newId(), category: ui.cat === 'all' ? 'food' : ui.cat, status: 'logged', title: '', date: today(), fields: {}, 'with': '', tags: [], note: '' };

    var dlg = document.createElement('dialog');
    document.body.appendChild(dlg);

    function paint() {
      dlg.className = 'cat-' + catOf(draft);
      var conf = CATS[catOf(draft)];
      var out = '<div class="dlg-head"><h2>' + (editing ? 'Edit entry' : 'New entry') + '</h2>'
        + '<span class="spacer"></span><button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>'
        + '<div class="dlg-body">';

      out += '<div class="fieldset"><span class="flabel">Category</span><div class="seg">'
        + CAT_ORDER.map(function (cat) {
            return '<button type="button" class="cat-' + cat + '" data-x="cat" data-cat="' + cat + '" aria-pressed="'
              + (catOf(draft) === cat) + '">' + esc(CATS[cat].label) + '</button>';
          }).join('')
        + '</div></div>';

      out += '<div class="fieldset"><span class="flabel">Status</span><div class="seg plain">'
        + '<button type="button" data-x="status" data-status="logged" aria-pressed="' + (draft.status !== 'wishlist') + '">Been there</button>'
        + '<button type="button" data-x="status" data-status="wishlist" aria-pressed="' + (draft.status === 'wishlist') + '">Want to</button>'
        + '</div></div>';

      out += '<label class="field"><span class="flabel">' + esc(conf.titleLabel) + '</span>'
        + '<input data-f="title" value="' + esc(draft.title) + '"></label>';

      out += '<div class="grid2">'
        + '<label class="field"><span class="flabel">Date</span><input data-f="date" type="date" value="' + esc(draft.date) + '">'
        + '<span class="hint">Leave blank for something you have not done yet.</span></label>'
        + '<label class="field"><span class="flabel">Who with</span><input data-f="with" value="' + esc(draft['with'] || '') + '"></label>'
        + '</div>';

      var defs = conf.fields;
      out += '<div class="grid2">' + defs.filter(function (d) { return !d.wide; }).map(function (d) { return fieldInput(d, draft); }).join('') + '</div>';
      out += defs.filter(function (d) { return d.wide; }).map(function (d) { return fieldInput(d, draft); }).join('');

      out += '<label class="field"><span class="flabel">Tags</span><input data-f="tags" value="' + esc((draft.tags || []).join(', ')) + '">'
        + '<span class="hint">Comma separated. These become filter chips \u2014 pizza, brooklyn, byob</span></label>';

      out += '<label class="field"><span class="flabel">The note</span><textarea data-f="note" placeholder="What it was like. What past-you wants future-you to know.">' + esc(draft.note) + '</textarea></label>';

      out += '</div><div class="dlg-foot"><span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Cancel</button>'
        + '<button type="button" class="btn" data-x="save">' + (editing ? 'Save changes' : 'Add to ledger') + '</button>'
        + '</div>';
      dlg.innerHTML = out;
      var first = dlg.querySelector('[data-f="title"]');
      if (first) first.focus();
    }

    function fieldInput(def, d) {
      var val = (d.fields && d.fields[def.key]) || '';
      var input;
      if (def.options) {
        input = '<select data-f="fields.' + def.key + '"><option value=""></option>'
          + def.options.map(function (o) {
              return '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select>';
      } else {
        input = '<input data-f="fields.' + def.key + '" value="' + esc(val) + '">';
      }
      return '<label class="field"><span class="flabel">' + esc(def.label) + '</span>' + input + '</label>';
    }

    function collect() {
      draft.fields = draft.fields || {};
      dlg.querySelectorAll('[data-f]').forEach(function (el) {
        var key = el.getAttribute('data-f');
        var val = el.value.trim();
        if (key.indexOf('fields.') === 0) draft.fields[key.slice(7)] = val;
        else if (key === 'tags') draft.tags = val ? val.split(',').map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean) : [];
        else draft[key] = val;
      });
    }

    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (what === 'cat') { collect(); draft.category = el.getAttribute('data-cat'); paint(); }
      else if (what === 'status') { collect(); draft.status = el.getAttribute('data-status'); paint(); }
      else if (what === 'save') {
        collect();
        if (!draft.title) { var t = dlg.querySelector('[data-f="title"]'); if (t) t.focus(); return; }
        delete draft.sample;
        var existing = find(draft.id);
        if (existing) state.entries[state.entries.indexOf(existing)] = draft;
        else state.entries.push(draft);
        dlg.close();
        persist();
      }
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
    paint();
    dlg.showModal();
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* ---------------- how to update ---------------- */

  function openHowto() {
    var dlg = document.createElement('dialog');
    document.body.appendChild(dlg);
    var here = ARTIFACT_URL || (window.location && window.location.href) || '';
    dlg.innerHTML = '<div class="dlg-head"><h2>Keeping this up to date</h2><span class="spacer"></span>'
      + '<button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>'
      + '<div class="dlg-body howto">'
      + '<h3>On the page</h3>'
      + '<p>Add entry, then edit or delete from any entry\u2019s detail view. Every change publishes a new version of this page, so it is saved for good \u2014 no export, no separate file.</p>'
      + '<h3>Or just tell Claude</h3>'
      + '<p>Paste this address into a Claude project and Claude can read and update the ledger the same way you do:</p>'
      + '<code class="snippet">' + esc(here) + '</code>'
      + '<p>Then say things like:</p>'
      + '<p class="quote">\u201cAdd Lucali to my ledger \u2014 went last night with Ari, get the calzone. Tag it pizza and brooklyn.\u201d</p>'
      + '<p class="quote">\u201cLog Severance, finished season two, watched on Apple TV+.\u201d</p>'
      + '<p class="quote">\u201cMove Anora from want-to to watched, saw it Tuesday.\u201d</p>'
      + '<p class="quote">\u201cWhat did I say about the last three places I ate in Brooklyn?\u201d</p>'
      + '<h3>For the project instructions</h3>'
      + '<p>Copy this in so Claude knows what to do without being told twice:</p>'
      + '<code class="snippet">' + esc('My activity ledger lives at ' + here + '\n\nWhen I mention a restaurant, bar, movie, show, concert, or live event I went to or want to go to, update the ledger: read it with the Artifact tool, add or edit the entry in the JSON block with id "entry-data", and publish back to the same URL. Categories are food, screen, and live. Status is "logged" or "wishlist". Tags are lowercase. Keep my wording in the note.\n\nIf I say what to order at a restaurant, put it in the food entry\'s "dish" field - it feeds the Order this again list. "home" at the top level is my home base city; anything logged in a different city is marked Away.') + '</code>'
      + '</div><div class="dlg-foot"><span class="spacer"></span><button type="button" class="btn" data-x="close">Close</button></div>';
    dlg.addEventListener('click', function (event) {
      if (event.target.closest('[data-x="close"]')) dlg.close();
    });
    dlg.addEventListener('close', function () { dlg.remove(); });
    dlg.showModal();
  }

  /* ---------------- spin, dishes, year in review ---------------- */

  function modal(cls) {
    var dlg = document.createElement('dialog');
    if (cls) dlg.className = cls;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', function () { dlg.remove(); });
    return dlg;
  }

  function dlgHead(title) {
    return '<div class="dlg-head"><h2>' + esc(title) + '</h2><span class="spacer"></span>'
      + '<button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>';
  }

  function openSpin() {
    var pool = wishlist();
    var dlg = modal('');
    var picked = null, timer = null;
    dlg.addEventListener('close', function () { clearInterval(timer); });

    function paint(entry, rolling) {
      dlg.className = entry ? 'cat-' + catOf(entry) : '';
      dlg.innerHTML = dlgHead('Spin it')
        + '<div class="dlg-body">'
        + (pool.length
            ? '<div class="spin-stage' + (rolling ? ' spin-rolling' : '') + '">'
              + '<p class="spin-kicker mono">' + (rolling ? 'Deciding' : 'Go here') + '</p>'
              + '<p class="spin-name">' + esc(entry ? entry.title : '') + '</p>'
              + '<p class="spin-meta">' + (entry && !rolling
                  ? esc([CATS[catOf(entry)].label].concat(summaryBits(entry)).join(' \u00b7 '))
                  : '&nbsp;') + '</p></div>'
            : '<p style="color:var(--mute);margin:0">Your want-to list is empty'
              + (ui.cat === 'all' ? '' : ' in this category') + '. Nothing to decide.</p>')
        + '</div><div class="dlg-foot"><span class="spacer"></span>'
        + (pool.length && !rolling
            ? '<button type="button" class="btn btn-quiet" data-x="again">Spin again</button>'
              + '<button type="button" class="btn" data-x="open">Open it</button>'
            : '')
        + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
    }

    function roll() {
      if (!pool.length) { paint(null, false); return; }
      picked = pool[Math.floor(Math.random() * pool.length)];
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce || pool.length === 1) { paint(picked, false); return; }
      var ticks = 11;
      paint(pool[Math.floor(Math.random() * pool.length)], true);
      clearInterval(timer);
      timer = setInterval(function () {
        ticks--;
        if (ticks > 0) paint(pool[Math.floor(Math.random() * pool.length)], true);
        else { clearInterval(timer); paint(picked, false); }
      }, 80);
    }

    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (what === 'again') roll();
      else if (what === 'open' && picked) { var keep = picked; dlg.close(); openDetail(keep); }
    });

    roll();
    dlg.showModal();
  }

  function openDishes() {
    var list = dishes();
    var dlg = modal('cat-food');
    dlg.innerHTML = dlgHead('Order this again')
      + '<div class="dlg-body">'
      + (list.length
          ? list.map(function (e) {
              return '<div class="dish"><span class="what">' + esc(e.fields.dish) + '</span>'
                + '<button type="button" class="where" data-x="open" data-id="' + esc(e.id) + '">'
                + esc(e.title) + (cityOf(e) ? ', ' + esc(cityOf(e)) : '') + '</button></div>';
            }).join('')
          : '<p style="color:var(--mute);margin:0">Not one dish flagged. There is a field for it on every restaurant entry.</p>')
      + '</div><div class="dlg-foot"><span class="spacer"></span>'
      + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';

    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (what === 'open') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
    });
    dlg.showModal();
  }

  function openReview(year) {
    var years = yearsWithEntries();
    if (!years.length) return;
    var cur = years.indexOf(year) !== -1 ? year : years[0];
    var dlg = modal('review');

    function tile(v, k, cls) {
      return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="v">' + v + '</div>'
        + '<div class="k">' + esc(k) + '</div></div>';
    }

    function bookend(label, entry) {
      if (!entry) return '';
      return '<div class="bookend"><span class="k">' + esc(label) + '</span>'
        + '<button type="button" data-x="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button>'
        + '<span class="when">' + esc(dayLabel(entry.date)) + '</span></div>';
    }

    function paint() {
      var r = reviewFor(cur);
      var tags = topOf(r.tags, 6), people = topOf(r.people, 5), cities = topOf(r.cities, 6);
      var maxTag = tags.length ? tags[0].n : 1;

      var body = '<div class="yearpick">' + years.map(function (y) {
        return '<button type="button" class="tagchip" data-x="year" data-year="' + esc(y) + '"'
          + ' aria-pressed="' + (y === cur) + '">' + esc(y) + '</button>';
      }).join('') + '</div>';

      if (!r.total) {
        body += '<p class="none">Nothing logged in ' + esc(cur) + '.</p>';
      } else {
        body += '<div class="tiles">'
          + tile(r.total, r.total === 1 ? 'Outing' : 'Outings', '')
          + tile(r.cat.food, 'Food', 'food')
          + tile(r.cat.screen, 'Screen', 'screen')
          + tile(r.cat.live, 'Live', 'live')
          + (state.home ? tile(r.away, 'Away', '') : '')
          + '</div>';

        if (r.total === 1) body += '<p class="none" style="margin-top:-1rem;margin-bottom:1.75rem">One entry. A restrained year.</p>';

        body += '<div class="block"><h3>Most-used tags</h3>'
          + (tags.length
              ? '<div class="bars">' + tags.map(function (t) {
                  return '<div class="bar"><span class="lbl">' + esc(t.key) + '</span>'
                    + '<span class="track"><span class="fill" style="width:' + Math.round(t.n / maxTag * 100) + '%"></span></span>'
                    + '<span class="val">' + t.n + '</span></div>';
                }).join('') + '</div>'
              : '<p class="none">No tags this year.</p>')
          + '</div>';

        body += '<div class="block"><h3>Who you were with</h3>'
          + (people.length
              ? '<div class="detail-tags">' + people.map(function (pp) {
                  return '<span class="tagchip" style="cursor:default">' + esc(pp.key)
                    + '<span class="n">' + pp.n + '</span></span>';
                }).join('') + '</div>'
              : '<p class="none">All of them alone. No judgement.</p>')
          + '</div>';

        var busiest = topOf(r.months, 1)[0];
        var months = Object.keys(r.months).length;
        body += '<div class="block"><h3>The shape of it</h3>'
          + (busiest.n > 1
              ? '<div class="bookend"><span class="k">Busiest</span><span>'
                + MONTHS[parseInt(busiest.key, 10) - 1] + ' \u2014 ' + busiest.n + '</span></div>'
              : '<div class="bookend"><span class="k">Pace</span><span>Never twice in a month. '
                + months + ' month' + (months === 1 ? '' : 's') + ' with anything in them.</span></div>')
          + bookend('First', r.first)
          + (r.last && r.first && r.last.id !== r.first.id ? bookend('Last', r.last) : '')
          + '</div>';

        if (cities.length) {
          body += '<div class="block"><h3>Cities</h3><div class="detail-tags">'
            + cities.map(function (c) {
                return '<span class="tagchip" style="cursor:default">' + esc(c.key)
                  + '<span class="n">' + c.n + '</span></span>';
              }).join('')
            + '</div></div>';
        }
      }

      body += '<div class="block" style="margin-bottom:0"><h3>Home base</h3>'
        + '<div class="homeset">'
        + '<input data-h="home" value="' + esc(state.home) + '" placeholder="Which city?" aria-label="Home base city">'
        + '<button type="button" class="btn btn-quiet" data-x="home">Save</button></div>'
        + '<p class="none" style="margin-top:.5rem;font-size:.8125rem">'
        + (state.home
            ? 'Anything logged outside ' + esc(state.home) + ' is marked Away.'
            : 'Set it and anything logged elsewhere gets marked Away.')
        + '</p></div>';

      dlg.innerHTML = dlgHead(cur + ' in review')
        + '<div class="dlg-body">' + body + '</div>'
        + '<div class="dlg-foot"><span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
    }

    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (what === 'year') { cur = el.getAttribute('data-year'); paint(); }
      else if (what === 'open') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
      else if (what === 'home') {
        var input = dlg.querySelector('[data-h="home"]');
        state.home = input ? input.value.trim() : '';
        dlg.close();
        persist();
      }
    });

    paint();
    dlg.showModal();
  }

  /* ---------------- publish ---------------- */

  function buildDocument(next) {
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    var json = JSON.stringify(next, null, 2).replace(/</g, '\\u003c');
    return [
      '<!doctype html>',
      '<html lang="en">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>Dylan\u2019s Ledger</title>',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT_HREF + '">',
      '<style id="app-style">' + css + '<\/style>',
      '</head>',
      '<body>',
      BODY_MARKUP,
      '<script id="entry-data" type="application/json">',
      json,
      '<\/script>',
      '<script id="app-script">' + js + '<\/script>',
      '</body>',
      '</html>'
    ].join('\n');
  }

  function setSave(tone, text) { save = { tone: tone, text: text }; }

  function persist() {
    setSave('idle', 'Saving\u2026');
    render();
    stashUi();
    if (!window.claude || typeof window.claude.use !== 'function') {
      setSave('warn', 'Not saved \u2014 open this page from its own address');
      render();
      return;
    }
    window.claude.use('artifact').then(function (api) {
      if (!api) {
        setSave('warn', 'Saving unavailable in this view');
        render();
        return;
      }
      return api.publish(buildDocument(state)).then(function () {
        setSave('idle', 'Saved');
        render();
      });
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'conflict') {
        setSave('warn', 'Someone published first \u2014 reloading');
      } else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'
        || code === 'capability_disabled' || code === 'capability_removed' || code === 'consent_required') {
        readOnly = true;
        setSave('warn', 'This view is read-only');
      } else if (code === 'rate_limited') {
        setSave('warn', 'Saving too fast \u2014 wait a moment and try again');
      } else if (code === 'too_large') {
        setSave('warn', 'The ledger is too large to publish');
      } else {
        setSave('warn', 'Could not save \u2014 try again');
      }
      render();
    });
  }

  render();
}());
</script>
