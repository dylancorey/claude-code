<title>Dylan's Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }

:root {
  --bg:        #F5F5F7;
  --surface:   #FFFFFF;
  --glass:     rgba(255,255,255,.72);
  --glass-hi:  rgba(255,255,255,.9);
  --ink:       #1B1B1F;
  --ink-2:     #5A5A63;
  --ink-3:     #8B8B94;
  --line:      rgba(18,18,24,.09);
  --line-2:    rgba(18,18,24,.16);
  --accent:    #2F6BEB;
  --tint:      13%;

  --c-food:    #D2600B;
  --c-screen:  #4F52D8;
  --c-live:    #C42D6B;
  --c-place:   #10827A;

  --shadow-1:  0 1px 2px rgba(16,17,22,.05), 0 1px 1px rgba(16,17,22,.03);
  --shadow-2:  0 10px 28px -10px rgba(16,17,22,.18), 0 2px 6px rgba(16,17,22,.05);
  --shadow-3:  0 32px 70px -20px rgba(16,17,22,.34), 0 4px 12px rgba(16,17,22,.08);

  --r-sm: 8px; --r: 11px; --r-lg: 15px; --r-pill: 999px;
  --ease: cubic-bezier(.22,.75,.2,1);
  --spring: cubic-bezier(.34,1.32,.5,1);

  --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0E0F12;
    --surface:   #17181C;
    --glass:     rgba(30,31,36,.72);
    --glass-hi:  rgba(255,255,255,.07);
    --ink:       #F1F1F4;
    --ink-2:     #A3A4AC;
    --ink-3:     #757680;
    --line:      rgba(255,255,255,.10);
    --line-2:    rgba(255,255,255,.18);
    --accent:    #6E93F7;
    --tint:      22%;
    --c-food:    #F5883C;
    --c-screen:  #8C8EF5;
    --c-live:    #F0619B;
    --c-place:   #3FBDB0;
    --shadow-1:  0 1px 2px rgba(0,0,0,.5);
    --shadow-2:  0 10px 28px -10px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
    --shadow-3:  0 32px 70px -20px rgba(0,0,0,.85), 0 4px 12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg:        #0E0F12;
  --surface:   #17181C;
  --glass:     rgba(30,31,36,.72);
  --glass-hi:  rgba(255,255,255,.07);
  --ink:       #F1F1F4;
  --ink-2:     #A3A4AC;
  --ink-3:     #757680;
  --line:      rgba(255,255,255,.10);
  --line-2:    rgba(255,255,255,.18);
  --accent:    #6E93F7;
  --tint:      22%;
  --c-food:    #F5883C;
  --c-screen:  #8C8EF5;
  --c-live:    #F0619B;
  --c-place:   #3FBDB0;
  --shadow-1:  0 1px 2px rgba(0,0,0,.5);
  --shadow-2:  0 10px 28px -10px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  --shadow-3:  0 32px 70px -20px rgba(0,0,0,.85), 0 4px 12px rgba(0,0,0,.5);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.cat-food   { --cat: var(--c-food); }
.cat-screen { --cat: var(--c-screen); }
.cat-live   { --cat: var(--c-live); }
.cat-place  { --cat: var(--c-place); }

.wrap { max-width: 78rem; margin: 0 auto; padding: 0 1.75rem 6rem; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow-2);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--surface); }
}

/* ---------- masthead ---------- */
.mast { padding: 3.25rem 0 0; }
.mast h1 {
  font-weight: 700; font-size: clamp(1.9rem, 3.6vw, 2.5rem);
  letter-spacing: -.028em; line-height: 1.1; margin: 0;
}
.mast .dek { color: var(--ink-2); margin: .4rem 0 0; max-width: 48ch; }

.stats { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: 1.5rem; }
.stat {
  background: none; border: 1px solid transparent; border-radius: var(--r-pill);
  padding: .35rem .75rem; cursor: pointer; color: var(--ink-2);
  display: inline-flex; align-items: baseline; gap: .4rem; font-weight: 500;
  transition: background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease);
}
.stat:hover { background: var(--surface); color: var(--ink); }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.stat[aria-pressed="true"] {
  background: var(--surface); border-color: var(--line); color: var(--ink);
  box-shadow: var(--shadow-1);
}
.stat[aria-pressed="true"] .v { color: var(--cat, var(--accent)); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .375rem; margin-top: .875rem; }
.tools .spacer { flex: 1 1 auto; }
.tool {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .8rem; cursor: pointer; font-weight: 500; color: var(--ink);
  box-shadow: var(--shadow-1); display: inline-flex; align-items: center; gap: .4rem;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease);
}
.tool:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.tool:active { transform: translateY(0) scale(.98); }
.tool .c { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: .8125rem; }
.tool svg { width: 15px; height: 15px; flex: none; }

.seg3 {
  display: inline-flex; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-pill); padding: 2px; box-shadow: var(--shadow-1);
}
.seg3 button {
  background: none; border: 0; border-radius: var(--r-pill); cursor: pointer;
  padding: .28rem .6rem; color: var(--ink-3); font-size: .8125rem; font-weight: 500;
  display: inline-flex; align-items: center; gap: .3rem;
  transition: background .16s var(--ease), color .16s var(--ease);
}
.seg3 button:hover { color: var(--ink); }
.seg3 button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: var(--shadow-1); }
.seg3 svg { width: 14px; height: 14px; }

/* ---------- notices ---------- */
.notice {
  display: flex; flex-wrap: wrap; align-items: center; gap: .625rem 1.25rem;
  margin-top: 1.5rem; padding: .875rem 1.125rem;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-1);
}
.notice p { margin: 0; color: var(--ink-2); font-size: .9375rem; }
.notice strong { color: var(--ink); font-weight: 600; }
.notice .spacer { flex: 1 1 auto; }
.otd { border-left: 3px solid var(--cat, var(--accent)); }
.otd .ago { color: var(--ink-3); font-size: .8125rem; }
.otd button.link {
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
  font-weight: 600; text-decoration: underline; text-underline-offset: 3px;
  text-decoration-color: var(--line-2);
}
.otd button.link:hover { color: var(--cat); }

/* ---------- controls ---------- */
.controls {
  position: sticky; top: .625rem; z-index: 30; margin-top: 1.5rem;
  border-radius: var(--r-lg); padding: .625rem;
  border: 1px solid var(--line);
}
.row { display: flex; flex-wrap: wrap; gap: .375rem; align-items: center; }
.search {
  flex: 1 1 15rem; min-width: 0; background: var(--bg); color: var(--ink);
  border: 1px solid transparent; border-radius: var(--r); padding: .5rem .75rem;
  font-size: .9375rem; transition: border-color .16s var(--ease);
}
.search:focus { border-color: var(--accent); outline: none; }
.search::placeholder { color: var(--ink-3); }

.pill {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .75rem; cursor: pointer; color: var(--ink-2); font-weight: 500;
  font-size: .875rem; transition: all .16s var(--ease);
}
.pill:hover { color: var(--ink); border-color: var(--line-2); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.select {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .6rem; cursor: pointer; color: var(--ink-2); font-size: .875rem;
}
.btn {
  background: var(--accent); color: #fff; border: 1px solid transparent;
  border-radius: var(--r-pill); padding: .45rem .9rem; cursor: pointer; font-weight: 600;
  font-size: .875rem; box-shadow: var(--shadow-1);
  transition: transform .16s var(--ease), filter .16s var(--ease);
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: scale(.98); }
.btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-quiet:hover { filter: none; background: var(--bg); }
.btn-danger { background: none; color: var(--c-live); border-color: var(--c-live); box-shadow: none; }
.btn-danger:hover { background: var(--c-live); color: #fff; filter: none; }

.tagbar { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: .5rem; padding: 0 .125rem; }
.tagbar .head { color: var(--ink-3); font-size: .75rem; margin-right: .2rem; }
.tagchip {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .2rem .55rem; cursor: pointer; color: var(--ink-2); font-size: .8125rem;
  display: inline-flex; align-items: center; gap: .35rem; transition: all .16s var(--ease);
}
.tagchip:hover { border-color: var(--line-2); color: var(--ink); }
.tagchip .n { font-size: .6875rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tagchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.tagchip[aria-pressed="true"] .n { color: var(--bg); opacity: .65; }
.linkish {
  background: none; border: 0; padding: 0 .25rem; cursor: pointer; color: var(--accent);
  font-size: .8125rem; font-weight: 500;
}
.linkish:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ---------- sections + cards ---------- */
.section-head { display: flex; align-items: baseline; gap: .625rem; margin: 2.25rem 0 .75rem; padding: 0 .125rem; }
.section-head h2 { margin: 0; font-weight: 600; font-size: 1.0625rem; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.section-head .count { color: var(--ink-3); font-size: .8125rem; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18.5rem, 1fr)); gap: .75rem; }
.card {
  position: relative; display: flex; flex-direction: column; gap: .5rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1); padding: 1rem 1.0625rem .875rem; min-height: 11rem;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease);
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.card-top { display: flex; align-items: center; gap: .35rem; }
.card-top .spacer { flex: 1 1 auto; }
.card-top .when { color: var(--ink-3); font-size: .75rem; white-space: nowrap; }

.chip {
  border-radius: var(--r-pill); padding: .17rem .5rem; font-size: .6875rem; font-weight: 600;
  white-space: nowrap; background: var(--cat); color: #fff;
}
.chip-cat { background: color-mix(in srgb, var(--cat) var(--tint), transparent); color: var(--cat); }
.chip-soft { background: var(--bg); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }

.card-title { margin: 0; font-size: 1.0625rem; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
.card-title button {
  background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  letter-spacing: inherit; text-align: left; color: inherit;
}
.card-title button::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); }
.card:hover .card-title button { color: var(--cat); }
.card-meta { margin: 0; color: var(--ink-3); font-size: .8125rem; }
.card-meta .away {
  color: var(--cat); font-weight: 600; margin-right: .4rem;
  padding-right: .4rem; border-right: 1px solid var(--line);
}
.card-note {
  margin: 0; color: var(--ink-2); font-size: .875rem; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-tags { margin-top: auto; padding-top: .5rem; display: flex; flex-wrap: wrap; gap: .3rem; }
.minitag { color: var(--ink-3); font-size: .75rem; }
.minitag::before { content: "#"; opacity: .5; }
.maplink {
  position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: var(--r-pill); color: var(--ink-3);
  border: 1px solid transparent; text-decoration: none; transition: all .16s var(--ease);
}
.maplink:hover { color: var(--cat); border-color: var(--line); background: var(--bg); }
.maplink svg { width: 14px; height: 14px; }

.empty { padding: 4rem 0; }
.empty h2 { margin: 0 0 .375rem; font-weight: 600; font-size: 1.375rem; letter-spacing: -.02em; }
.empty p { margin: 0; color: var(--ink-2); max-width: 44ch; }
.empty .btn { margin-top: 1.25rem; }

/* ---------- dialog ---------- */
dialog {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-3); padding: 0;
  width: min(40rem, 94vw); max-height: 88vh;
}
dialog[open] { animation: pop .24s var(--spring); }
dialog::backdrop { background: rgba(10,10,14,.42); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.975); } to { opacity: 1; transform: none; } }

.dlg-head { display: flex; align-items: flex-start; gap: 1rem; padding: 1.25rem 1.5rem .75rem; }
.dlg-head h2 { margin: 0; font-weight: 650; font-size: 1.375rem; letter-spacing: -.022em; line-height: 1.2; }
.dlg-head .spacer { flex: 1 1 auto; }
.dlg-chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
.dlg-body { padding: 0 1.5rem 1.25rem; overflow-y: auto; max-height: calc(88vh - 9.5rem); }
.dlg-foot {
  display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
  padding: .875rem 1.5rem 1.125rem; border-top: 1px solid var(--line);
}
.dlg-foot .spacer { flex: 1 1 auto; }
.dlg-foot .warn { color: var(--c-live); font-size: .8125rem; }
.closex {
  background: var(--bg); border: 0; border-radius: var(--r-pill); cursor: pointer;
  color: var(--ink-3); width: 28px; height: 28px; font-size: 1.0625rem; line-height: 1; flex: none;
}
.closex:hover { color: var(--ink); }

.detail-note { margin: 0 0 1.25rem; font-size: 1rem; line-height: 1.6; max-width: 62ch; white-space: pre-wrap; }
.detail-note .none { color: var(--ink-3); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .875rem 1.25rem; margin: 0 0 1.25rem; }
.fact { display: flex; flex-direction: column; gap: .1rem; }
.fact dt { color: var(--ink-3); font-size: .75rem; }
.fact dd { margin: 0; font-weight: 500; }
.detail-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
.maplink-full {
  display: inline-flex; align-items: center; gap: .4rem; text-decoration: none;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .8rem; color: var(--ink); font-weight: 500; font-size: .875rem;
}
.maplink-full:hover { border-color: var(--line-2); }
.maplink-full svg { width: 15px; height: 15px; color: var(--cat); }

/* ---------- form ---------- */
.fieldset { margin: 0 0 1.125rem; }
.flabel { display: block; margin-bottom: .35rem; color: var(--ink-3); font-size: .75rem; }
.seg { display: flex; flex-wrap: wrap; gap: .375rem; }
.seg button {
  background: none; border: 1px solid var(--line); border-radius: var(--r-pill);
  padding: .4rem .75rem; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: .875rem;
  transition: all .16s var(--ease);
}
.seg button:hover { border-color: var(--line-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--cat, var(--ink)); border-color: transparent; color: #fff; }
.seg.plain button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .875rem; }
.field { display: block; margin-bottom: 1rem; }
.field input, .field textarea, .field select {
  background: var(--bg); border: 1px solid transparent; color: var(--ink);
  border-radius: var(--r); padding: .55rem .7rem; font-size: .9375rem; width: 100%;
  transition: border-color .16s var(--ease);
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.field textarea { resize: vertical; min-height: 7.5rem; line-height: 1.55; }
.field .hint { display: block; margin-top: .3rem; color: var(--ink-3); font-size: .8125rem; }

/* ---------- spin reel ---------- */
.reel-wrap { padding: 1rem 0 1.25rem; }
.reel {
  position: relative; height: 174px; overflow: hidden; border-radius: var(--r-lg);
  background: var(--bg); border: 1px solid var(--line);
}
.reel-strip { will-change: transform; }
.reel-item {
  height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .1rem; padding: 0 1rem; text-align: center;
}
.reel-item .t {
  font-weight: 600; font-size: 1.0625rem; letter-spacing: -.015em; color: var(--ink-3);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.reel-item .s { font-size: .75rem; color: var(--ink-3); opacity: 0; }
.reel-item.win .t { color: var(--cat, var(--ink)); }
.reel-item.win .s { opacity: 1; }
.reel-window {
  position: absolute; left: 6px; right: 6px; top: 58px; height: 58px; pointer-events: none;
  border-radius: var(--r); border: 1px solid var(--line-2);
  background: var(--glass);
  -webkit-backdrop-filter: blur(6px) saturate(150%); backdrop-filter: blur(6px) saturate(150%);
  box-shadow: inset 0 1px 0 var(--glass-hi);
}
.reel-fade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(var(--bg) 2%, transparent 30%, transparent 70%, var(--bg) 98%);
}
.reel-caption { text-align: center; color: var(--ink-3); font-size: .8125rem; margin: .875rem 0 0; min-height: 1.2em; }

/* ---------- suggestions ---------- */
.rec { display: flex; gap: .875rem; padding: .875rem 0; border-bottom: 1px solid var(--line); }
.rec:last-of-type { border-bottom: 0; }
.rec .rank {
  flex: none; width: 26px; height: 26px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--cat) var(--tint), transparent); color: var(--cat);
  display: flex; align-items: center; justify-content: center; font-size: .8125rem; font-weight: 600;
}
.rec .body { flex: 1 1 auto; min-width: 0; }
.rec .t { font-weight: 600; font-size: 1rem; letter-spacing: -.012em; }
.rec .t button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.rec .t button:hover { color: var(--cat); }
.rec .why { margin: .2rem 0 0; color: var(--ink-2); font-size: .875rem; }
.obs { margin: 0; padding: .625rem 0 0; color: var(--ink-2); font-size: .875rem; }
.obs + .obs { padding-top: .3rem; }
.byline { color: var(--ink-3); font-size: .75rem; margin: 0 0 .75rem; }
.sec-label { color: var(--ink-3); font-size: .75rem; margin: 1.5rem 0 .375rem; }
.sec-label:first-child { margin-top: 0; }

/* ---------- year in review ---------- */
.yearpick { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: 1.125rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .5rem; margin-bottom: 1.5rem; }
.tile { background: var(--bg); border-radius: var(--r); padding: .75rem .875rem; }
.tile .v { font-weight: 650; font-size: 1.5rem; line-height: 1.1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.tile .k { color: var(--ink-3); font-size: .75rem; margin-top: .1rem; }
.tile.food .v { color: var(--c-food); }
.tile.screen .v { color: var(--c-screen); }
.tile.live .v { color: var(--c-live); }

  var GENERIC_STATUS = { logged: 'Done', watching: 'Watching', wishlist: 'Want to' };

  var LINES = {
    emptyTitle:   { plain: 'No entries yet', dry: 'Nothing here yet', salty: 'Bleak in here' },
    emptyBody:    { plain: 'Add the last place you ate, watched, or went.',

    recsIntro:    { plain: 'Ranked from your own entries: tags, places, and who you go with.',

  var state = readState();

  /* ---------------- theme ---------------- */

  /* ---------------- data ---------------- */

  function readState() {

        catalog: Array.isArray(parsed.catalog) ? parsed.catalog : [],

  function readUi() {
    var base = { q: '', cat: 'all', status: 'all', sort: 'new', tags: [] };

  function stashUi() { try { sessionStorage.setItem('ledger.ui', JSON.stringify(ui)); } catch (err) {} }
  function newId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) {
    for (var i = 0; i < state.entries.length; i++) if (state.entries[i].id === id) return state.entries[i];
    return null;
  }

  /* ---------------- helpers ---------------- */

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function tone() { return LINES.emptyTitle[state.tone] ? state.tone : 'dry'; }
  function say(key) { var l = LINES[key]; return l ? (l[tone()] || l.dry) : ''; }

  function catOf(entry) { return CATS[entry.category] ? entry.category : 'food'; }
  function statusOf(entry) {
    var allowed = CATS[catOf(entry)].statuses;
    for (var i = 0; i < allowed.length; i++) if (allowed[i][0] === entry.status) return entry.status;
    return 'logged';
  }
  function statusLabel(entry) {
    var allowed = CATS[catOf(entry)].statuses, s = statusOf(entry);
    for (var i = 0; i < allowed.length; i++) if (allowed[i][0] === s) return allowed[i][1];
    return s;
  }
  function yearOf(entry) { return entry.date ? entry.date.slice(0, 4) : 'Someday'; }
  function tagsOf(entry) { return Array.isArray(entry.tags) ? entry.tags : []; }
  function cityOf(entry) { return (entry.fields && entry.fields.city) || ''; }

  function dayLabel(date) {
    if (!date) return 'Undated';
    var parts = date.split('-');
    var m = parseInt(parts[1], 10);
    if (!m || m < 1 || m > 12) return date;
    if (!parts[2]) return MONTHS[m - 1] + ' ' + parts[0];
    return MONTHS[m - 1] + ' ' + parseInt(parts[2], 10);
  }

  function daysSince(date) {
    if (!date || date.length < 10) return null;
    var t = Date.parse(date + 'T12:00:00');
    if (isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }

  function norm(v) {
    return ' ' + String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
  }
  function homeTerms() {
    return String(state.home || '').split(',').map(norm).filter(function (t) { return t.trim().length > 0; });
  }
  function homeLabel() { return String(state.home || '').split(',')[0].trim(); }
  function isAway(entry) {
    var city = cityOf(entry).trim();
    if (!city) return false;
    var terms = homeTerms();
    if (!terms.length) return false;
    var hay = norm(city);
    for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) !== -1) return false;
    return true;
  }

  function mapUrl(entry) {
    if (catOf(entry) === 'screen') return '';
    var f = entry.fields || {};
    var q = f.address;
    if (!q) {
      var bits = [entry.title, f.venue, f.city].filter(Boolean);
      if (bits.length < 2) return '';
      q = bits.join(', ');
    }
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  function fieldDefs(category) { return CATS[CATS[category] ? category : 'food'].fields; }

  function summaryBits(entry) {
    var bits = [];
    CATS[catOf(entry)].summary.forEach(function (key) {
      var val = entry.fields && entry.fields[key];
      if (val) bits.push(val);
    });
    if (entry['with']) bits.push('with ' + entry['with']);
    return bits;
  }

  function haystack(entry) {
    var parts = [entry.title, entry.note, entry['with'], CATS[catOf(entry)].label];
    if (entry.fields) Object.keys(entry.fields).forEach(function (k) { parts.push(entry.fields[k]); });
    return parts.concat(tagsOf(entry)).join(' ').toLowerCase();
  }

  function wishlist() {
    return state.entries.filter(function (e) {
      return statusOf(e) === 'wishlist' && (ui.cat === 'all' || catOf(e) === ui.cat);
    });
  }
  function dishes() {
    return state.entries.filter(function (e) { return catOf(e) === 'food' && e.fields && e.fields.dish; });
  }

  function onThisDay() {
    var now = new Date();
    var md = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var yr = String(now.getFullYear());
    return state.entries.filter(function (e) {
      return e.date && e.date.length === 10 && e.date.slice(5) === md && e.date.slice(0, 4) < yr;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function yearsWithEntries() {
    var seen = Object.create(null);
    state.entries.forEach(function (e) { if (e.date) seen[e.date.slice(0, 4)] = true; });
    return Object.keys(seen).sort().reverse();
  }

  function topOf(map, n) {
    return Object.keys(map)
      .sort(function (a, b) { return map[b] - map[a] || a.localeCompare(b); })
      .slice(0, n).map(function (k) { return { key: k, n: map[k] }; });
  }

  function reviewFor(year) {
    var r = { year: year, total: 0, cat: { food: 0, screen: 0, live: 0, place: 0 }, tags: {}, people: {},
              months: {}, cities: {}, away: 0, first: null, last: null };
    state.entries.forEach(function (e) {
      if (!e.date || e.date.slice(0, 4) !== year) return;
      r.total++;
      r.cat[catOf(e)]++;
      tagsOf(e).forEach(function (t) { r.tags[t] = (r.tags[t] || 0) + 1; });
      String(e['with'] || '').split(/,| and /).forEach(function (raw) {
        var who = raw.trim();
        if (who) r.people[who] = (r.people[who] || 0) + 1;
      });
      r.months[e.date.slice(5, 7)] = (r.months[e.date.slice(5, 7)] || 0) + 1;
      var c = cityOf(e).trim();
      if (c) r.cities[c] = (r.cities[c] || 0) + 1;
      if (isAway(e)) r.away++;
      if (!r.first || e.date < r.first.date) r.first = e;
      if (!r.last || e.date > r.last.date) r.last = e;
    });
    return r;
  }

  /* ---------------- recommendations ---------------- */

  function recommend() {
    var done = state.entries.filter(function (e) { return statusOf(e) !== 'wishlist'; });
    var pool = state.entries.filter(function (e) { return statusOf(e) === 'wishlist'; });
    var tagW = {}, cityW = {}, kindW = {}, catLast = {};

    done.forEach(function (e) {
      tagsOf(e).forEach(function (t) { tagW[t] = (tagW[t] || 0) + 1; });
      var c = norm(cityOf(e)).trim();
      if (c) cityW[c] = (cityW[c] || 0) + 1;
      var f = e.fields || {};
      [f.cuisine, f.kind].forEach(function (k) {
        if (k) { k = k.toLowerCase(); kindW[k] = (kindW[k] || 0) + 1; }
      });
      var d = daysSince(e.date), cat = catOf(e);
      if (d !== null && (catLast[cat] === undefined || d < catLast[cat])) catLast[cat] = d;
    });

    var picks = pool.map(function (e) {
      var score = 0, why = [];
      var hits = tagsOf(e).filter(function (t) { return tagW[t]; });
      if (hits.length) {
        var weight = hits.reduce(function (a, t) { return a + tagW[t]; }, 0);
        score += weight * 2;
        why.push(hits.length > 1
          ? 'shares ' + hits.length + ' tags with things you already logged'
          : tagW[hits[0]] === 1
            ? 'another entry is tagged ' + hits[0]
            : tagW[hits[0]] + ' of your entries are tagged ' + hits[0]);
      }
      var c = norm(cityOf(e)).trim();
      if (c && cityW[c]) { score += cityW[c] * 1.5; why.push('you keep ending up around ' + cityOf(e)); }
      var f = e.fields || {};
      [f.cuisine, f.kind].forEach(function (k) {
        if (k && kindW[k.toLowerCase()]) {
          score += kindW[k.toLowerCase()];
          why.push(k.toLowerCase() + ' is a repeat pattern for you');
        }
      });
      var cat = catOf(e), gap = catLast[cat];
      if (gap === undefined) { score += 3; why.push('nothing logged in this category yet'); }
      else if (gap > 45) {
        score += Math.min(gap / 20, 5);
        why.push('it has been ' + gap + ' days since your last ' + CATS[cat].short.toLowerCase() + ' entry');
      }
      if (!why.length) why.push('still sitting on the want-to list');
      return { entry: e, score: score, why: why.slice(0, 2).join(' \u00b7 ') };
    }).sort(function (a, b) { return b.score - a.score || a.entry.title.localeCompare(b.entry.title); });

    return { picks: picks.slice(0, 3), notes: observations(done) };
  }

  function observations(done) {
    var out = [];
    var last = {};
    done.forEach(function (e) {
      var d = daysSince(e.date);
      if (d === null) return;
      String(e['with'] || '').split(/,| and /).forEach(function (raw) {
        var who = raw.trim();
        if (who && (last[who] === undefined || d < last[who])) last[who] = d;
      });
    });
    var stale = Object.keys(last).filter(function (w) { return last[w] > 60; })
      .sort(function (a, b) { return last[b] - last[a]; });
    if (stale.length) out.push('Nothing logged with ' + stale[0] + ' in ' + last[stale[0]] + ' days.');

    var tagW = {};
    done.forEach(function (e) { tagsOf(e).forEach(function (t) { tagW[t] = (tagW[t] || 0) + 1; }); });
    var top = topOf(tagW, 1)[0];
    if (top && top.n > 1) out.push('Your most-repeated tag is ' + top.key + ', on ' + top.n + ' entries.');

    var withDish = done.filter(function (e) { return catOf(e) === 'food' && e.fields && e.fields.dish; });
    if (withDish.length) {
      var pick = withDish[Math.floor(Math.random() * withDish.length)];
      out.push('At ' + pick.title + ', past you said: ' + pick.fields.dish + '.');
    }
    return out.slice(0, 3);
  }

  /* ---------------- selection ---------------- */

  function passesBase(entry, q) {
    if (ui.cat !== 'all' && catOf(entry) !== ui.cat) return false;
    if (ui.status !== 'all' && statusOf(entry) !== ui.status) return false;
    if (q && haystack(entry).indexOf(q) === -1) return false;
    return true;
  }
  function passesTags(entry) {
    var have = tagsOf(entry);
    return ui.tags.every(function (t) { return have.indexOf(t) !== -1; });
  }
  function visible() {
    var q = ui.q.trim().toLowerCase();
    return state.entries.filter(function (e) { return passesBase(e, q) && passesTags(e); }).sort(compare);
  }
  function compare(a, b) {
    if (ui.sort === 'az') return a.title.localeCompare(b.title);
    var dir = ui.sort === 'old' ? 1 : -1;
    if (!a.date && !b.date) return a.title.localeCompare(b.title);
    if (!a.date) return 1;
    if (!b.date) return -1;
    if (a.date === b.date) return a.title.localeCompare(b.title);
    return a.date < b.date ? dir : -dir;

  function groups(list) {

    var order = [], byKey = Object.create(null);
    list.forEach(function (entry) {
      var key = yearOf(entry);
      if (!byKey[key]) { byKey[key] = []; order.push(key); }
      byKey[key].push(entry);

    return order.map(function (key) { return { key: key, items: byKey[key] }; });
  }
  function tagCounts() {

      tagsOf(entry).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });

    out.push(['wishlist', GENERIC_STATUS.wishlist]);
    return out;
  }

  /* ---------------- render ---------------- */

  function render() {
    var list = visible();
    var total = state.entries.length;
    var out = '<div class="wrap">';

    out += '<header class="mast">'
      + '<h1>Dylan\u2019s Ledger</h1>'
      + '<p class="dek">Where I went, what I watched, who I was with.</p>'
      + '<div class="stats">'
      + stat('all', total, 'Everything')
      + CAT_ORDER.map(function (cat) {
          return stat(cat, state.entries.filter(function (e) { return catOf(e) === cat; }).length, CATS[cat].short);
        }).join('')
      + '</div>'
      + toolsRow()
      + '</header>';

    if (state.hasSamples) {
      out += '<div class="notice"><p><strong>These are samples.</strong> ' + esc(say('samples')) + '</p>'
        + '<span class="spacer"></span>'
        + '<button class="btn btn-quiet" data-act="clear-samples">Clear samples</button></div>';
    }

    var otd = onThisDay();
    if (otd.length) {
      var back = new Date().getFullYear() - parseInt(otd[0].date.slice(0, 4), 10);
      out += '<div class="notice otd cat-' + catOf(otd[0]) + '">'
        + '<p><span class="ago">' + back + ' year' + (back === 1 ? '' : 's') + ' ago today &nbsp;</span>'
        + '<button class="link" data-act="open" data-id="' + esc(otd[0].id) + '">' + esc(otd[0].title) + '</button>'
        + (otd.length > 1 ? '<span class="ago"> and ' + (otd.length - 1) + ' more</span>' : '') + '</p></div>';
    }

    out += '<div class="controls glass"><div class="row">'
      + '<input class="search" id="q" type="search" placeholder="Search titles, notes, people, places" value="' + esc(ui.q) + '" aria-label="Search the ledger">'
      + statusOptions().map(function (pair) {
          return '<button class="pill" data-act="status" data-status="' + pair[0] + '" aria-pressed="'
            + (ui.status === pair[0]) + '">' + esc(pair[1]) + '</button>';
        }).join('')
      + '<select class="select" id="sort" aria-label="Sort order">'
      + opt('new', 'Newest', ui.sort) + opt('old', 'Oldest', ui.sort) + opt('az', 'A \u2013 Z', ui.sort)
      + '</select>'
      + (readOnly ? '' : '<button class="btn" data-act="new">Add entry</button>')

    if (!list.length) {
      out += '<div class="empty"><h2>' + esc(total ? say('filterTitle') : say('emptyTitle')) + '</h2>'
        + '<p>' + esc(total ? say('filterBody') : say('emptyBody')) + '</p>'
        + (total || readOnly ? '' : '<div><button class="btn" data-act="new">Add the first entry</button></div>')
        + '</div>';
    } else {
      groups(list).forEach(function (group) {
        out += '<div class="section-head"><h2>' + esc(group.key) + '</h2>'
          + '<span class="count">' + group.items.length + '</span></div>'
          + '<div class="grid">' + group.items.map(card).join('') + '</div>';
      });
    }

    out += '</div>';
    app.innerHTML = out;
    wire();
  }

  function stat(cat, n, label) {
    return '<button class="stat' + (cat === 'all' ? '' : ' cat-' + cat) + '" data-act="cat" data-cat="' + cat + '"'
      + ' aria-pressed="' + (ui.cat === cat) + '">'
      + '<span class="v">' + n + '</span><span>' + esc(label) + '</span></button>';
  }

  function opt(value, text, current) {
    return '<option value="' + value + '"' + (current === value ? ' selected' : '') + '>' + text + '</option>';
  }

  function toolsRow() {
    var w = wishlist().length, d = dishes().length, years = yearsWithEntries();
    return '<div class="tools">'
      + '<button class="tool" data-act="discover">' + svg('find') + 'Discover</button>'
      + '<button class="tool" data-act="suggest">' + svg('spark') + 'Suggest something</button>'
      + '<button class="tool" data-act="spin">Spin it<span class="c">' + w + '</span></button>'
      + '<button class="tool" data-act="dishes">Order again<span class="c">' + d + '</span></button>'
      + (years.length ? '<button class="tool" data-act="review">' + esc(years[0]) + ' in review</button>' : '')
      + '<span class="spacer"></span>'
      + '<div class="seg3" role="group" aria-label="Appearance">'
      + themeBtn('auto', 'Auto') + themeBtn('light', 'Light') + themeBtn('dark', 'Dark')

  function themeBtn(key, label) {

      + '</button>';
  }

  function tagBar() {
    var counts = tagCounts();
    var keys = Object.keys(counts).filter(function (t) {
      return counts[t] > 0 || ui.tags.indexOf(t) !== -1;
    }).sort(function (a, b) {
      var sa = ui.tags.indexOf(a) !== -1, sb = ui.tags.indexOf(b) !== -1;
      if (sa !== sb) return sa ? -1 : 1;
      return counts[b] - counts[a] || a.localeCompare(b);
    });
    if (!keys.length && !filtersOn()) return '';

    var LIMIT = 12;
    var shown = tagsExpanded ? keys : keys.slice(0, LIMIT);
    var out = '<div class="tagbar"><span class="head">Tags</span>';
    out += shown.map(function (t) {
      return '<button class="tagchip" data-act="tag" data-tag="' + esc(t) + '" aria-pressed="'
        + (ui.tags.indexOf(t) !== -1) + '">' + esc(t) + '<span class="n">' + counts[t] + '</span></button>';
    }).join('');
    if (keys.length > LIMIT) {
      out += '<button class="linkish" data-act="tags-more">'
        + (tagsExpanded ? 'Fewer' : (keys.length - LIMIT) + ' more') + '</button>';
    }
    if (filtersOn()) out += '<button class="linkish" data-act="clear-filters">Clear filters</button>';
    if (save.text) {
      out += '<span class="spacer" style="flex:1 1 auto"></span><span class="head" style="color:'
        + (save.tone === 'warn' ? 'var(--c-live)' : 'var(--ink-3)') + '">' + esc(save.text) + '</span>';
    }
    return out + '</div>';
  }

  function card(entry) {
    var cat = catOf(entry);
    var bits = summaryBits(entry);
    var tags = tagsOf(entry);
    var url = mapUrl(entry);
    return '<article class="card cat-' + cat + '">'
      + '<div class="card-top">'
      + '<span class="chip chip-cat">' + esc(CATS[cat].short) + '</span>'
      + (statusOf(entry) !== 'logged' ? '<span class="chip chip-soft">' + esc(statusLabel(entry)) + '</span>' : '')
      + (entry.sample ? '<span class="chip chip-soft">Sample</span>' : '')
      + '<span class="spacer"></span>'
      + (url ? '<a class="maplink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer"'
              + ' aria-label="Open ' + esc(entry.title) + ' in Maps" title="Open in Maps">' + svg('pin') + '</a>' : '')
      + '<span class="when">' + esc(dayLabel(entry.date)) + '</span>'
      + '</div>'
      + '<h3 class="card-title"><button data-act="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button></h3>'
      + (bits.length || isAway(entry)
          ? '<p class="card-meta">' + (isAway(entry) ? '<span class="away">Away</span>' : '')
            + esc(bits.join(' \u00b7 ')) + '</p>'
          : '')
      + (entry.note ? '<p class="card-note">' + esc(entry.note) + '</p>' : '')
      + (tags.length ? '<div class="card-tags">' + tags.map(function (t) {
          return '<span class="minitag">' + esc(t) + '</span>';
        }).join('') + '</div>' : '')
      + '</article>';
  }

  /* ---------------- events ---------------- */

  function wire() {
    var q = document.getElementById('q');
    if (q) {
      q.addEventListener('input', function () {
        ui.q = q.value; stashUi();
        var pos = q.selectionStart;
        render();
        var next = document.getElementById('q');
        if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
      });
    }
    var sort = document.getElementById('sort');
    if (sort) sort.addEventListener('change', function () { ui.sort = sort.value; stashUi(); render(); });
  }

  app.addEventListener('click', function (event) {
    var el = event.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');

    if (act === 'open') openDetail(find(el.getAttribute('data-id')));
    else if (act === 'cat') {
      ui.cat = el.getAttribute('data-cat');
      if (ui.status !== 'all' && ui.cat !== 'all') {
        var ok = CATS[ui.cat].statuses.some(function (p) { return p[0] === ui.status; });
        if (!ok) ui.status = 'all';
      }
      stashUi(); render();
    }
    else if (act === 'status') {
      var want = el.getAttribute('data-status');
      ui.status = ui.status === want ? 'all' : want; stashUi(); render();
    }
    else if (act === 'tag') toggleTag(el.getAttribute('data-tag'));
    else if (act === 'tags-more') { tagsExpanded = !tagsExpanded; render(); }
    else if (act === 'clear-filters') { ui.q = ''; ui.tags = []; ui.cat = 'all'; ui.status = 'all'; stashUi(); render(); }
    else if (act === 'theme') setTheme(el.getAttribute('data-theme'));
    else if (act === 'new') openForm(null);
    else if (act === 'spin') openSpin();
    else if (act === 'dishes') openDishes();
    else if (act === 'review') openReview(yearsWithEntries()[0]);
    else if (act === 'discover') openDiscover();
    else if (act === 'suggest') openSuggest();
    else if (act === 'settings') openSettings();
    else if (act === 'howto') openHowto();
    else if (act === 'clear-samples') {
      state.entries = state.entries.filter(function (e) { return !e.sample; });
      state.hasSamples = false;
      persist();
    }
  });

  function toggleTag(tag) {
    var at = ui.tags.indexOf(tag);
    ui.tags = at === -1 ? ui.tags.concat([tag]) : ui.tags.filter(function (t) { return t !== tag; });
    stashUi(); render();
  }

  /* ---------------- modal plumbing ---------------- */

  function modal(cls) {
    var dlg = document.createElement('dialog');
    if (cls) dlg.className = cls;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', function () { dlg.remove(); });
    return dlg;
  }
  function dlgHead(title) {
    return '<div class="dlg-head"><h2>' + esc(title) + '</h2><span class="spacer"></span>'
      + '<button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>';
  }
  function dlgFoot(inner) {
    return '<div class="dlg-foot"><span class="spacer"></span>' + (inner || '')
      + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
  }
  function onClose(dlg, extra) {
    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (extra) extra(what, el);
    });
  }

  /* ---------------- detail ---------------- */

  function openDetail(entry) {
    if (!entry) return;
    var confirming = false;
    var dlg = modal('cat-' + catOf(entry));

    function paint() {
      var cat = catOf(entry);
      var facts = '';
      fieldDefs(cat).forEach(function (def) {
        var val = entry.fields && entry.fields[def.key];
        if (val) facts += '<div class="fact"><dt>' + esc(def.label) + '</dt><dd>' + esc(val) + '</dd></div>';
      });
      if (entry['with']) facts += '<div class="fact"><dt>Who with</dt><dd>' + esc(entry['with']) + '</dd></div>';
      facts += '<div class="fact"><dt>Date</dt><dd>' + (entry.date ? esc(dayLabel(entry.date))
        + (entry.date.length > 7 ? ', ' + entry.date.slice(0, 4) : '') : 'Not yet') + '</dd></div>';
      var url = mapUrl(entry);

      dlg.innerHTML = '<div class="dlg-head"><div>'
        + '<div class="dlg-chips"><span class="chip chip-cat">' + esc(CATS[cat].short) + '</span>'
        + '<span class="chip chip-soft">' + esc(statusLabel(entry)) + '</span>'
        + (isAway(entry) ? '<span class="chip chip-soft">Away</span>' : '')
        + '</div><h2>' + esc(entry.title) + '</h2></div>'
        + '<span class="spacer"></span><button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>'
        + '<div class="dlg-body">'
        + '<p class="detail-note">' + (entry.note ? esc(entry.note) : '<span class="none">' + esc(say('noNote')) + '</span>') + '</p>'
        + '<dl class="facts">' + facts + '</dl>'
        + (url || entry.sourceUrl
            ? '<div class="dfoot" style="margin:0 0 1.25rem">'
              + (url ? '<a class="maplink-full" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">'
                      + svg('pin') + 'Open in Maps</a>' : '')
              + (entry.sourceUrl ? '<a class="maplink-full" href="' + esc(entry.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
                      + svg('ext') + 'Open ' + esc(entry.source || 'source') + '</a>' : '')
              + '</div>'
            : '')
        + (tagsOf(entry).length ? '<div class="detail-tags">' + tagsOf(entry).map(function (t) {
            return '<button class="tagchip" data-x="tag" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
          }).join('') + '</div>' : '')
        + '</div>'
        + (readOnly ? '' : '<div class="dlg-foot">'
            + '<button type="button" class="btn" data-x="edit">Edit</button>'
            + (confirming
                ? '<button type="button" class="btn btn-danger" data-x="delete-confirm">Delete for good</button>'
                  + '<button type="button" class="btn btn-quiet" data-x="delete-cancel">Keep it</button>'
                  + '<span class="warn">This cannot be undone.</span>'
                : '<button type="button" class="btn btn-quiet" data-x="delete">Delete</button>')
            + '<span class="spacer"></span>'
            + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>');
    }

    onClose(dlg, function (what, el) {
      if (what === 'tag') { dlg.close(); toggleTag(el.getAttribute('data-tag')); }
      else if (what === 'edit') { dlg.close(); openForm(entry); }
      else if (what === 'delete') { confirming = true; paint(); }
      else if (what === 'delete-cancel') { confirming = false; paint(); }
      else if (what === 'delete-confirm') {
        state.entries = state.entries.filter(function (e) { return e.id !== entry.id; });
        dlg.close(); persist();
      }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- form ---------------- */

  function openForm(entry, prefill) {
    var editing = !!entry;
    var draft = entry ? JSON.parse(JSON.stringify(entry))
      : prefill || { id: newId(), category: ui.cat === 'all' ? 'food' : ui.cat, status: 'logged', title: '',
          date: today(), fields: {}, 'with': '', tags: [], note: '' };
    var dlg = modal('');

    function paint() {
      dlg.className = 'cat-' + catOf(draft);
      var conf = CATS[catOf(draft)];
      var out = dlgHead(editing ? 'Edit entry' : 'New entry') + '<div class="dlg-body">';

      out += '<div class="fieldset"><span class="flabel">Category</span><div class="seg">'
        + CAT_ORDER.map(function (cat) {
            return '<button type="button" class="cat-' + cat + '" data-x="cat" data-cat="' + cat + '" aria-pressed="'
              + (catOf(draft) === cat) + '">' + esc(CATS[cat].label) + '</button>';
          }).join('') + '</div></div>';

      out += '<div class="fieldset"><span class="flabel">Status</span><div class="seg plain">'
        + conf.statuses.map(function (pair) {
            return '<button type="button" data-x="status" data-status="' + pair[0] + '" aria-pressed="'
              + (statusOf(draft) === pair[0]) + '">' + esc(pair[1]) + '</button>';
          }).join('') + '</div></div>';

      out += '<label class="field"><span class="flabel">' + esc(conf.titleLabel) + '</span>'
        + '<input data-f="title" value="' + esc(draft.title) + '"></label>';

      out += '<div class="grid2">'
        + '<label class="field"><span class="flabel">Date</span><input data-f="date" type="date" value="' + esc(draft.date) + '">'
        + '<span class="hint">Blank for something you have not done yet.</span></label>'
        + '<label class="field"><span class="flabel">Who with</span><input data-f="with" value="' + esc(draft['with'] || '') + '"></label>'
        + '</div>';

      out += '<div class="grid2">' + conf.fields.filter(function (d) { return !d.wide; })
        .map(function (d) { return fieldInput(d, draft); }).join('') + '</div>';
      out += conf.fields.filter(function (d) { return d.wide; })
        .map(function (d) { return fieldInput(d, draft); }).join('');

      out += '<label class="field"><span class="flabel">Tags</span><input data-f="tags" value="' + esc((draft.tags || []).join(', ')) + '">'
        + '<span class="hint">Comma separated. These become filter chips.</span></label>';
      out += '<label class="field"><span class="flabel">The note</span><textarea data-f="note" placeholder="What it was like. What past-you wants future-you to know.">' + esc(draft.note) + '</textarea></label>';

      out += '</div><div class="dlg-foot"><span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Cancel</button>'
        + '<button type="button" class="btn" data-x="save">' + (editing ? 'Save changes' : 'Add to ledger') + '</button></div>';
      dlg.innerHTML = out;
      var first = dlg.querySelector('[data-f="title"]');
      if (first) first.focus();
    }

    function fieldInput(def, d) {
      var val = (d.fields && d.fields[def.key]) || '';
      var input = def.options
        ? '<select data-f="fields.' + def.key + '"><option value=""></option>'
          + def.options.map(function (o) {
              return '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select>'
        : '<input data-f="fields.' + def.key + '" value="' + esc(val) + '">';
      return '<label class="field"><span class="flabel">' + esc(def.label) + '</span>' + input
        + (def.hint ? '<span class="hint">' + esc(def.hint) + '</span>' : '') + '</label>';
    }

    function collect() {
      draft.fields = draft.fields || {};
      dlg.querySelectorAll('[data-f]').forEach(function (el) {
        var key = el.getAttribute('data-f'), val = el.value.trim();
        if (key.indexOf('fields.') === 0) draft.fields[key.slice(7)] = val;
        else if (key === 'tags') draft.tags = val ? val.split(',').map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean) : [];
        else draft[key] = val;
      });
    }

    onClose(dlg, function (what, el) {
      if (what === 'cat') {
        collect();
        draft.category = el.getAttribute('data-cat');
        draft.status = statusOf(draft);
        paint();
      } else if (what === 'status') { collect(); draft.status = el.getAttribute('data-status'); paint(); }
      else if (what === 'save') {
        collect();
        if (!draft.title) { var t = dlg.querySelector('[data-f="title"]'); if (t) t.focus(); return; }
        delete draft.sample;
        var existing = find(draft.id);
        if (existing) state.entries[state.entries.indexOf(existing)] = draft;
        else state.entries.push(draft);
        dlg.close(); persist();
      }
    });
    paint();
    dlg.showModal();
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* ---------------- spin ---------------- */

  function openSpin() {
    var pool = wishlist();
    var dlg = modal('');
    var picked = null;

    if (!pool.length) {
      dlg.innerHTML = dlgHead('Spin it') + '<div class="dlg-body"><p class="none">' + esc(say('spinEmpty')) + '</p></div>' + dlgFoot();
      onClose(dlg);
      dlg.showModal();
      return;
    }

    var ITEM = 58, LOOPS = 5;

    function shell() {
      dlg.className = picked ? 'cat-' + catOf(picked) : '';
      dlg.innerHTML = dlgHead('Spin it')
        + '<div class="dlg-body"><div class="reel-wrap">'
        + '<div class="reel"><div class="reel-strip" id="reelStrip"></div>'
        + '<div class="reel-window"></div><div class="reel-fade"></div></div>'
        + '<p class="reel-caption" id="reelCap">' + esc(say('spinRolling')) + '</p>'
        + '</div></div>'
        + '<div class="dlg-foot"><span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="again" id="againBtn" disabled>Spin again</button>'
        + '<button type="button" class="btn" data-x="open" id="openBtn" disabled>Open it</button>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
    }

    function reelItem(entry, isWin) {
      return '<div class="reel-item' + (isWin ? ' win' : '') + '">'
        + '<div class="t">' + esc(entry.title) + '</div>'
        + '<div class="s">' + esc(summaryBits(entry).slice(0, 2).join(' \u00b7 ')) + '</div></div>';
    }

    function roll() {
      picked = pool[Math.floor(Math.random() * pool.length)];
      shell();
      var strip = document.getElementById('reelStrip');
      var cap = document.getElementById('reelCap');
      var again = document.getElementById('againBtn');
      var open = document.getElementById('openBtn');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var seq = [];
      if (reduce || pool.length === 1) {
        seq = [pool[0], picked, pool[pool.length - 1]];
        strip.innerHTML = seq.map(function (e, i) { return reelItem(e, i === 1); }).join('');
        strip.style.transform = 'translateY(0)';
        settle(cap, again, open);
        return;
      }

      for (var loop = 0; loop < LOOPS; loop++) {
        pool.forEach(function (e) { seq.push(e); });
      }
      var winAt = seq.length;
      seq.push(picked);
      seq.push(pool[Math.floor(Math.random() * pool.length)]);
      seq.push(pool[Math.floor(Math.random() * pool.length)]);
      strip.innerHTML = seq.map(function (e, i) { return reelItem(e, i === winAt); }).join('');
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          strip.style.transition = 'transform 2.5s cubic-bezier(.14,.72,.16,1)';
          strip.style.transform = 'translateY(' + (-(winAt - 1) * ITEM) + 'px)';
        });
      });
      var done = false;
      var finish = function () { if (done) return; done = true; settle(cap, again, open); };
      strip.addEventListener('transitionend', finish, { once: true });
      setTimeout(finish, 2800);
    }

    function settle(cap, again, open) {
      if (cap) cap.textContent = say('spinLanded') + ' \u2014 ' + CATS[catOf(picked)].label;
      if (again) again.disabled = false;
      if (open) open.disabled = false;
      dlg.className = 'cat-' + catOf(picked);
    }

    onClose(dlg, function (what) {
      if (what === 'again') roll();
      else if (what === 'open' && picked) { var keep = picked; dlg.close(); openDetail(keep); }
    });
    roll();
    dlg.showModal();
  }

  /* ---------------- dishes ---------------- */

  function openDishes() {
    var list = dishes();
    var dlg = modal('cat-food');
    dlg.innerHTML = dlgHead('Order this again')
      + '<div class="dlg-body">'
      + (list.length
          ? list.map(function (e) {
              var url = mapUrl(e);
              return '<div class="rec"><div class="body">'
                + '<div class="t">' + esc(e.fields.dish) + '</div>'
                + '<p class="why">' + esc(e.title) + (cityOf(e) ? ' \u00b7 ' + esc(cityOf(e)) : '')
                + ' &nbsp;<button class="linkish" data-x="open" data-id="' + esc(e.id) + '">Open</button>'
                + (url ? ' <a class="linkish" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Map</a>' : '')
                + '</p></div></div>';
            }).join('')
          : '<p class="none">' + esc(say('dishEmpty')) + '</p>')
      + '</div>' + dlgFoot();
    onClose(dlg, function (what, el) {

    });

  }

  /* ---------------- suggestions ---------------- */

  function openSuggest() {
    var r = recommend();
    var dlg = modal('');
    var body = '';

    if (state.recs && state.recs.items.length) {
      body += '<p class="sec-label">From Claude' + (state.recs.at ? ' \u00b7 ' + esc(state.recs.at) : '') + '</p>';
      body += state.recs.items.map(function (item, i) {
        return '<div class="rec cat-' + (CATS[item.category] ? item.category : 'food') + '">'
          + '<span class="rank">' + (i + 1) + '</span><div class="body">'
          + '<div class="t">' + esc(item.title || '') + '</div>'
          + '<p class="why">' + esc(item.body || '') + '</p></div></div>';
      }).join('');
    }

    body += '<p class="sec-label">From your ledger</p>';
    if (!r.picks.length) {
      body += '<p class="none">' + esc(say('recsEmpty')) + '</p>';
    } else {
      body += '<p class="byline">' + esc(say('recsIntro')) + '</p>';
      body += r.picks.map(function (p, i) {
        return '<div class="rec cat-' + catOf(p.entry) + '">'
          + '<span class="rank">' + (i + 1) + '</span><div class="body">'
          + '<div class="t"><button data-x="open" data-id="' + esc(p.entry.id) + '">' + esc(p.entry.title) + '</button></div>'
          + '<p class="why">' + esc(p.why) + '</p></div></div>';
      }).join('');
    }

    if (r.notes.length) {
      body += '<p class="sec-label">Noticed</p>' + r.notes.map(function (n) {
        return '<p class="obs">' + esc(n) + '</p>';
      }).join('');
    }

    onClose(dlg, function (what, el) {
      if (what === 'open') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
      else if (what === 'howto') { dlg.close(); openHowto(); }
    });
    dlg.showModal();
  }

  /* ---------------- discovery ---------------- */

  function catalog() { return Array.isArray(state.catalog) ? state.catalog : []; }

  function discCat(item) {
    return item.kind === 'screen' ? 'screen'
      : item.kind === 'food' ? 'food'
      : item.kind === 'live' ? 'live' : 'place';
  }

  function discHay(item) {
    return [item.title, item.by, item.city, item.address, item.year, item.form, item.cuisine,
            (item.tags || []).join(' '), item.q || ''].join(' ').toLowerCase();
  }

  function initials(t) {
    var w = String(t || '').replace(/^(the|a|an)\s+/i, '').split(/\s+/).filter(Boolean);
    return (w.slice(0, 2).map(function (x) { return x.charAt(0); }).join('') || '?').toUpperCase();
  }

  function existingFor(item) {
    var t = norm(item.title), c = discCat(item);
    for (var i = 0; i < state.entries.length; i++) {
      if (catOf(state.entries[i]) === c && norm(state.entries[i].title) === t) return state.entries[i];
    }
    return null;
  }

  function nearScore(item, near) {
    if (discCat(item) === 'screen') return 0;
    var want = String(near || '').trim();
    if (!want) return 0;
    var hay = norm((item.city || '') + ' ' + (item.address || ''));
    var label = homeLabel();
    var terms = (label && want.toLowerCase() === label.toLowerCase()) ? homeTerms() : [norm(want)];
    for (var i = 0; i < terms.length; i++) {
      if (terms[i].trim() && hay.indexOf(terms[i]) !== -1) return 8;
    }
    return 0;
  }

  function discSearch(q, scope, near) {
    var terms = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var out = [];
    catalog().forEach(function (item) {
      if (scope !== 'all' && discCat(item) !== scope) return;
      var hay = discHay(item);
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return;
      var title = String(item.title || '').toLowerCase().replace(/^(the|a|an)\s+/, '');
      var whole = q.trim().toLowerCase().replace(/^(the|a|an)\s+/, '');
      var score = 0;
      if (title === whole) score += 14;
      else if (title.indexOf(terms[0]) === 0) score += 10;
      else if (title.indexOf(terms[0]) !== -1) score += 6;
      score += (parseInt(item.w, 10) || 2) * 3;
      if ((item.tags || []).indexOf(whole) !== -1) score += 5;
      score += nearScore(item, near);
      var y = parseInt(item.year, 10);
      if (y) score += Math.min(y / 1000, 2.5);
      out.push({ item: item, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score || a.item.title.localeCompare(b.item.title); });
    return out.map(function (r) { return r.item; });
  }

  function discMapUrl(item) {
    if (discCat(item) === 'screen') return '';
    var q = item.address || (item.city ? item.title + ', ' + item.city : '');
    return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
  }

  function draftFrom(item) {
    var cat = discCat(item), f = {};
    if (cat === 'screen') {
      f.kind = item.form || 'Film'; f.year = item.year || ''; f.by = item.by || ''; f.where = '';
    } else if (cat === 'food') {
      f.city = item.city || ''; f.cuisine = item.cuisine || ''; f.address = item.address || ''; f.dish = '';
    } else if (cat === 'place') {
      f.kind = item.form || ''; f.city = item.city || ''; f.address = item.address || '';
    } else {
      f.kind = item.form || ''; f.venue = ''; f.city = item.city || ''; f.address = item.address || ''; f.support = '';
    }
    return {
      id: newId(), category: cat, status: 'wishlist', title: item.title || '', date: '',
      fields: f, 'with': '', tags: (item.tags || []).slice(), note: item.blurb || '',
      source: item.source || '', sourceUrl: item.sourceUrl || ''
    };
  }

  function openDiscover() {
    var dlg = modal('');
    var q = '', scope = 'all', near = homeLabel();
    var SCOPES = [['all', 'Everything'], ['screen', 'Movies & TV'], ['food', 'Restaurants'], ['place', 'Things to do']];
    var here = ARTIFACT_URL || (window.location && window.location.href) || '';

    dlg.innerHTML = dlgHead('Discovery')
      + '<div class="dlg-body">'
      + '<div class="disc-top">'
      + '<input class="disc-in" id="discQ" type="search" placeholder="Batman, Granville, Griffith\u2026" aria-label="Search sources">'
      + '<input class="disc-in disc-near" id="discNear" value="' + esc(near) + '" placeholder="Near\u2026" aria-label="Near which city">'
      + '</div>'
      + '<div class="scopes" id="discScopes">' + SCOPES.map(function (p) {
          return '<button class="tagchip" data-x="scope" data-scope="' + p[0] + '" aria-pressed="'
            + (scope === p[0]) + '">' + esc(p[1]) + '</button>';
        }).join('') + '</div>'
      + '<div id="discResults"></div>'
      + '</div>' + dlgFoot();

    var results = dlg.querySelector('#discResults');
    var input = dlg.querySelector('#discQ');
    var nearIn = dlg.querySelector('#discNear');

    function card(item) {
      var cat = discCat(item);
      var have = existingFor(item);
      var map = discMapUrl(item);
      var loc = item.address || item.city || '';
      var meta = cat === 'screen'
        ? [item.form, item.year, item.by].filter(Boolean).join(' \u00b7 ')
        : [item.form || item.cuisine, loc].filter(Boolean).join(' \u00b7 ');
      var missing = (cat !== 'screen' && !item.address)
        ? 'No street address in this source \u2014 the map link searches by name.' : '';

      return '<div class="dcard cat-' + cat + '">'
        + '<div class="dart ' + (cat === 'screen' ? 'poster' : 'square') + '">'
        + '<span class="ini">' + esc(initials(item.title)) + '</span>'
        + (item.year ? '<span class="yr">' + esc(item.year) + '</span>' : '')
        + '</div><div class="dbody">'
        + '<div class="dtitle">' + esc(item.title) + '</div>'
        + (meta ? '<p class="dmeta">' + esc(meta) + '</p>' : '')
        + (missing ? '<p class="dmeta dmissing">' + esc(missing) + '</p>' : '')
        + (item.blurb ? '<p class="dblurb">' + esc(item.blurb) + '</p>' : '')
        + '<div class="dfoot">'
        + '<span class="dsrc">via ' + esc(item.source || 'unknown source') + '</span>'
        + (have
            ? '<span class="dhave">In your ledger</span>'
              + '<button class="dbtn" data-x="have" data-id="' + esc(have.id) + '">Open entry</button>'
            : '<button class="dbtn primary" data-x="save" data-cid="' + esc(item.id) + '">Save to ledger</button>')
        + (item.sourceUrl ? '<a class="dbtn" href="' + esc(item.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
            + svg('ext') + 'Open source</a>' : '')
        + (map ? '<a class="dbtn" href="' + esc(map) + '" target="_blank" rel="noopener noreferrer">'
            + svg('pin') + 'Map</a>' : '')
        + '</div></div></div>';
    }

    function askBox(term) {
      var prompt = 'Add "' + term + '" to the discovery catalog in my ledger at ' + here
        + ' \u2014 search real sources, append entries to the top-level "catalog" array with title, year, creator, address, city, tags, source, sourceUrl and a candid blurb, then publish.';
      return '<div class="askbox"><h3>Nothing indexed for \u201c' + esc(term) + '\u201d</h3>'
        + '<p>This page is sandboxed and cannot reach the internet on its own, so Claude keeps the index stocked. '
        + 'Ask it and it will search real sources and add them here.</p>'
        + '<code class="snippet">' + esc(prompt) + '</code>'
        + '<button class="dbtn primary" data-x="copy">Copy prompt</button></div>';
    }

    function idle() {
      var n = catalog().length;
      return '<p class="disc-hint">Try one</p><div class="chipset">'
        + ['Batman', 'Granville', 'Griffith', 'Dune'].map(function (t) {
            return '<button class="tagchip" data-x="try" data-q="' + esc(t) + '">' + esc(t) + '</button>';
          }).join('') + '</div>'
        + '<p class="disc-hint">' + n + ' item' + (n === 1 ? '' : 's') + ' indexed'
        + (state.catalogAt ? ', last updated ' + esc(state.catalogAt) : '')
        + '. Every result links back to where it came from. Restaurants and places near '
        + esc(homeLabel() || 'home') + ' rank first \u2014 change the Near box to look elsewhere.</p>';
    }

    function renderResults() {
      if (!q.trim()) { results.innerHTML = idle(); return; }
      var list = discSearch(q, scope, near);
      results.innerHTML = list.length ? list.map(card).join('') : askBox(q.trim());
    }

    function syncScopes() {
      dlg.querySelectorAll('[data-x="scope"]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.getAttribute('data-scope') === scope));
      });
    }

    input.addEventListener('input', function () { q = input.value; renderResults(); });
    nearIn.addEventListener('input', function () { near = nearIn.value; renderResults(); });

    onClose(dlg, function (what, el) {
      if (what === 'scope') { scope = el.getAttribute('data-scope'); syncScopes(); renderResults(); }
      else if (what === 'try') { q = el.getAttribute('data-q'); input.value = q; renderResults(); input.focus(); }
      else if (what === 'have') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
      else if (what === 'copy') { copyText(el.parentNode.querySelector('.snippet').textContent, el); }
      else if (what === 'save') {
        var cid = el.getAttribute('data-cid'), item = null;
        catalog().forEach(function (c) { if (c.id === cid) item = c; });
        if (!item) return;
        dlg.close();
        openForm(null, draftFrom(item));
      }
    });

    renderResults();
    dlg.showModal();
    input.focus();
  }

  function copyText(text, btn) {
    var label = btn.textContent;
    function done() {
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = label; }, 1600);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (err) { btn.textContent = 'Select the text above'; }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }

  /* ---------------- year in review ---------------- */

  function openReview(year) {
    var years = yearsWithEntries();
    if (!years.length) return;
    var cur = years.indexOf(year) !== -1 ? year : years[0];
    var dlg = modal('');

    function tile(v, k, cls) {
      return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="v">' + v + '</div><div class="k">' + esc(k) + '</div></div>';
    }
    function bookend(label, entry) {
      if (!entry) return '';
      return '<div class="bookend"><span class="k">' + esc(label) + '</span>'
        + '<button type="button" data-x="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button>'
        + '<span class="when">' + esc(dayLabel(entry.date)) + '</span></div>';
    }

    function paint() {
      var r = reviewFor(cur);
      var tags = topOf(r.tags, 6), people = topOf(r.people, 5), cities = topOf(r.cities, 6);
      var maxTag = tags.length ? tags[0].n : 1;

      var body = '<div class="yearpick">' + years.map(function (y) {
        return '<button type="button" class="tagchip" data-x="year" data-year="' + esc(y) + '" aria-pressed="'
          + (y === cur) + '">' + esc(y) + '</button>';
      }).join('') + '</div>';

      if (!r.total) {
        body += '<p class="none">Nothing logged in ' + esc(cur) + '.</p>';
      } else {
        body += '<div class="tiles">'
          + tile(r.total, r.total === 1 ? 'Outing' : 'Outings', '')
          + tile(r.cat.food, 'Food', 'food')
          + tile(r.cat.screen, 'Screen', 'screen')
          + tile(r.cat.live, 'Live', 'live')
          + tile(r.cat.place, 'Do', 'place')
          + (state.home ? tile(r.away, 'Away', '') : '')
          + '</div>';

        body += '<div class="block"><h3>Most-used tags</h3>'
          + (tags.length ? '<div class="bars">' + tags.map(function (t) {
              return '<div class="bar"><span class="lbl">' + esc(t.key) + '</span>'
                + '<span class="track"><span class="fill" style="width:' + Math.round(t.n / maxTag * 100) + '%"></span></span>'
                + '<span class="val">' + t.n + '</span></div>';
            }).join('') + '</div>' : '<p class="none">No tags this year.</p>')
          + '</div>';

        body += '<div class="block"><h3>Who you were with</h3>'
          + (people.length ? '<div class="detail-tags">' + people.map(function (pp) {
              return '<span class="tagchip" style="cursor:default">' + esc(pp.key) + '<span class="n">' + pp.n + '</span></span>';
            }).join('') + '</div>' : '<p class="none">All of them alone. No judgement.</p>')
          + '</div>';

        var busiest = topOf(r.months, 1)[0];
        var monthCount = Object.keys(r.months).length;
        body += '<div class="block"><h3>The shape of it</h3>'
          + (busiest.n > 1
              ? '<div class="bookend"><span class="k">Busiest</span><span>' + MONTHS[parseInt(busiest.key, 10) - 1] + ' \u2014 ' + busiest.n + '</span></div>'
              : '<div class="bookend"><span class="k">Pace</span><span>Never twice in a month. ' + monthCount + ' month'
                + (monthCount === 1 ? '' : 's') + ' with anything in them.</span></div>')
          + bookend('First', r.first)
          + (r.last && r.first && r.last.id !== r.first.id ? bookend('Last', r.last) : '')
          + '</div>';

        if (cities.length) {
          body += '<div class="block"><h3>Cities</h3><div class="detail-tags">'
            + cities.map(function (c) {
                return '<span class="tagchip" style="cursor:default">' + esc(c.key) + '<span class="n">' + c.n + '</span></span>';
              }).join('') + '</div></div>';
        }
      }

      dlg.innerHTML = dlgHead(cur + ' in review') + '<div class="dlg-body">' + body + '</div>' + dlgFoot();
    }

    onClose(dlg, function (what, el) {
      if (what === 'year') { cur = el.getAttribute('data-year'); paint(); }
      else if (what === 'open') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- settings ---------------- */

  function openSettings() {
    var dlg = modal('');
    var TONES = [['plain', 'Straight'], ['dry', 'Dry'], ['salty', 'Salty']];
    var draftTone = tone(), draftHome = state.home;

    function paint() {
      dlg.innerHTML = dlgHead('Settings') + '<div class="dlg-body">'
        + '<div class="fieldset"><span class="flabel">Voice</span><div class="seg plain">'
        + TONES.map(function (pair) {
            return '<button type="button" data-x="tone" data-tone="' + pair[0] + '" aria-pressed="'
              + (draftTone === pair[0]) + '">' + esc(pair[1]) + '</button>';
          }).join('')
        + '</div><p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:.4rem 0 0">'
        + esc(draftTone === 'salty'
            ? 'Salty swears at the situation, never at you. Turn it down any time.'
            : draftTone === 'dry'
              ? 'Understated and a little funny. The default.'
              : 'Plain and neutral. No jokes.')
        + '</p></div>'
        + '<label class="field"><span class="flabel">Home base</span>'
        + '<input data-h="home" value="' + esc(draftHome) + '" placeholder="City, neighborhood, neighborhood">'
        + '<span class="hint">Comma separated. First one is the display name; the rest are neighborhoods that still count as home. '
        + 'Anything logged elsewhere is marked Away.</span></label>'
        + '<div class="fieldset"><span class="flabel">Appearance</span>'
        + '<p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:0">Light and dark live in the header, next to the gear. '
        + 'Auto follows whatever your Claude theme is set to. The choice is remembered in this browser only.</p></div>'
        + '</div><div class="dlg-foot">'
        + '<button type="button" class="btn btn-quiet" data-x="howto">How to update this</button>'
        + '<span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Cancel</button>'
        + '<button type="button" class="btn" data-x="save">Save</button></div>';
    }

    onClose(dlg, function (what, el) {
      if (what === 'tone') { draftTone = el.getAttribute('data-tone'); paint(); }
      else if (what === 'howto') { dlg.close(); openHowto(); }
      else if (what === 'save') {
        var input = dlg.querySelector('[data-h="home"]');
        draftHome = input ? input.value.trim() : draftHome;
        var changed = draftTone !== state.tone || draftHome !== state.home;
        state.tone = draftTone;
        state.home = draftHome;
        dlg.close();
        if (changed) persist(); else render();
      }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- how to update ---------------- */

  function openHowto() {
    var dlg = modal('');
    var here = ARTIFACT_URL || (window.location && window.location.href) || '';
    dlg.innerHTML = dlgHead('Keeping this up to date') + '<div class="dlg-body howto">'
      + '<h3>On the page</h3>'
      + '<p>Add entry, then edit or delete from any entry\u2019s detail view. Every change publishes a new version of this page, so it is saved for good.</p>'
      + '<h3>Or tell Claude</h3>'
      + '<p>Paste this address into a Claude project and Claude can read and update the ledger the same way you do:</p>'
      + '<code class="snippet">' + esc(here) + '</code>'
      + '<p class="quote">\u201cAdd Gjelina to my ledger \u2014 went last night with Ari, get the lamb. Tag it venice.\u201d</p>'
      + '<p class="quote">\u201cMove Severance to watched, finished it Tuesday.\u201d</p>'
      + '<p class="quote">\u201cWrite me three suggestions for this weekend and put them in the ledger.\u201d</p>'
      + '<h3>For the project instructions</h3>'
      + '<code class="snippet">' + esc('My activity ledger lives at ' + here + '\n\n'
        + 'When I mention a restaurant, bar, movie, show, concert, or live event, update the ledger: read it with the Artifact tool, edit the JSON in the script block with id "entry-data", and publish back to the same URL.\n\n'
        + 'Categories: food, screen, live. Statuses: food and live use "logged" or "wishlist"; screen also allows "watching". Tags are lowercase. Put street addresses in fields.address on food and live entries so the map links work, and what to order in fields.dish. Keep my wording in the note.\n\n'
        + 'To write suggestions, set the top-level "recs" to {"at": "<today>", "items": [{"category": "food", "title": "...", "body": "..."}]}. Base them only on what is already in the ledger. Match the "tone" field: plain, dry, or salty.') + '</code>'
      + '<h3>Stocking Discovery</h3>'
      + '<p>The page is sandboxed and cannot call an API, so the Discovery index holds whatever Claude has put in it. Ask for a search and it appends to the top-level catalog array:</p>'
      + '<code class="snippet">' + esc('{ "id": "unique", "kind": "screen" | "food" | "place" | "live", "title": "...",\n  "year": "2022", "by": "director or creator", "form": "Film | Series | Museum | Landmark",\n  "cuisine": "...", "city": "...", "address": "street address",\n  "tags": ["lowercase"], "w": 1-5 how notable, "q": "extra search words",\n  "blurb": "candid overview: what it is, why bother, the drawback",\n  "source": "Wikipedia", "sourceUrl": "https://..." }') + '</code>'
      + '<p>Use only facts that are actually in the source; leave a field out rather than guessing, and the card will say an address is missing. Bump catalogAt to the date.</p>'
      + '</div>' + dlgFoot();
    onClose(dlg);
    dlg.showModal();
  }

  /* ---------------- publish ---------------- */

  function buildDocument(next) {
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    var json = JSON.stringify(next, null, 2).replace(/</g, '\\u003c');
    return [
      '<!doctype html>', '<html lang="en">', '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>Dylan\u2019s Ledger</title>',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT_HREF + '">',
      '<style id="app-style">' + css + '<\/style>',
      '</head>', '<body>', BODY_MARKUP,
      '<script id="entry-data" type="application/json">', json, '<\/script>',
      '<script id="app-script">' + js + '<\/script>',
      '</body>', '</html>'
    ].join('\n');
  }

  function setSave(t, text) { save = { tone: t, text: text }; }

  function persist() {
    setSave('idle', 'Saving');
    render();
    stashUi();
    if (!window.claude || typeof window.claude.use !== 'function') {
      setSave('warn', 'Not saved \u2014 open this page from its own address');
      render();
      return;
    }
    window.claude.use('artifact').then(function (api) {
      if (!api) { setSave('warn', 'Saving unavailable in this view'); render(); return; }
      return api.publish(buildDocument(state)).then(function () { setSave('idle', 'Saved'); render(); });
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'conflict') setSave('warn', 'Someone published first \u2014 reloading');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'
        || code === 'capability_disabled' || code === 'capability_removed' || code === 'consent_required') {
        readOnly = true; setSave('warn', 'This view is read-only');
      }
      else if (code === 'rate_limited') setSave('warn', 'Saving too fast \u2014 wait a moment');
      else if (code === 'too_large') setSave('warn', 'Too large to publish');
      else setSave('warn', 'Could not save \u2014 try again');
      render();
    });
  }

  render();
}());
</script>
