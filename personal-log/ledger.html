      dlg.innerHTML = dlgHead('You')
        + '<div class="dlg-body"><div class="youlist">'
        + '<button type="button" class="yourow" data-x="suggest">' + svg('spark') + '<span>Suggest something</span></button>'
        + '<button type="button" class="yourow" data-x="spin">' + svg('auto') + '<span>Spin it</span><span class="c">' + w + '</span></button>'
        + '<button type="button" class="yourow" data-x="dishes">' + svg('check') + '<span>Order again</span><span class="c">' + d + '</span></button>'
        + '<button type="button" class="yourow" data-x="promises">' + svg('check') + '<span>Said I\u2019d go back</span><span class="c">' + p + '</span></button>'
        + (years.length ? '<button type="button" class="yourow" data-x="review">' + svg('book') + '<span>' + esc(years[0]) + ' in review, recap</span></button>' : '')
        + '<button type="button" class="yourow" data-x="settings">' + svg('gear') + '<span>Settings</span></button>'
        + '</div>'
        + '<div class="fieldset" style="margin:1.125rem 0 0"><span class="flabel">Appearance</span>'
        + '<div class="seg3" role="group" aria-label="Appearance">'
        + ['auto', 'light', 'dark'].map(function (k) {
            var lbl = k === 'auto' ? 'Auto' : k === 'light' ? 'Light' : 'Dark';
            return '<button type="button" data-x="theme" data-theme="' + k + '" aria-pressed="' + (themePref === k) + '" aria-label="' + lbl + '">'
              + svg(k === 'auto' ? 'auto' : k === 'light' ? 'sun' : 'moon') + '<span class="c">' + lbl + '</span></button>';
          }).join('')
        + '</div></div></div>' + dlgFoot();
    }
    onClose(dlg, function (what, el) {
      if (what === 'suggest') { dlg.close(); openSuggest(); }
      else if (what === 'spin') { dlg.close(); openSpin(); }
      else if (what === 'dishes') { dlg.close(); openDishes(); }
      else if (what === 'promises') { dlg.close(); openPromises(); }
      else if (what === 'review') { dlg.close(); openReview(yearsWithEntries()[0]); }
      else if (what === 'settings') { dlg.close(); openSettings(); }
      else if (what === 'theme') { setTheme(el.getAttribute('data-theme')); paint(); }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- modal plumbing ---------------- */

  function modal(cls) {
    var dlg = document.createElement('dialog');
    if (cls) dlg.className = cls;
    document.body.appendChild(dlg);
    dlg.addEventListener('close', function () { dlg.remove(); });
    return dlg;
  }
  function dlgHead(title) {
    return '<div class="dlg-head"><h2>' + esc(title) + '</h2><span class="spacer"></span>'
      + '<button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>';
  }
  function dlgFoot(inner) {
    return '<div class="dlg-foot"><span class="spacer"></span>' + (inner || '')
      + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
  }
  function onClose(dlg, extra) {
    dlg.addEventListener('click', function (event) {
      var el = event.target.closest('[data-x]');
      if (!el) return;
      var what = el.getAttribute('data-x');
      if (what === 'close') dlg.close();
      else if (extra) extra(what, el);
    });
  }

  /* ---------------- detail ---------------- */

  function relatedHtml(entry) {
    var rel = relatedTo(entry);
    if (!rel.length) return '';
    return '<p class="sec-label">Related</p>' + rel.map(function (r) {
      return '<div class="rec cat-' + catOf(r.entry) + '"><div class="body">'
        + '<div class="t"><button data-x="open-related" data-id="' + esc(r.entry.id) + '">'
        + esc(r.entry.title) + '</button></div>'
        + '<p class="why">' + esc(CATS[catOf(r.entry)].short)
        + (statusOf(r.entry) === 'wishlist' ? ' · want to' : '')
        + (r.why ? ' · ' + r.why : '') + '</p></div></div>';
    }).join('');
  }

  function openDetail(entry) {
    if (!entry) return;
    var dlg = modal('cat-' + catOf(entry));

    function paint() {
      var cat = catOf(entry);
      var facts = '';
      fieldDefs(cat).forEach(function (def) {
        var val = entry.fields && entry.fields[def.key];
        if (val) facts += '<div class="fact"><dt>' + esc(def.label) + '</dt><dd>' + esc(val) + '</dd></div>';
      });
      var who = peopleOf(entry);
      if (who.length) {
        facts += '<div class="fact"><dt>Who with</dt><dd>' + who.map(function (p) {
          return '<button type="button" class="linkish" style="color:inherit;text-decoration:underline;'
            + 'text-underline-offset:3px;font-weight:500;padding:0" data-x="who" data-who="' + esc(p) + '"'
            + ' aria-label="Show everything with ' + esc(p) + '">' + esc(p) + '</button>';
        }).join(', ') + '</dd></div>';
      } else if (entry['with']) {
        facts += '<div class="fact"><dt>Who with</dt><dd>' + esc(entry['with']) + '</dd></div>';
      }
      facts += '<div class="fact"><dt>Date</dt><dd>' + (entry.date ? esc(dayLabel(entry.date))
        + (entry.date.length > 7 ? ', ' + entry.date.slice(0, 4) : '') : 'Not yet') + '</dd></div>';
      if (entry.again === true || entry.again === false) {
        facts += '<div class="fact"><dt>' + esc(cat === 'screen' ? 'Watch again?' : 'Go again?') + '</dt><dd>'
          + (entry.again ? 'Yes' : 'No') + '</dd></div>';
      }
      if (entry.createdAt) facts += '<div class="fact"><dt>Added</dt><dd>' + esc(dayLabel(entry.createdAt.slice(0, 10))) + '</dd></div>';
      if (entry.updatedAt) facts += '<div class="fact"><dt>Edited</dt><dd>' + esc(dayLabel(entry.updatedAt.slice(0, 10))) + '</dd></div>';
      var url = mapUrl(entry);

      dlg.innerHTML = '<div class="dlg-head"><div>'
        + '<div class="dlg-chips"><span class="chip chip-cat">' + esc(CATS[cat].short) + '</span>'
        + '<span class="chip chip-soft">' + esc(statusLabel(entry)) + '</span>'
        + (isAway(entry) === 'away' ? '<span class="chip chip-soft">Away</span>' : '')
        + '</div><h2>' + esc(entry.title) + '</h2></div>'
        + '<span class="spacer"></span><button type="button" class="closex" data-x="close" aria-label="Close">\u00d7</button></div>'
        + '<div class="dlg-body">'
        + '<p class="detail-note">' + (entry.note ? esc(entry.note) : '<span class="none">' + esc(say('noNote')) + '</span>') + '</p>'
        + '<dl class="facts">' + facts + '</dl>'
        + (url || entry.sourceUrl
            ? '<div class="dfoot" style="margin:0 0 1.25rem">'
              + (url ? '<a class="maplink-full" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">'
                      + svg('pin') + 'Open in Maps</a>' : '')
              + (entry.sourceUrl ? '<a class="maplink-full" href="' + esc(entry.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
                      + svg('ext') + 'Open ' + esc(entry.source || 'source') + '</a>' : '')
              + '</div>'
            : '')
        + (tagsOf(entry).length ? '<div class="detail-tags">' + tagsOf(entry).map(function (t) {
            return '<button class="tagchip" data-x="tag" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
          }).join('') + '</div>' : '')
        + relatedHtml(entry)
        + '</div>'
        + (readOnly ? '' : '<div class="dlg-foot">'
            + '<button type="button" class="btn" data-x="edit">Edit</button>'
            + '<button type="button" class="btn btn-quiet" data-x="delete">Delete</button>'
            + '<span class="spacer"></span>'
            + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>');
    }

    onClose(dlg, function (what, el) {
      if (what === 'tag') { dlg.close(); toggleTag(el.getAttribute('data-tag')); }
      else if (what === 'who') { dlg.close(); setWho(el.getAttribute('data-who')); }
      else if (what === 'open-related') {
        var next = find(el.getAttribute('data-id'));
        if (next) { dlg.close(); openDetail(next); }
      }
      else if (what === 'edit') { dlg.close(); openForm(entry); }
      else if (what === 'delete') {
        state.entries = state.entries.filter(function (e) { return e.id !== entry.id; });
        var trashed = JSON.parse(JSON.stringify(entry));
        trashed.deletedAt = new Date().toISOString();
        state.trash = state.trash || [];
        state.trash.push(trashed);
        dlg.close();
        showUndo(trashed);
        persist();
      }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- form ---------------- */

  var SHARED_FIELD_KEYS = ['city', 'address'];

  function openForm(entry, prefill) {
    var editing = !!entry;
    var draft = entry ? JSON.parse(JSON.stringify(entry))
      : prefill || { id: newId(), category: ui.cat === 'all' ? 'food' : ui.cat, status: 'logged', title: '',
          date: today(), fields: {}, 'with': '', tags: [], note: '', again: null };
    var dlg = modal('');
    var pendingCatSwitch = null, pendingDropped = null;
    var painted = false;
    var dupWarned = null;

    function duplicateOf(d) {
      var t = String(d.title || '').trim().toLowerCase();
      if (!t) return null;
      for (var i = 0; i < state.entries.length; i++) {
        var e = state.entries[i];
        if (e.id === d.id) continue;
        if (catOf(e) === catOf(d) && String(e.title || '').trim().toLowerCase() === t) return e;
      }
      return null;
    }

    function labelFor(cat, key) {
      var defs = (CATS[cat] && CATS[cat].fields) || [];
      for (var i = 0; i < defs.length; i++) if (defs[i].key === key) return defs[i].label;
      return key.charAt(0).toUpperCase() + key.slice(1);
    }

    function applyCatSwitch(nextCat) {
      var keep = CATS[nextCat].fields.map(function (d) { return d.key; }).concat(SHARED_FIELD_KEYS);
      var pruned = {};
      keep.forEach(function (k) { if (draft.fields && draft.fields[k]) pruned[k] = draft.fields[k]; });
      draft.fields = pruned;
      draft.category = nextCat;
      draft.status = statusOf(draft);
      pendingCatSwitch = null; pendingDropped = null;
      paint('[data-x="cat"][data-cat="' + nextCat + '"]');
    }

    function paint(focusKey) {
      dlg.className = 'cat-' + catOf(draft);
      var conf = CATS[catOf(draft)];

      if (pendingCatSwitch) {
        var fromCat = catOf(draft);
        var lost = pendingDropped.map(function (k) {
          return '<li><strong>' + esc(labelFor(fromCat, k)) + ':</strong> ' + esc(draft.fields[k]) + '</li>';
        }).join('');
        dlg.innerHTML = dlgHead('Switch to ' + CATS[pendingCatSwitch].label + '?') + '<div class="dlg-body">'
          + '<p>These fields do not exist on ' + esc(CATS[pendingCatSwitch].label) + ' and will be dropped:</p>'
          + '<ul>' + lost + '</ul></div>'
          + '<div class="dlg-foot"><span class="spacer"></span>'
          + '<button type="button" class="btn btn-quiet" data-x="cat-cancel">Keep ' + esc(conf.label) + '</button>'
          + '<button type="button" class="btn btn-danger" data-x="cat-confirm">Switch and discard</button></div>';
        var cancelBtn = dlg.querySelector('[data-x="cat-cancel"]');
        if (cancelBtn) cancelBtn.focus();
        return;
      }

      var out = '<div class="dlg-head"><div>'
        + (draft.sourceUrl || draft.aiDraft
            ? '<div class="dlg-chips">'
              + (draft.sourceUrl ? '<span class="chip chip-soft">via ' + esc(draft.source || 'source') + '</span>' : '')
              + (draft.aiDraft ? '<span class="chip chip-soft">Claude filled this in — check it</span>' : '')
              + '</div>'
            : '')
        + '<h2>' + esc(editing ? 'Edit entry' : 'New entry') + '</h2></div>'
        + '<span class="spacer"></span><button type="button" class="closex" data-x="close" aria-label="Close">×</button></div>'
        + '<div class="dlg-body">';

      out += '<div class="fieldset"><span class="flabel">Category</span><div class="seg">'
        + CAT_ORDER.map(function (cat) {
            return '<button type="button" class="cat-' + cat + '" data-x="cat" data-cat="' + cat + '" aria-pressed="'
              + (catOf(draft) === cat) + '">' + esc(CATS[cat].label) + '</button>';
          }).join('') + '</div></div>';

      out += '<div class="fieldset"><span class="flabel">Status</span><div class="seg plain">'
        + conf.statuses.map(function (pair) {
            return '<button type="button" data-x="status" data-status="' + pair[0] + '" aria-pressed="'
              + (statusOf(draft) === pair[0]) + '">' + esc(pair[1]) + '</button>';
          }).join('') + '</div></div>';

      if (statusOf(draft) !== 'wishlist') {
        var againLabel = catOf(draft) === 'screen' ? 'Watch again?' : 'Would I go again?';
        out += '<div class="fieldset"><span class="flabel">' + esc(againLabel) + '</span><div class="seg plain">'
          + '<button type="button" data-x="again" data-again="true" aria-pressed="' + (draft.again === true) + '">Yes</button>'
          + '<button type="button" data-x="again" data-again="false" aria-pressed="' + (draft.again === false) + '">No</button>'
          + '</div></div>';
      }

      out += '<label class="field"><span class="flabel">' + esc(conf.titleLabel) + '</span>'
        + '<input data-f="title" value="' + esc(draft.title) + '"></label>';

      out += '<div class="grid2">'
        + '<label class="field"><span class="flabel">Date</span><input data-f="date" type="date" value="' + esc(draft.date) + '">'
        + '<span class="hint">Blank for something you have not done yet.</span></label>'
        + '<label class="field"><span class="flabel">Who with</span><input data-f="with" value="' + esc(draft['with'] || '') + '"></label>'
        + '</div>';

      out += '<div class="grid2">' + conf.fields.filter(function (d) { return !d.wide; })
        .map(function (d) { return fieldInput(d, draft); }).join('') + '</div>';
      out += conf.fields.filter(function (d) { return d.wide; })
        .map(function (d) { return fieldInput(d, draft); }).join('');

      if (draft.sourceUrl) {
        out += '<div class="fieldset"><span class="flabel">Source</span><div class="row">'
          + '<a class="maplink-full" href="' + esc(draft.sourceUrl) + '" target="_blank" rel="noopener noreferrer">'
          + svg('ext') + esc(draft.source || 'Open source') + '</a>'
          + '<button type="button" class="btn btn-quiet" data-x="rm-source">Remove source</button>'
          + '</div></div>';
      }

      out += '<label class="field"><span class="flabel">Tags</span><input data-f="tags" value="' + esc((draft.tags || []).join(', ')) + '">'
        + '<span class="hint">Comma separated. These become filter chips.</span></label>';
      out += '<label class="field"><span class="flabel">The note</span><textarea data-f="note" placeholder="What it was like. What past-you wants future-you to know.">' + esc(draft.note) + '</textarea></label>';

      out += '</div><div class="dlg-foot">'
        + (dupWarned
            ? '<span class="warn" role="alert">' + esc(say('dupWarn'))
              + (dupWarned.date ? ' Logged ' + esc(dayLabel(dupWarned.date)) + '.' : '') + '</span>'
            : '')
        + '<span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Cancel</button>'
        + '<button type="button" class="btn" data-x="save">'
        + (dupWarned ? 'Save anyway' : (editing ? 'Save changes' : 'Add to ledger')) + '</button></div>';
      dlg.innerHTML = out;
      if (!painted) {
        painted = true;
        var first = dlg.querySelector('[data-f="title"]');
        if (first) first.focus();
      } else {
        var target = focusKey ? dlg.querySelector(focusKey) : null;
        (target || dlg.querySelector('[data-x="close"]')).focus();
      }
    }

    function fieldInput(def, d) {
      var val = (d.fields && d.fields[def.key]) || '';
      var input = def.options
        ? '<select data-f="fields.' + def.key + '"><option value=""></option>'
          + def.options.map(function (o) {
              return '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
            }).join('') + '</select>'
        : '<input data-f="fields.' + def.key + '" value="' + esc(val) + '">';
      return '<label class="field"><span class="flabel">' + esc(def.label) + '</span>' + input
        + (def.hint ? '<span class="hint">' + esc(def.hint) + '</span>' : '') + '</label>';
    }

    function collect() {
      draft.fields = draft.fields || {};
      dlg.querySelectorAll('[data-f]').forEach(function (el) {
        var key = el.getAttribute('data-f'), val = el.value.trim();
        if (key.indexOf('fields.') === 0) draft.fields[key.slice(7)] = val;
        else if (key === 'tags') draft.tags = val ? val.split(',').map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean) : [];
        else draft[key] = val;
      });
    }

    onClose(dlg, function (what, el) {
      if (what === 'cat') {
        collect();
        var nextCat = el.getAttribute('data-cat');
        var keep = CATS[nextCat].fields.map(function (d) { return d.key; }).concat(SHARED_FIELD_KEYS);
        var dropped = Object.keys(draft.fields || {}).filter(function (k) {
          return keep.indexOf(k) === -1 && draft.fields[k];
        });
        if (dropped.length) { pendingCatSwitch = nextCat; pendingDropped = dropped; paint(); }
        else applyCatSwitch(nextCat);
      }
      else if (what === 'cat-confirm') { applyCatSwitch(pendingCatSwitch); }
      else if (what === 'cat-cancel') {
        pendingCatSwitch = null; pendingDropped = null;
        paint('[data-x="cat"][data-cat="' + catOf(draft) + '"]');
      }
      else if (what === 'status') {
        collect();
        draft.status = el.getAttribute('data-status');
        paint('[data-x="status"][data-status="' + draft.status + '"]');
      }
      else if (what === 'again') {
        collect();
        var want = el.getAttribute('data-again') === 'true';
        draft.again = draft.again === want ? null : want;
        paint('[data-x="again"][data-again="' + want + '"]');
      }
      else if (what === 'rm-source') {
        collect();
        delete draft.source;
        delete draft.sourceUrl;
        paint('[data-x="close"]');
      }
      else if (what === 'save') {
        collect();
        if (!draft.title) { var t = dlg.querySelector('[data-f="title"]'); if (t) t.focus(); return; }
        var clash = duplicateOf(draft);
        if (clash && (!dupWarned || dupWarned.id !== clash.id)) {
          dupWarned = clash; paint('[data-x="save"]'); return;
        }
        if (!clash) dupWarned = null;
        delete draft.sample;
        delete draft.aiDraft;
        var nowIso = new Date().toISOString();
        if (!editing) draft.createdAt = nowIso;
        draft.updatedAt = nowIso;
        var existing = find(draft.id);
        if (existing) state.entries[state.entries.indexOf(existing)] = draft;
        else state.entries.push(draft);
        dlg.close(); persist();
      }
    });
    dlg.addEventListener('keydown', function (event) {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        var saveBtn = dlg.querySelector('[data-x="save"]');
        if (saveBtn) saveBtn.click();
      }
    });
    paint();
    dlg.showModal();
  }

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* ---------------- spin ---------------- */

  function openSpin() {
    var pool = wishlist();
    var dlg = modal('');
    var picked = null;

    if (!pool.length) {
      dlg.innerHTML = dlgHead('Spin it') + '<div class="dlg-body"><p class="none">' + esc(say('spinEmpty')) + '</p></div>' + dlgFoot();
      onClose(dlg);
      dlg.showModal();
      return;
    }

    var ITEM = 58, LOOPS = 5;

    function shell() {
      dlg.className = picked ? 'cat-' + catOf(picked) : '';
      dlg.innerHTML = dlgHead('Spin it')
        + '<div class="dlg-body"><div class="reel-wrap">'
        + '<div class="reel"><div class="reel-strip" id="reelStrip"></div>'
        + '<div class="reel-window"></div><div class="reel-fade"></div></div>'
        + '<p class="reel-caption" id="reelCap">' + esc(say('spinRolling')) + '</p>'
        + '</div></div>'
        + '<div class="dlg-foot"><span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="again" id="againBtn" disabled>Spin again</button>'
        + '<button type="button" class="btn" data-x="open" id="openBtn" disabled>Open it</button>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Close</button></div>';
    }

    function reelItem(entry, isWin) {
      return '<div class="reel-item' + (isWin ? ' win' : '') + '">'
        + '<div class="t">' + esc(entry.title) + '</div>'
        + '<div class="s">' + esc(summaryBits(entry).slice(0, 2).join(' \u00b7 ')) + '</div></div>';
    }

    function roll() {
      picked = pool[Math.floor(Math.random() * pool.length)];
      shell();
      var strip = document.getElementById('reelStrip');
      var cap = document.getElementById('reelCap');
      var again = document.getElementById('againBtn');
      var open = document.getElementById('openBtn');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var seq = [];
      if (reduce || pool.length === 1) {
        seq = [pool[0], picked, pool[pool.length - 1]];
        strip.innerHTML = seq.map(function (e, i) { return reelItem(e, i === 1); }).join('');
        strip.style.transform = 'translateY(0)';
        settle(cap, again, open);
        return;
      }

      for (var loop = 0; loop < LOOPS; loop++) {
        pool.forEach(function (e) { seq.push(e); });
      }
      var winAt = seq.length;
      seq.push(picked);
      seq.push(pool[Math.floor(Math.random() * pool.length)]);
      seq.push(pool[Math.floor(Math.random() * pool.length)]);
      strip.innerHTML = seq.map(function (e, i) { return reelItem(e, i === winAt); }).join('');
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0)';

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          strip.style.transition = 'transform 2.5s cubic-bezier(.14,.72,.16,1)';
          strip.style.transform = 'translateY(' + (-(winAt - 1) * ITEM) + 'px)';
        });
      });
      var done = false;
      var finish = function () { if (done) return; done = true; settle(cap, again, open); };
      strip.addEventListener('transitionend', finish, { once: true });
      setTimeout(finish, 2800);
    }

    function settle(cap, again, open) {
      if (cap) cap.textContent = say('spinLanded') + ' \u2014 ' + CATS[catOf(picked)].label;
      if (again) again.disabled = false;
      if (open) open.disabled = false;
      dlg.className = 'cat-' + catOf(picked);
    }

    onClose(dlg, function (what) {
      if (what === 'again') roll();
      else if (what === 'open' && picked) { var keep = picked; dlg.close(); openDetail(keep); }
    });
    roll();
    dlg.showModal();
  }

  /* ---------------- dishes ---------------- */

  function openDishes() {
    var list = dishes();
    var dlg = modal('cat-food');
    dlg.innerHTML = dlgHead('Order this again')
      + '<div class="dlg-body">'
      + (list.length
          ? list.map(function (e) {
              var url = mapUrl(e);
              return '<div class="rec"><div class="body">'
                + '<div class="t">' + esc(e.fields.dish) + '</div>'
                + '<p class="why">' + esc(e.title) + (cityOf(e) ? ' \u00b7 ' + esc(cityOf(e)) : '')
                + ' &nbsp;<button class="linkish" data-x="open" data-id="' + esc(e.id) + '">Open</button>'
                + (url ? ' <a class="linkish" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Map</a>' : '')
                + '</p></div></div>';
            }).join('')
          : '<p class="none">' + esc(say('dishEmpty')) + '</p>')
      + '</div>' + dlgFoot();
    onClose(dlg, function (what, el) {

  /* ---------------- discovery ---------------- */

  function catalog() { return Array.isArray(state.catalog) ? state.catalog : []; }

  function discCat(item) {
    return item.kind === 'screen' ? 'screen'
      : item.kind === 'food' ? 'food'
      : item.kind === 'live' ? 'live' : 'place';
  }

  function discHay(item) {
    return [item.title, item.by, item.city, item.address, item.year, item.form, item.cuisine, item.venue, item.when,
            (item.tags || []).join(' '), item.q || ''].join(' ').toLowerCase();
  }

  function initials(t) {
    var w = String(t || '').replace(/^(the|a|an)\s+/i, '').split(/\s+/).filter(Boolean);
    return (w.slice(0, 2).map(function (x) { return x.charAt(0); }).join('') || '?').toUpperCase();
  }

  function existingFor(item) {
    var t = norm(item.title), c = discCat(item);
    for (var i = 0; i < state.entries.length; i++) {
      if (catOf(state.entries[i]) === c && norm(state.entries[i].title) === t) return state.entries[i];
    }
    return null;
  }

  var NEAR_ALIASES = {
    westside: ['santa monica', 'venice', 'marina del rey', 'culver city', 'brentwood', 'bel air',
               'beverly hills', 'west hollywood', 'weho', 'pacific palisades', 'mar vista', 'palms',
               'century city', 'sawtelle'],
    valley:   ['studio city', 'sherman oaks', 'north hollywood', 'noho', 'burbank', 'encino',
               'tarzana', 'van nuys', 'woodland hills', 'toluca lake', 'valley village', 'universal city'],
    eastside: ['silver lake', 'silverlake', 'los feliz', 'echo park', 'highland park', 'eagle rock',
               'atwater village', 'glassell park', 'mount washington', 'frogtown', 'elysian valley'],
    beach:    ['santa monica', 'venice', 'marina del rey', 'manhattan beach', 'hermosa beach',
               'redondo beach', 'playa del rey', 'playa vista', 'el segundo']
  };

  function nearScore(item, near) {
    if (discCat(item) === 'screen') return 0;
    var raw = String(near || '').trim().toLowerCase();
    if (!raw) return 0;
    var hay = norm((item.city || '') + ' ' + (item.address || ''));
    var city = norm(item.city || '');
    var label = homeLabel();

    if (label && raw === label.toLowerCase()) {
      var homeT = homeTerms();
      for (var i = 0; i < homeT.length; i++) {
        if (homeT[i].trim() && hay.indexOf(homeT[i]) !== -1) return 8;
      }
      return 0;
    }

    var want = norm(raw);
    if (city.trim() && city === want) return 8;

    var alias = NEAR_ALIASES[raw];
    if (alias) {
      for (var j = 0; j < alias.length; j++) {
        if (city.indexOf(norm(alias[j])) !== -1) return 5;
      }
      return 0;
    }

    if (hay.indexOf(want) !== -1) return 2;
    return 0;
  }

  function discSearch(q, scope, near) {
    var STOP = { the: 1, a: 1, an: 1, of: 1, in: 1, at: 1, and: 1, near: 1, to: 1, for: 1, on: 1, some: 1, good: 1 };
    var terms = String(q || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    var meaningful = terms.filter(function (t) { return !STOP[t]; });
    if (meaningful.length) terms = meaningful;
    if (!terms.length) return [];
    var out = [];
    catalog().forEach(function (item) {
      if (scope !== 'all' && discCat(item) !== scope) return;
      var hay = discHay(item);
      var titleLc = String(item.title || '').toLowerCase();
      var matchCount = 0;
      for (var i = 0; i < terms.length; i++) {
        if (hay.indexOf(terms[i]) === -1) continue;
        matchCount++;
        if (titleLc.indexOf(terms[i]) !== -1) matchCount++;
      }
      if (!matchCount) return;
      var title = titleLc.replace(/^(the|a|an)\s+/, '');
      var whole = q.trim().toLowerCase().replace(/^(the|a|an)\s+/, '');
      var score = matchCount * 3;
      if (title === whole) score += 14;
      else if (title.indexOf(terms[0]) === 0) score += 10;
      else if (title.indexOf(terms[0]) !== -1) score += 6;
      score += (parseInt(item.w, 10) || 2) * 3;
      if ((item.tags || []).indexOf(whole) !== -1) score += 5;
      score += nearScore(item, near);
      var y = parseInt(item.year, 10);
      if (y) score += Math.min(y / 1000, 2.5);
      out.push({ item: item, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score || a.item.title.localeCompare(b.item.title); });
    return out.map(function (r) { return r.item; });
  }

  function discMapUrl(item) {
    if (discCat(item) === 'screen') return '';
    var q = item.address || (item.city ? item.title + ', ' + item.city : '');
    return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
  }

    } else if (cat === 'food') {

    } else if (cat === 'place') {

    } else {
      f.kind = item.form || ''; f.venue = item.venue || ''; f.city = item.city || ''; f.address = item.address || ''; f.support = '';
    }
    return {
      id: newId(), category: cat, status: 'wishlist', title: item.title || '',
      date: (cat === 'live' && /^\d{4}-\d{2}-\d{2}$/.test(item.date || '')) ? item.date : '',
      fields: f, 'with': '', tags: (item.tags || []).slice(), note: item.blurb || '', again: null,

  function csvCell(v) {
    var s = v == null ? '' : String(v);

  }

  function entriesCsv() {
    var FIELD_KEYS = ['city', 'cuisine', 'address', 'dish', 'kind', 'year', 'by', 'where', 'venue', 'support'];
    var head = ['id', 'category', 'status', 'title', 'date', 'with', 'tags', 'again', 'note']
      .concat(FIELD_KEYS).concat(['createdAt', 'updatedAt']);
    var rows = [head.join(',')];
    state.entries.forEach(function (e) {
      var f = e.fields || {};
      var row = [
        e.id, catOf(e), statusOf(e), e.title, e.date || '', e['with'] || '',
        tagsOf(e).join('; '),
        e.again === true ? 'yes' : e.again === false ? 'no' : '',
        e.note || ''
      ].concat(FIELD_KEYS.map(function (k) { return f[k] || ''; }))
       .concat([e.createdAt || '', e.updatedAt || '']);
      rows.push(row.map(csvCell).join(','));
    });
    return rows.join('\r\n');
  }

  function saveFile(filename, data, btn, noteEl) {
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Saving\u2026';
    if (noteEl) noteEl.textContent = '';
    function finish(t, ms) {
      btn.textContent = t;
      setTimeout(function () { btn.textContent = label; btn.disabled = false; }, ms || 1800);
    }
    function copyInstead() {
      btn.textContent = label; btn.disabled = false;
      copyText(data, btn);
      if (noteEl) noteEl.textContent = 'Saving files is not available in this view, so it was copied to your clipboard instead. Paste it into a note or a file.';
    }
    var use = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads') : Promise.resolve(null);
    use.then(function (dl) {
      if (!dl) { copyInstead(); return; }
      return dl.save({ filename: filename, data: data }).then(function () { finish('Saved'); });
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'declined') finish('Cancelled', 1200);
      else if (code === 'rate_limited') finish('Wait a moment, then try again', 2200);
      else if (code === 'too_large') finish('Too large to save', 2000);
      else copyInstead();
    });
  }

  function copyText(text, btn) {
    var label = btn.textContent;
    function done() {
      btn.textContent = 'Copied';
      setTimeout(function () { btn.textContent = label; }, 1600);
    }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (err) { btn.textContent = 'Select the text above'; }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }

  /* ---------------- year in review ---------------- */

  function openReview(year) {
    var years = yearsWithEntries();
    if (!years.length) return;
    var cur = years.indexOf(year) !== -1 ? year : years[0];
    var dlg = modal('');
    var recapScope = 'month', recapText = '', recapCtl = null;

    function recapLabel() {
      var now = new Date();
      return recapScope === 'month' ? MONTHS[now.getMonth()] + ' ' + now.getFullYear() : cur;
    }
    function recapEntries() {
      var now = new Date();
      var ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      return state.entries.filter(function (e) {
        if (statusOf(e) === 'wishlist') return false;
        var d = e.date || (e.createdAt ? e.createdAt.slice(0, 10) : '');
        if (!d) return false;
        return recapScope === 'month' ? d.slice(0, 7) === ym : d.slice(0, 4) === cur;
      }).sort(function (a, b) {
        return (a.date || a.createdAt || '') < (b.date || b.createdAt || '') ? -1 : 1;
      }).slice(-150);
    }
    function recapHtml() {
      return '<div class="block" id="recapBlock" data-ai-only' + (ai ? '' : ' hidden') + '>'
        + '<h3>Recap</h3>'
        + '<div class="row">'
        + '<button type="button" class="tagchip" data-x="recap-scope" data-scope="month" aria-pressed="' + (recapScope === 'month') + '">This month</button>'
        + '<button type="button" class="tagchip" data-x="recap-scope" data-scope="year" aria-pressed="' + (recapScope === 'year') + '">' + esc(cur) + '</button>'
        + '<span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="recap-go" id="recapGo">' + (recapText ? 'Write it again' : 'Write a recap') + '</button>'
        + '<button type="button" class="btn btn-quiet" data-x="recap-stop" id="recapStop" hidden>Stop</button>'
        + '</div>'
        + '<p class="recap-out" id="recapOut">' + (recapText ? esc(recapText)
            : '<span class="none">Four or five sentences about what you actually did, in your ledger’s voice. Uses your Claude account.</span>') + '</p>'
        + '</div>';
    }
    function runRecap() {
      if (!ai) return;
      var out = dlg.querySelector('#recapOut'), go = dlg.querySelector('#recapGo'), stop = dlg.querySelector('#recapStop');
      if (!out || !go) return;
      var list = recapEntries();
      if (!list.length) { out.innerHTML = '<span class="none">Nothing logged for ' + esc(recapLabel()) + ' yet.</span>'; return; }
      var refresh = !!recapText;
      recapCtl = new AbortController();
      go.disabled = true; stop.hidden = false;
      out.textContent = 'Thinking…';
      var prompt = [
        'Write a recap of my ' + (recapScope === 'month' ? 'month' : 'year') + ' (' + recapLabel() + ') from my personal ledger below. Second person, 4 to 6 sentences, one paragraph, no headings, no bullet points, no emoji.',
        'Use only what is in the entries. Name specific places, films, and people. Notice repeats, who I went with most, anything I said I would go back to, and any category I ignored. Do not invent anything, do not give advice, do not describe the format.',
        voiceLine(),
        'Entries, one per line:',
        list.map(compactEntry).join('\n')
      ].join('\n');
      ai(prompt, {
        modelTier: 'default',
        cache: refresh ? { gcTime: 86400000, refresh: true } : { gcTime: 86400000 },
        signal: recapCtl.signal,
        onText: function (u) { out.textContent = u.text; }
      }).then(function (r) {
        recapText = r.text; out.textContent = r.text;
        if (r.truncated) notify('Cut short. Try the month instead of the year.');
      }).catch(function (err) {
        var msg = aiError(err);
        out.textContent = err && err.text ? err.text : '';
        if (!out.textContent) out.innerHTML = '<span class="none">' + esc(msg || 'Stopped.') + '</span>';
        else if (msg) notify(msg);
        if (aiDead) { var b = dlg.querySelector('#recapBlock'); if (b) b.hidden = true; }
      }).then(function () {
        go.disabled = false; go.textContent = recapText ? 'Write it again' : 'Write a recap';
        stop.hidden = true; recapCtl = null;
      });
    }

    function tile(v, k, cls) {
      return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="v">' + v + '</div><div class="k">' + esc(k) + '</div></div>';
    }
    function bookend(label, entry) {
      if (!entry) return '';
      return '<div class="bookend"><span class="k">' + esc(label) + '</span>'
        + '<button type="button" data-x="open" data-id="' + esc(entry.id) + '">' + esc(entry.title) + '</button>'
        + '<span class="when">' + esc(dayLabel(entry.date)) + '</span></div>';
    }
    function tagsBlock(map, emptyLabel) {
      var tags = topOf(map, 6), maxTag = tags.length ? tags[0].n : 1;
      return '<div class="block"><h3>Most-used tags</h3>'
        + (tags.length ? '<div class="bars">' + tags.map(function (t) {
            return '<div class="bar"><span class="lbl">' + esc(t.key) + '</span>'
              + '<span class="track"><span class="fill" style="width:' + Math.round(t.n / maxTag * 100) + '%"></span></span>'
              + '<span class="val">' + t.n + '</span></div>';
          }).join('') + '</div>' : '<p class="none">' + esc(emptyLabel) + '</p>')
        + '</div>';
    }
    function peopleBlock(map) {
      var people = topOf(map, 5);
      return '<div class="block"><h3>Who you were with</h3>'
        + (people.length ? '<div class="detail-tags">' + people.map(function (pp) {
            return '<span class="tagchip" style="cursor:default">' + esc(pp.key) + '<span class="n">' + pp.n + '</span></span>';
          }).join('') + '</div>' : '<p class="none">All of them alone. No judgement.</p>')
        + '</div>';
    }
    function citiesBlock(map) {
      var cities = topOf(map, 6);
      if (!cities.length) return '';
      return '<div class="block"><h3>Cities</h3><div class="detail-tags">'
        + cities.map(function (c) {
            return '<span class="tagchip" style="cursor:default">' + esc(c.key) + '<span class="n">' + c.n + '</span></span>';
          }).join('') + '</div></div>';
    }
    function reviewTitle() {
      return cur === 'all' ? 'All time' : cur === '90d' ? 'Last 90 days' : cur + ' in review';
    }

    function paint() {
      var undated = trulyUndated();

      var body = '<div class="yearpick">'
        + '<button type="button" class="tagchip" data-x="year" data-year="90d" aria-pressed="' + (cur === '90d') + '">Last 90 days</button>'
        + '<button type="button" class="tagchip" data-x="year" data-year="all" aria-pressed="' + (cur === 'all') + '">All time</button>'
        + years.map(function (y) {
            return '<button type="button" class="tagchip" data-x="year" data-year="' + esc(y) + '" aria-pressed="'
              + (y === cur) + '">' + esc(y) + '</button>';
          }).join('') + '</div>';

      if (cur === 'all') {
        var ra = reviewAll();
        if (!ra.total) {
          body += '<p class="none">Nothing logged yet.</p>';
        } else {
          var mostRepeated = null;
          Object.keys(ra.titles).forEach(function (k) {
            var t = ra.titles[k];
            if (t.n > 1 && (!mostRepeated || t.n > mostRepeated.n)) mostRepeated = t;
          });
          var streak = longestWeekStreak();

          body += '<div class="tiles">'
            + tile(ra.total, ra.total === 1 ? 'Outing' : 'Outings', '')
            + tile(ra.cat.food, 'Food', 'food')
            + tile(ra.cat.screen, 'Screen', 'screen')
            + tile(ra.cat.live, 'Live', 'live')
            + tile(ra.cat.place, 'Do', 'place')
            + (state.home ? tile(ra.away + ' away \u00b7 ' + ra.unknown + ' unknown', 'Where', 'small') : '')
            + '</div>';

          body += '<div class="tiles">'
            + tile(streak, streak === 1 ? 'Week logged' : 'Weeks in a row, best run', 'small')
            + (mostRepeated
                ? tile(mostRepeated.n + '\u00d7', mostRepeated.title, mostRepeated.cat + ' small')
                : tile('\u2014', 'Nothing repeated yet', 'small'))
            + '</div>';

          body += tagsBlock(ra.tags, 'No tags yet.');
          body += peopleBlock(ra.people);
          body += neighborhoodBlock();
          body += citiesBlock(ra.cities);

          if (ra.first || ra.last) {
            body += '<div class="block"><h3>Bookends</h3>' + bookend('First', ra.first)
              + (ra.last && ra.first && ra.last.id !== ra.first.id ? bookend('Last', ra.last) : '') + '</div>';
          }
        }
      } else if (cur === '90d') {
        var rw = reviewWindow(90);
        if (!rw.total) {
          body += '<p class="none">Nothing dated in the last 90 days.</p>';
        } else {
          body += '<div class="tiles">'
            + tile(rw.total, rw.total === 1 ? 'Outing' : 'Outings', '')
            + tile(rw.cat.food, 'Food', 'food')
            + tile(rw.cat.screen, 'Screen', 'screen')
            + tile(rw.cat.live, 'Live', 'live')
            + tile(rw.cat.place, 'Do', 'place')
            + (state.home ? tile(rw.away + ' away \u00b7 ' + rw.unknown + ' unknown', 'Where', 'small') : '')
            + '</div>';

          body += tagsBlock(rw.tags, 'No tags in this window.');
          body += peopleBlock(rw.people);
          body += citiesBlock(rw.cities);

          if (rw.first || rw.last) {
            body += '<div class="block"><h3>Bookends</h3>' + bookend('First', rw.first)
              + (rw.last && rw.first && rw.last.id !== rw.first.id ? bookend('Last', rw.last) : '') + '</div>';
          }
        }
      } else {
        body += recapHtml();
        var r = reviewFor(cur);

        if (!r.total) {
          body += '<p class="none">Nothing logged in ' + esc(cur) + '.</p>';
        } else {
          body += '<div class="tiles">'
            + tile(r.total, r.total === 1 ? 'Outing' : 'Outings', '')
            + tile(r.cat.food, 'Food', 'food')
            + tile(r.cat.screen, 'Screen', 'screen')
            + tile(r.cat.live, 'Live', 'live')
            + tile(r.cat.place, 'Do', 'place')
            + (state.home ? tile(r.away + ' away \u00b7 ' + r.unknown + ' unknown', 'Where', 'small') : '')
            + '</div>';

          if (r.approx) {
            body += '<p class="disc-hint">' + r.approx + ' of these have no logged date \u2014 the year is based on when they were added.</p>';
          }

          body += tagsBlock(r.tags, 'No tags this year.');
          body += peopleBlock(r.people);

          var busiest = topOf(r.months, 1)[0];
          var monthCount = Object.keys(r.months).length;
          body += '<div class="block"><h3>The shape of it</h3>'
            + (busiest && busiest.n > 1
                ? '<div class="bookend"><span class="k">Busiest</span><span>' + MONTHS[parseInt(busiest.key, 10) - 1] + ' \u2014 ' + busiest.n + '</span></div>'
                : monthCount
                  ? '<div class="bookend"><span class="k">Pace</span><span>Never twice in a month. ' + monthCount + ' month'
                    + (monthCount === 1 ? '' : 's') + ' with anything in them.</span></div>'
                  : '<p class="none">No dated entries this year to chart a shape from.</p>')
            + bookend('First', r.first)
            + (r.last && r.first && r.last.id !== r.first.id ? bookend('Last', r.last) : '')
            + '</div>';

          body += citiesBlock(r.cities);
        }
      }

      if (undated.length) {
        body += '<p class="disc-hint">' + undated.length + ' entr' + (undated.length === 1 ? 'y has' : 'ies have')
          + ' no date at all and cannot be placed in any year \u2014 '
          + '<button type="button" class="linkish" data-x="show-undated">show them in the ledger</button>.</p>';
      }

      dlg.innerHTML = dlgHead(reviewTitle()) + '<div class="dlg-body">' + body + '</div>' + dlgFoot();
    }

    onClose(dlg, function (what, el) {
      if (what === 'year') { if (recapCtl) recapCtl.abort(); cur = el.getAttribute('data-year'); recapText = ''; paint(); }
      else if (what === 'recap-scope') { if (recapCtl) recapCtl.abort(); recapScope = el.getAttribute('data-scope'); recapText = ''; paint(); }
      else if (what === 'recap-go') { runRecap(); }
      else if (what === 'recap-stop') { if (recapCtl) recapCtl.abort(); }
      else if (what === 'open') { var e = find(el.getAttribute('data-id')); dlg.close(); openDetail(e); }
      else if (what === 'show-undated') {
        ui.q = ''; ui.tags = []; ui.cat = 'all'; ui.status = 'all'; ui.tab = 'main';
        stashUi(); dlg.close(); render();
      }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- settings ---------------- */

  function openSettings() {
    var dlg = modal('');
    var TONES = [['plain', 'Straight'], ['dry', 'Dry'], ['salty', 'Salty']];
    var draftTone = tone();
    var HOME_MAX = 24;
    var homeTermsDraft = String(state.home || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean);

    function commitHomeTerm(raw) {
      var t = String(raw || '').replace(/,+$/, '').trim();
      if (!t) return;
      var dupe = homeTermsDraft.some(function (h) { return h.toLowerCase() === t.toLowerCase(); });
      if (!dupe) homeTermsDraft.push(t);
    }

    function homeChipsHtml() {
      if (!homeTermsDraft.length) {
        return '<p class="hint" style="margin:0 0 .5rem">No home neighborhoods yet — everything will show as Away.</p>';
      }
      return '<div class="homechips">' + homeTermsDraft.map(function (t, i) {
        var long = t.length > HOME_MAX;
        return '<button type="button" class="tagchip homechip' + (long ? ' long' : '') + '" data-x="rm-home" data-i="' + i + '"'
          + (long ? ' title="Over ' + HOME_MAX + ' characters"' : '')
          + ' aria-label="Remove ' + esc(t) + ' from home base">' + esc(t) + '<span aria-hidden="true"> ×</span></button>';
      }).join('') + '</div>';
    }

    function paint() {
      dlg.innerHTML = dlgHead('Settings') + '<div class="dlg-body">'
        + '<div class="fieldset"><span class="flabel">Ledger voice</span><div class="seg plain">'
        + TONES.map(function (pair) {
            return '<button type="button" data-x="tone" data-tone="' + pair[0] + '" aria-pressed="'
              + (draftTone === pair[0]) + '">' + esc(pair[1]) + '</button>';
          }).join('')
        + '</div><p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:.4rem 0 0">'
        + esc(draftTone === 'salty'
            ? 'Salty means actual curse words. Aimed at the situation, never at you. Turn it down any time.'
            : draftTone === 'dry'
              ? 'Understated and a little funny. The default.'
              : 'Plain and neutral. No jokes.')
        + ' Discovery descriptions are written once, when an item gets indexed, and keep whatever voice they were written in — changing this does not rewrite them.'
        + '</p></div>'
        + '<div class="fieldset"><span class="flabel">Home base</span>'
        + homeChipsHtml()
        + '<input id="homeAdd" class="disc-in" style="width:100%" placeholder="Add a neighborhood, press Enter" aria-label="Add a home neighborhood">'
        + '<p class="hint" id="homeWarn" style="display:none;color:var(--c-live);margin-top:.35rem"></p>'
        + '<span class="hint">First one is the display name; the rest are neighborhoods that still count as home. '
        + 'Anything logged elsewhere is marked Away. Enter or comma adds one, click a chip to remove it.</span></div>'
        + '<div class="fieldset"><span class="flabel">Appearance</span>'
        + '<p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:0 0 .5rem">Light and dark live in the header, next to the gear. '
        + 'Auto follows whatever your Claude theme is set to. The choice is remembered in this browser only.</p>'
        + '<div class="seg plain">'
        + '<button type="button" data-x="density" data-density="comfortable" aria-pressed="' + (density === 'comfortable') + '">Comfortable</button>'
        + '<button type="button" data-x="density" data-density="compact" aria-pressed="' + (density === 'compact') + '">Compact</button>'
        + '</div></div>'
        + '<div class="fieldset"><span class="flabel">Backup</span>'
        + '<p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:0 0 .5rem">Save a copy you keep somewhere else. The backup file has everything — entries, catalog, settings, trash — and is what you would restore from. The spreadsheet is one row per entry.</p>'
        + '<div class="row">'
        + '<button type="button" class="btn btn-quiet" data-x="dl-json">Save backup file</button>'
        + '<button type="button" class="btn btn-quiet" data-x="dl-csv">Save as spreadsheet</button>'
        + '</div><p class="hint dl-note" role="status" style="margin:.4rem 0 0"></p></div>'
        + '<div class="fieldset"><span class="flabel">Trash</span>'
        + '<p class="hint" style="color:var(--ink-3);font-size:.8125rem;margin:0 0 .5rem">Deleted entries sit here until you empty it yourself — nothing purges automatically.</p>'
        + '<button type="button" class="btn btn-quiet" data-x="trash">View trash (' + (state.trash || []).length + ')</button></div>'
        + '</div><div class="dlg-foot">'
        + '<button type="button" class="btn btn-quiet" data-x="howto">How this works</button>'
        + '<span class="spacer"></span>'
        + '<button type="button" class="btn btn-quiet" data-x="close">Cancel</button>'
        + '<button type="button" class="btn" data-x="save">Save</button></div>';

      var addInput = dlg.querySelector('#homeAdd');
      var warn = dlg.querySelector('#homeWarn');
      if (addInput) {
        addInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            commitHomeTerm(addInput.value);
            paint();
            var next = dlg.querySelector('#homeAdd');
            if (next) next.focus();
          } else if (e.key === 'Backspace' && !addInput.value && homeTermsDraft.length) {
            homeTermsDraft.pop();
            paint();
            var next2 = dlg.querySelector('#homeAdd');
            if (next2) next2.focus();
          }
        });
        addInput.addEventListener('input', function () {
          if (!warn) return;
          var len = addInput.value.trim().length;
          if (len > HOME_MAX) {
            warn.textContent = 'That’s ' + len + ' characters — anything over ' + HOME_MAX + ' gets flagged once added.';
            warn.style.display = 'block';
          } else {
            warn.style.display = 'none';
          }
        });
      }
    }

    onClose(dlg, function (what, el) {
      if (what === 'tone') { draftTone = el.getAttribute('data-tone'); paint(); }
      else if (what === 'howto') { dlg.close(); openHowto(); }
      else if (what === 'copy-json') { copyText(JSON.stringify(state, null, 2), el); }
      else if (what === 'copy-csv') { copyText(entriesCsv(), el); }
      else if (what === 'dl-json') { saveFile('ledger-' + today() + '.json', JSON.stringify(state, null, 2), el, dlg.querySelector('.dl-note')); }
      else if (what === 'dl-csv') { saveFile('ledger-entries-' + today() + '.csv', entriesCsv(), el, dlg.querySelector('.dl-note')); }
      else if (what === 'density') { setDensity(el.getAttribute('data-density')); paint(); }
      else if (what === 'trash') { dlg.close(); openTrash(); }
      else if (what === 'rm-home') {
        homeTermsDraft.splice(parseInt(el.getAttribute('data-i'), 10), 1);
        paint();
      }
      else if (what === 'save') {
        var addInput = dlg.querySelector('#homeAdd');
        if (addInput && addInput.value.trim()) commitHomeTerm(addInput.value);
        var draftHome = homeTermsDraft.join(', ');
        var changed = draftTone !== state.tone || draftHome !== state.home;
        state.tone = draftTone;
        state.home = draftHome;
        dlg.close();
        if (changed) persist(); else render();
      }
    });
    paint();
    dlg.showModal();
  }

  /* ---------------- how to update ---------------- */

      + '<p class="quote">“Move Severance to watched, finished it Tuesday.”</p>'
      + '<p class="quote">“Stock Discovery with Thai places near WeHo and comedy shows this month.”</p>'

        + 'There is also a top-level "trash" array. Deleted entries move there with a deletedAt timestamp instead of disappearing. Never delete an entry by removing it outright — move it to trash the same way, and never empty or edit trash unless I explicitly ask.\n\n'
        + 'To write suggestions, set the top-level "recs" to {"at": "<today>", "items": [{"category": "food", "title": "...", "body": "..."}]}. Base them only on what is already in the ledger. Match the "tone" field: plain, dry, or salty.') + '</code>'
      + '<h3>Stocking Discovery</h3>'
      + '<p>The page is sandboxed and cannot call an API, so the Discovery index holds whatever Claude has put in it. Ask for a search and it appends to the top-level catalog array:</p>'
      + '<code class="snippet">' + esc('{ "id": "unique", "kind": "screen" | "food" | "place" | "live", "title": "...",\n  "year": "2022", "by": "director or creator", "form": "Film | Series | Museum | Landmark | Comedy | Concert",\n  "cuisine": "...", "city": "...", "address": "street address",\n  "venue": "live only", "when": "Oct 3, Sat · 8:30 PM", "date": "2026-10-03",\n  "tags": ["lowercase"], "w": 1-5 how notable, "q": "extra search words",\n  "blurb": "candid overview: what it is, why bother, the drawback",\n  "source": "Wikipedia", "sourceUrl": "https://...",\n  "verifiedAt": "2026-09-15" | null }') + '</code>'
      + '<p>Use only facts that are actually in the source; leave a field out rather than guessing, and the card will say an address is missing. Bump catalogAt to the date. '
      + 'Set verifiedAt to the date you actually confirmed the details against a live source — leave it null if you did not check. Never guess a date just to fill it in.</p>'
      + '</div>' + dlgFoot();
    onClose(dlg);
    dlg.showModal();
  }

  function buildDocument(next) {
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-script').textContent;
    var json = JSON.stringify(next, null, 2).replace(/</g, '\\u003c');
    return [
      '<!doctype html>', '<html lang="en">', '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<title>Dylan\u2019s Ledger</title>',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT_HREF + '">',
      '<style id="app-style">' + css + '<\/style>',
      '</head>', '<body>', BODY_MARKUP,
      '<script id="entry-data" type="application/json">', json, '<\/script>',
      '<script id="app-script">' + js + '<\/script>',
      '</body>', '</html>'
    ].join('\n');
  }

  function setSave(t, text) { save = { tone: t, text: text }; paintSaveBar(); }

  function holdOffline() {
    pendingPersist = true;
    setSave('warn', 'Offline \u2014 will save when back online');
    render();
  }

  function persist() {
    setSave('idle', 'Saving');
    render();
    stashUi();
    writeBuffer(state);
    if (!isOnline()) { holdOffline(); return; }
    if (!window.claude || typeof window.claude.use !== 'function') {
      setSave('warn', 'Not saved \u2014 open this page from its own address');
      render();
      return;
    }
    window.claude.use('artifact').then(function (api) {
      if (!api) { setSave('warn', 'Saving unavailable in this view'); render(); return; }
      return api.publish(buildDocument(state)).then(function () {
        pendingPersist = false;
        clearBuffer();
        setSave('idle', 'Saved'); render();
      });
    }).catch(function (err) {
      var code = err && err.code;
      if (!isOnline()) { holdOffline(); return; }
      if (code === 'conflict') setSave('warn', 'Someone published first \u2014 reloading');
      else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared'
        || code === 'capability_disabled' || code === 'capability_removed' || code === 'consent_required') {
        readOnly = true; setSave('warn', 'This view is read-only');
      }
      else if (code === 'rate_limited') setSave('warn', 'Saving too fast \u2014 wait a moment');
      else if (code === 'too_large') setSave('warn', 'Too large to publish');
      else setSave('warn', 'Could not save \u2014 try again');
      render();
    });
  }

  window.addEventListener('online', function () {
    if (pendingPersist) persist();
  });

  render();
}());
</script>
</body>
</html>
